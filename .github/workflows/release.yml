name: Release

on:
  push:
    branches: [main, develop]
  # Manual fallback: a commit that lands on `main` / `develop` whose
  # message contains a CI-skip keyword (square-bracketed `skip ci` and
  # the four siblings GitHub honours) silently suppresses this
  # workflow. `workflow_dispatch` lets a maintainer kick
  # semantic-release by hand from the Actions tab — pick the branch
  # in the UI's "Use workflow from" dropdown.
  workflow_dispatch:
    inputs:
      installer_tag:
        description: "Build + attach the Windows installers for an EXISTING tag (e.g. v2.41.0), skipping a new release. Blank = normal release run."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  # `--label` and `--assignee` on `gh pr create` (used in the sweep
  # job below) go through the Issues API, so the workflow needs
  # `issues: write` even though the sweep is operating on a PR.
  issues: write
  pull-requests: write

jobs:
  release:
    name: "🚀 Semantic Release"
    runs-on: ubuntu-latest
    # Belt-and-suspenders ref guard — `workflow_dispatch` accepts any
    # ref from the Actions UI / CLI, but semantic-release is configured
    # to release ONLY from `main` (stable) and `develop` (beta). Without
    # this gate, a maintainer who picks a feature branch from the "Use
    # workflow from" dropdown would either fail mid-run or, worse,
    # produce an unintended tag. The `push:` trigger above is already
    # branch-filtered, so this guard is the dispatch-side mirror.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    outputs:
      # Stable tag (e.g. `v1.10.0`) that semantic-release just pushed
      # onto `main`. Empty string when we're on develop, when no
      # publishable commits were found, or when the tag at HEAD is a
      # beta. The sweep job downstream conditions on a non-empty value.
      stable_tag: ${{ steps.detect-stable-tag.outputs.stable_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` alone is not enough — `actions/checkout@v4`
          # defaults to `fetch-tags: false`, and annotated tags aren't
          # reliably accessible to semantic-release without the explicit
          # flag. Without this, semantic-release cannot see prior beta
          # tags on develop and tries to publish v1.0.0-beta.1 from
          # scratch (see #42).
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          # Defensive kill switch for husky hooks. Today semantic-release
          # only creates a tag + GitHub Release (no `git commit` in CI),
          # so this is a no-op. Kept on the step so any future automation
          # that does run a commit (a metrics push, an auto-CHANGELOG
          # plugin, etc.) doesn't get bitten by commitlint's
          # `footer-max-line-length` on bot-generated bodies. Husky 9
          # hooks honour this var only because `.husky/*` scripts check
          # it explicitly — see `.claude/gotchas.md` § GitHub Actions.
          HUSKY: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      - name: Detect newly-created stable tag at HEAD
        id: detect-stable-tag
        # Only meaningful on `main` — develop produces beta tags
        # (v*-beta.N) which we never sweep. The `if:` below skips
        # this step entirely on other branches; the sweep job's own
        # `if:` guard still short-circuits when the output is unset.
        if: github.ref == 'refs/heads/main'
        run: |
          # semantic-release ran in the SAME checkout in the SAME job —
          # any tag it created is already in the local repo, no fetch
          # needed. The previous `git fetch --tags --force origin` line
          # failed with "could not read Username" because
          # `actions/checkout` ran with `persist-credentials: false`, so
          # `.git/config` has no auth after semantic-release returns.
          # The fetch tipped the whole job (and the sweep downstream)
          # into `failure` even though the tag was published — fixed by
          # trusting local state.
          # Pick the FIRST tag pointing at HEAD that matches the stable
          # `vMAJOR.MINOR.PATCH` shape (no -beta suffix). When no new
          # commits triggered a release, no tag points at HEAD and the
          # output stays empty.
          TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          echo "stable_tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "Detected new stable tag at HEAD: $TAG"
          else
            echo "No stable tag at HEAD — sweep job will skip."
          fi

  # Auto-open the canonical `chore/sync-main-into-develop-after-vX.Y.Z`
  # PR right after a stable tag lands on main. Lives in the SAME
  # workflow run as the release job (not as a separate workflow
  # triggered by `release: published` or `push: tags:`) because
  # GitHub Actions refuses to fire downstream workflows on events
  # created by `GITHUB_TOKEN` — the recursion safeguard. semantic-
  # release publishes via that token, so any cross-workflow trigger
  # silently no-ops in production. Running as a downstream job in
  # the same workflow run sidesteps the guard entirely.
  #
  # Repo setting prerequisite: "Allow GitHub Actions to create and
  # approve pull requests" must be enabled at Settings → Actions →
  # General → Workflow permissions. Without it, `gh pr create` from
  # this job fails with "GitHub Actions is not permitted to create
  # or approve pull requests". One-time admin toggle.
  sweep:
    name: "🔁 Post-release main → develop sweep"
    runs-on: ubuntu-latest
    needs: release
    if: |
      github.ref == 'refs/heads/main' &&
      needs.release.outputs.stable_tag != ''
    env:
      TAG: ${{ needs.release.outputs.stable_tag }}
      # Bot-PAT presence as a string so step-level `if:` can read it
      # (GitHub Actions doesn't allow `secrets.X` directly in `if:`
      # expressions; exposing through env is the supported pattern).
      # When truthy, the sweep PR is opened with the bot-PAT identity
      # and auto-merge is enabled — when falsy, the workflow opens
      # the PR with the default GITHUB_TOKEN and the merge stays a
      # manual step (current behaviour, no regression).
      HAS_BOT_TOKEN: ${{ secrets.BUDOJO_BOT_TOKEN != '' && 'true' || 'false' }}
    steps:
      - name: Checkout the release tag
        # Cut the sweep branch from the EXACT tag commit, not from
        # the current main HEAD. If main advances after the tag is
        # published (a hotfix lands while the workflow is still
        # queued), checking out main HEAD would carry those extra
        # commits into the sweep PR — title says "v1.9.0" but the
        # diff includes v1.9.1 changes. Tag checkout keeps the
        # sweep deterministic to ${TAG}.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.release.outputs.stable_tag }}
          persist-credentials: true
          # Use the bot PAT (if configured) so the subsequent
          # `git push` of the sweep branch fires `pr-checks.yml` on
          # the resulting PR. The default GITHUB_TOKEN is suppressed
          # by GitHub's workflow-event recursion guard — pushes
          # authored by it never trigger downstream workflows, so
          # the sweep PR currently lands with no CI and can't
          # auto-merge against branch protection.
          #
          # Falls back to GITHUB_TOKEN when the bot PAT secret isn't
          # configured — in that case the sweep PR opens but stays
          # manual-merge, exactly the behaviour before this change.
          token: ${{ secrets.BUDOJO_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Verify the tag commit is reachable from main
        # Defense-in-depth on top of the tag-shape filter. A
        # stable-looking tag accidentally created on a feature branch
        # would otherwise open a sweep PR from an unmerged commit.
        # Fail fast in that case so we don't silently sweep random
        # changes into develop.
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Tag commit $TAG_SHA is not an ancestor of origin/main; refusing to sweep."
            exit 1
          fi

      - name: Cut sweep branch from the tag
        id: branch
        run: |
          BRANCH="chore/sync-main-into-develop-after-${TAG}"
          git checkout -b "$BRANCH"
          # Idempotent — a re-run (manual workflow_dispatch on this
          # workflow after a transient failure on the auto path)
          # force-updates the existing remote branch instead of
          # deleting it. Deletion under an open PR can mark the PR as
          # having a deleted head (mergeability affected);
          # --force-with-lease keeps the PR alive and refreshes the
          # branch in place.
          git push --force-with-lease -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or update the sweep PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.BUDOJO_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          # PR body passed to gh pr create via --body-file (NOT
          # --body "..."), which is the CLAUDE.md-compatible part —
          # the inline --body shape was getting special-character
          # mangling in practice.
          #
          # CLAUDE.md's general "never use a bash heredoc" guidance
          # targets the heredoc-as-arg-to-gh shape (`gh pr create
          # --body "$(cat <<EOF ... EOF)"`), where the heredoc text
          # is interpolated through shell quoting. The heredoc HERE
          # only writes the body to a file; gh reads it back via
          # --body-file, with no shell-quoting in between. Different
          # context, different rules.
          #
          # The delimiter is intentionally unquoted so `${TAG}`
          # expands from the env: block above. The markdown backticks
          # below are escaped (`\`) so bash doesn't try to
          # command-substitute their content while writing the file.
          cat > /tmp/sweep-body.md <<EOF
          ## What

          Auto-opened by the post-release sweep step (inside the Release workflow run) after the \`${TAG}\` tag landed on \`main\`. Brings the release merge commit from \`main\` back into \`develop\` so semantic-release on the next \`develop\` push reads the right base for the next beta tag.

          > **Merge style:** "Create a merge commit" — NOT squash. Squash erases the parent linkage and breaks downstream merge bookkeeping (memory \`project_release_merge_style.md\`).

          > **Reviewer wait:** none. Alignment-only — no new code, no review surface (memory \`feedback_post_push_reviewer_dance.md\` § Exceptions; superseded \`feedback_release_pr_wait_for_copilot.md\`).

          ## Why

          Without the sweep, \`develop\`'s next beta tag stays on the OLD train (semantic-release can't see the new stable tag from \`develop\`'s history).

          ## What's in the diff

          The release merge commit from main + any commits ahead of develop (should be just the merge commit on a clean release flow).

          ## Manual follow-up

          - **Merge:** if the \`BUDOJO_BOT_TOKEN\` PAT secret is configured, this PR has \`--auto\` merge enabled and will land the moment all required checks pass — no manual click. Without the PAT secret, click "Merge" by hand once CI is green.
          - Add to project board with \`./.claude/scripts/board-set.sh <PR-N> in-progress\` — the workflow does NOT do this today (project-board GraphQL needs hardcoded IDs that live in the helper script, not in the workflow). One-line manual step.

          ## References

          - Release tag: [${TAG}](https://github.com/Budojo/budojo/releases/tag/${TAG})
          - Workflow: \`.github/workflows/release.yml\` § sweep job
          EOF

          # If a PR for this branch already exists (re-run after a
          # transient failure), update its body instead of creating a
          # duplicate.
          EXISTING=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing PR #${EXISTING}"
            gh pr edit "$EXISTING" --body-file /tmp/sweep-body.md
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            echo "Creating new sweep PR"
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "chore: sweep ${TAG} release merge commit from main into develop" \
              --body-file /tmp/sweep-body.md \
              --label "🔧 maintenance" \
              --assignee m-bonanno
            # Look up the PR number via a structured JSON query rather
            # than parsing `gh pr create` stdout — the CLI's output
            # format isn't stable across versions, and a trailing-digit
            # grep can silently miss multi-line output (the next
            # auto-merge step then no-ops without a clear error).
            PR_NUMBER=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::Sweep PR was created but could not be looked up via 'gh pr list' — bailing out before auto-merge."
              exit 1
            fi
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge on the sweep PR
        # Only meaningful when the bot PAT is configured: the
        # GITHUB_TOKEN-authored PR opens without any pr-checks.yml
        # run (recursion guard suppresses the trigger), so `--auto`
        # would sit on a never-merging PR forever. With the PAT,
        # the create-step above ran as a non-bot user, which fires
        # pr-checks.yml on the new PR — this step then enables
        # auto-merge so GitHub merges the moment all required
        # checks land green.
        #
        # **Repo-level prerequisite:** "Allow auto-merge" must be
        # ENABLED at *Settings → General → Pull Requests*. Without
        # the toggle, `gh pr merge --auto` returns a GraphQL
        # `enablePullRequestAutoMerge` error and the workflow turns
        # red even though the sweep PR opened correctly. The step
        # is wrapped to surface that as a `::warning::` instead —
        # we don't want an admin-side toggle missing to fail the
        # whole release run after a tag is already published.
        #
        # Memory `feedback_post_push_reviewer_dance` § Exceptions
        # says the sweep is alignment-only — no reviewer wait, no
        # review surface — so auto-merging the moment CI is green
        # is the documented policy (chore/sync-* is also `if:`-
        # skipped when the reviewer still ran). This memory supersedes
        # the historical `feedback_release_pr_wait_for_copilot`.
        if: env.HAS_BOT_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUDOJO_BOT_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "::warning::No sweep PR number captured — skipping auto-merge."
            exit 0
          fi
          if gh pr merge "$PR" --merge --auto; then
            echo "✅ Auto-merge enabled on PR #${PR} — will merge when required checks pass."
          else
            # Most likely cause: repo's "Allow auto-merge" toggle is off
            # (Settings → General → Pull Requests). Surface this as a
            # warning, not a hard failure — the release tag has already
            # been published at this point and the sweep PR is open;
            # a maintainer can merge it by hand.
            echo "::warning::gh pr merge --auto failed for PR #${PR}. Most common cause: repo-level 'Allow auto-merge' is disabled (Settings → General → Pull Requests). Falling back to manual merge."
          fi

  # Build the Windows desktop installer (NSIS) and attach it
  # to the GitHub Release that semantic-release just created for the stable
  # tag. Lives in THIS workflow run — not a `push: tags` / `release:
  # published` workflow — for the same reason as the sweep job above:
  # semantic-release publishes the tag and Release via GITHUB_TOKEN, and
  # GitHub's recursion guard means token-authored events never trigger a
  # downstream workflow. Running as a job that `needs: release` sidesteps it.
  #
  # Also (re)buildable on demand for an existing tag via the
  # `installer_tag` workflow_dispatch input — e.g. when a first run failed
  # after the tag was already published. That path skips semantic-release
  # and just builds + attaches for the tag given.
  #
  # Windows-only: the shipped runtime is a Windows php.exe (fetch:php extracts
  # with Expand-Archive), and electron-builder's win targets need a Windows
  # host. A failure here shows red so a maintainer can re-run — the tag is
  # already published, so it never rolls anything back.
  desktop-installer:
    name: "🪟 Desktop installer (Windows)"
    runs-on: windows-latest
    needs: release
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.installer_tag != '') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.stable_tag != '')
    env:
      TAG: ${{ github.event.inputs.installer_tag || needs.release.outputs.stable_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          # Build the exact published tag, not main HEAD — a hotfix landing
          # while this job is queued must not slip into the installer. On a
          # manual re-run this is the `installer_tag` input.
          ref: ${{ github.event.inputs.installer_tag || needs.release.outputs.stable_tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up PHP 8.4 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # fileinfo is required transitively (league/flysystem-local) and is
          # NOT enabled by default on the Windows setup-php build — it is on
          # Linux, which is why pr-checks never listed it. The rest mirror the
          # PEST job so composer's platform check passes for every dependency.
          extensions: fileinfo, pdo, pdo_sqlite, mbstring, bcmath, gd, zip, intl
          tools: composer:v2

      - name: Compute version from tag
        id: ver
        shell: bash
        # `v2.41.0` -> `2.41.0`. electron-builder names the artifacts
        # `Budojo <version>.exe` / `Budojo Setup <version>.exe`; the upload
        # step below depends on this exact string.
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install server dependencies (production)
        shell: bash
        working-directory: server
        # --no-dev trims phpunit/phpstan from the shipped vendor.
        # --no-scripts: package:discover / config caching would bake this
        # build host's paths (and need an APP_KEY we don't have here) into
        # bootstrap/cache and ship them; Laravel rediscovers at runtime and
        # the first-run bootstrap (#1223) owns config on the user's machine.
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts --prefer-dist

      - name: Install client dependencies
        shell: bash
        working-directory: client
        run: npm ci

      - name: Install desktop dependencies
        shell: bash
        working-directory: desktop
        run: npm ci

      - name: Build main process + Angular renderer
        shell: bash
        working-directory: desktop
        # `build` compiles main + preload (tsc); `build:renderer` runs
        # `ng build --configuration desktop` in ../client and copies the
        # output to dist/renderer, which electron-builder packs into the asar.
        #
        # BUDOJO_VERSION is what the renderer stamps into the footer (#1337).
        # It has to be told: this checkout is `fetch-depth: 1` at a tag with no
        # tags fetched, so `git describe` returns a bare SHA and the app would
        # report "dev" — which is exactly what every installer did until now.
        env:
          BUDOJO_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          npm run build
          npm run build:renderer

      - name: Fetch the pinned PHP runtime
        shell: bash
        working-directory: desktop
        # Manifest-pinned + sha256-verified; refuses a tampered/truncated
        # download rather than shipping it (scripts/fetch-php.mjs).
        run: npm run fetch:php

      - name: Package the NSIS installer
        shell: bash
        working-directory: desktop
        env:
          # The Google OAuth client for Drive backup sync (#1301, #1331). Baked
          # into the artefact's package.json below, NOT read from the user's
          # environment at launch — which is what it used to do, on machines
          # where these have never been set.
          #
          # Absent secrets are not a failure: `driveClientConfig` answers null,
          # the bridge reports `configured: false`, and the Drive card hides
          # itself. That is the state every release has shipped in so far, and
          # it stays valid — #1320's backup folder covers the same need with no
          # account and no API.
          #
          # The client secret is not a secret for an installed app (Google says
          # so for "Desktop app" clients, and the flow uses PKCE) — it is here
          # so the identity can change without a code edit, not to hide it.
          CLIENT_ID: ${{ secrets.BUDOJO_GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BUDOJO_GOOGLE_CLIENT_SECRET }}
        # Inject the release version so the artifacts are named after the tag
        # (package.json stays at 0.0.0 — semantic-release owns versioning).
        run: |
          npm run package -- --publish never \
            -c.publish.provider=github -c.publish.owner=Budojo -c.publish.repo=budojo \
            -c.extraMetadata.version="${{ steps.ver.outputs.version }}" \
            -c.extraMetadata.budojoGoogleClientId="${CLIENT_ID}" \
            -c.extraMetadata.budojoGoogleClientSecret="${CLIENT_SECRET}"

      - name: Verify the installer was produced
        shell: bash
        working-directory: desktop
        # An empty/half build must fail loudly, not upload nothing silently —
        # the same "a zero exit code doesn't prove it worked" discipline the
        # fetch-php and stale-chunk guards apply elsewhere.
        run: |
          V="${{ steps.ver.outputs.version }}"
          test -f "release/Budojo-Setup-${V}.exe" || { echo "::error::NSIS installer missing"; exit 1; }
          # latest.yml is what electron-updater reads to discover a new version
          # (#1287). Without it every installed copy silently stops updating,
          # and nothing else in the pipeline would notice.
          test -f "release/latest.yml" || { echo "::error::latest.yml missing — installed apps would never see this release"; exit 1; }
          ls -la release/*.exe release/latest.yml

      - name: Attach the installer to the GitHub Release
        shell: bash
        working-directory: desktop
        # semantic-release already created the Release for ${TAG}; --clobber
        # makes a re-run idempotent (replaces assets instead of erroring).
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release upload "${TAG}" \
            "release/Budojo-Setup-${V}.exe" \
            "release/Budojo-Setup-${V}.exe.blockmap" \
            "release/latest.yml" \
            --clobber
