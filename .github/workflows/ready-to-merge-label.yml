name: 🟢 Ready-to-merge label

# Applies (and removes) the `🟢 ready to merge` label from the state of the
# checks themselves, rather than asking a human to remember it (#1460).
#
# It was a manual step, and it lost: 11 of the last 25 merged PRs never got
# the label, because a green pipeline already says "this can go" and a second
# thing to remember adds nothing at the moment you are about to merge. Read
# from CI it becomes information — the board and the PR list can be trusted
# without opening each one.
#
# `check_suite: completed` is the trigger rather than `status`, because the
# repo's gates are GitHub Actions jobs: one suite completing carries all of
# them, so the workflow runs once per push instead of once per job.

on:
  check_suite:
    types: [completed]
  # A PR opened against an already-green head commit gets no new suite, so
  # this evaluates on open/reopen/sync too.
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  # One evaluation per PR at a time; a later push supersedes an in-flight run
  # rather than racing it to a stale verdict.
  group: ready-label-${{ github.event.pull_request.number || github.event.check_suite.head_sha }}
  cancel-in-progress: true

jobs:
  label:
    name: Sync the label with the checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = '🟢 ready to merge';

            // The PRs this event is about. A check_suite carries its own
            // list; a pull_request event is about exactly one.
            const prs = context.eventName === 'pull_request'
              ? [context.payload.pull_request]
              : (context.payload.check_suite.pull_requests ?? []);

            if (prs.length === 0) {
              core.info('No pull request attached to this event — nothing to label.');
              return;
            }

            for (const ref of prs) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: ref.number,
              });

              if (pr.state !== 'open' || pr.draft) {
                core.info(`#${pr.number} is ${pr.draft ? 'a draft' : pr.state} — skipping.`);
                continue;
              }

              // Every check run on the head commit, plus the legacy commit
              // statuses, because "green" has to mean both.
              const runs = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                ...context.repo,
                ref: pr.head.sha,
              });

              // This workflow is itself a check run on the same commit, and
              // it is `in_progress` while it looks — counting itself would
              // mean the label could never be applied.
              const others = runs.filter((r) => r.name !== context.job && r.name !== 'Sync the label with the checks');

              const unfinished = others.filter((r) => r.status !== 'completed');
              const failed = others.filter(
                (r) =>
                  r.status === 'completed' &&
                  !['success', 'neutral', 'skipped'].includes(r.conclusion),
              );
              const statusFailed = combined.state === 'failure' || combined.state === 'error';

              const green = unfinished.length === 0 && failed.length === 0 && !statusFailed;
              const labelled = pr.labels.some((l) => l.name === LABEL);

              if (green && !labelled) {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: pr.number,
                  labels: [LABEL],
                });
                core.info(`#${pr.number}: all checks green — labelled.`);
              } else if (!green && labelled) {
                // Removing matters as much as adding: a label left behind by
                // an earlier green run would claim a PR is ready when its
                // latest push is not.
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: pr.number,
                  name: LABEL,
                });
                core.info(`#${pr.number}: no longer green — label removed.`);
              } else {
                core.info(`#${pr.number}: already correct (green=${green}).`);
              }
            }
