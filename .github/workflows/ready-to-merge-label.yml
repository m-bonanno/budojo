name: 🟢 Ready-to-merge label

# Applies (and removes) the `🟢 ready to merge` label from the state of the
# checks themselves, rather than asking a human to remember it (#1460).
#
# It was a manual step, and it lost: 11 of the last 25 merged PRs never got
# the label, because a green pipeline already says "this can go" and a second
# thing to remember adds nothing at the moment you are about to merge. Read
# from CI it becomes information — the board and the PR list can be trusted
# without opening each one.
#
# `workflow_run` is the trigger, and the choice matters. The obvious one is
# `check_suite: completed` — which is what this workflow shipped with, and it
# never fires: GitHub does not raise check-suite events for check runs created
# by Actions itself, to stop workflows triggering each other forever. The
# first PR it was meant to label got nothing, and the run log said
# `green=false`, evaluated from the `pull_request` event while the gates were
# still running.
#
# `workflow_run` fires when the named workflow FINISHES, which is exactly the
# moment the answer is knowable.

on:
  workflow_run:
    workflows: ['PR Quality Gates']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  # One evaluation per commit at a time; a later push supersedes an in-flight
  # run rather than racing it to a stale verdict.
  group: ready-label-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  label:
    name: Sync the label with the checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = '🟢 ready to merge';

            const run = context.payload.workflow_run;

            // `workflow_run.pull_requests` comes back empty often enough that
            // the head SHA is the safer key — it is what the checks actually
            // attach to.
            let prs = run.pull_requests ?? [];
            if (prs.length === 0) {
              const { data } = await github.rest.pulls.list({
                ...context.repo,
                state: 'open',
                per_page: 100,
              });
              prs = data.filter((p) => p.head.sha === run.head_sha);
            }

            if (prs.length === 0) {
              core.info(`No open pull request at ${run.head_sha} — nothing to label.`);
              return;
            }

            for (const ref of prs) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: ref.number,
              });

              if (pr.state !== 'open' || pr.draft) {
                core.info(`#${pr.number} is ${pr.draft ? 'a draft' : pr.state} — skipping.`);
                continue;
              }

              // Every check run on the head commit, plus the legacy commit
              // statuses, because "green" has to mean both.
              const runs = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                ...context.repo,
                ref: pr.head.sha,
              });

              // This workflow's own check run sits on the same commit and is
              // `in_progress` while it looks, so counting itself would mean
              // the label could never be applied.
              const others = runs.filter((r) => r.name !== 'Sync the label with the checks');

              const unfinished = others.filter((r) => r.status !== 'completed');
              const failed = others.filter(
                (r) =>
                  r.status === 'completed' &&
                  !['success', 'neutral', 'skipped'].includes(r.conclusion),
              );
              const statusFailed = combined.state === 'failure' || combined.state === 'error';

              const green = unfinished.length === 0 && failed.length === 0 && !statusFailed;
              const labelled = pr.labels.some((l) => l.name === LABEL);

              if (green && !labelled) {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: pr.number,
                  labels: [LABEL],
                });
                core.info(`#${pr.number}: all checks green — labelled.`);
              } else if (!green && labelled) {
                // Removing matters as much as adding: a label left behind by
                // an earlier green run would claim a PR is ready when its
                // latest push is not.
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: pr.number,
                  name: LABEL,
                });
                core.info(`#${pr.number}: no longer green — label removed.`);
              } else {
                core.info(`#${pr.number}: already correct (green=${green}).`);
              }
            }
