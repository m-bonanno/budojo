<div class="layout">
  <!-- Mobile topbar (<768px): brand + notification bell + avatar. The
       hamburger off-canvas drawer is retired (#1111) — the bottom tab bar
       is the primary nav. The brand → /dashboard/academy (the owner's home,
       the pi-home Home tab), matching its "go to home" aria-label (#1112). -->
  <header class="topbar" role="banner">
    <a
      routerLink="/dashboard/academy"
      class="topbar__title"
      [attr.aria-label]="'nav.homeAriaLabel' | translate"
      data-cy="topbar-home-link"
    >
      @if (academyLogoUrl(); as url) {
        <img [src]="url" alt="" class="topbar__logo" aria-hidden="true" />
      } @else {
        <!-- Inline so stroke="currentColor" inherits the topbar text color (#99). -->
        <app-brand-glyph class="topbar__logo" />
      }
      Budojo
    </a>
    <!-- In-app notification center (#418). Bell + unread badge + dropdown.
         Kept in the owner topbar on mobile — the bottom bar carries no
         Notifications tab — and sits LEFT of the avatar chip. -->
    <app-notification-bell />
    <a
      routerLink="/dashboard/profile"
      class="topbar__user-link"
      [attr.aria-label]="'nav.profileAriaLabel' | translate"
      data-cy="topbar-user-avatar"
    >
      <app-user-avatar [url]="userAvatarUrl()" [name]="userName()" size="chip" />
    </a>
  </header>

  <!-- Desktop social rail (>=768px) — the shared app-side-rail (#1120),
       mirroring the athlete shell. Hidden on mobile, where the bottom nav
       owns navigation. -->
  <app-side-rail
    data-cy="owner-rail"
    [tabs]="railTabs()"
    [secondary]="railSecondary()"
    [brand]="railBrand()"
    [profile]="railProfile()"
    [notifications]="railNotifications()"
    [ariaLabel]="navAriaLabel()"
  />

  <main class="main">
    <router-outlet />
  </main>

  <!-- Mobile bottom tab bar (<768px) + the role's ➕ create sheet (#1111). -->
  <app-bottom-nav
    class="mobile-nav"
    [tabs]="tabs()"
    [centerAction]="centerAction()"
    [ariaLabel]="navAriaLabel()"
    (centerActivated)="onCreate()"
  />
  <app-create-sheet [actions]="createActions()" [heading]="createTitle()" />

  <!-- Global Cmd/Ctrl-K command palette (#426), hosted once at the shell so
       the shortcut works on every authenticated route. -->
  <app-search-palette />
</div>
