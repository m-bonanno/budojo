<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [closable]="!submitting()"
  [closeOnEscape]="!submitting()"
  [draggable]="false"
  [resizable]="false"
  [breakpoints]="{ '768px': '92vw' }"
  [style]="{ width: '32rem' }"
  (onHide)="onHide()"
  [header]="'community.video.composer.title' | translate"
  data-cy="video-composer-dialog"
>
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="video-composer"
    novalidate
    data-cy="video-composer-form"
  >
    <label class="video-composer__field">
      <span class="video-composer__label">{{
        'community.video.composer.urlLabel' | translate
      }}</span>
      <input
        type="url"
        pInputText
        formControlName="url"
        maxlength="2048"
        autocomplete="off"
        inputmode="url"
        [placeholder]="'community.video.composer.urlPlaceholder' | translate"
        data-cy="video-composer-url"
      />
      <span class="video-composer__hint">{{ 'community.video.composer.urlHint' | translate }}</span>
    </label>

    <label class="video-composer__field">
      <span class="video-composer__label">{{
        'community.video.composer.captionLabel' | translate
      }}</span>
      <textarea
        pTextarea
        formControlName="caption"
        rows="3"
        maxlength="500"
        [placeholder]="'community.video.composer.captionPlaceholder' | translate"
        data-cy="video-composer-caption"
      ></textarea>
    </label>

    @if (submitError(); as err) {
      <p class="video-composer__error" role="alert" data-cy="video-composer-error">
        {{
          (err === 'unreadable'
            ? 'community.video.composer.errorUnreadable'
            : 'community.video.composer.errorGeneric'
          ) | translate
        }}
      </p>
    }

    <footer class="video-composer__actions">
      <p-button
        type="button"
        [label]="'community.video.composer.cancel' | translate"
        severity="secondary"
        [text]="true"
        [disabled]="submitting()"
        (onClick)="onClose()"
        data-cy="video-composer-cancel"
      />
      <p-button
        type="submit"
        [label]="'community.video.composer.submit' | translate"
        [loading]="submitting()"
        [disabled]="form.invalid || submitting()"
        data-cy="video-composer-submit"
      />
    </footer>
  </form>
</p-dialog>
