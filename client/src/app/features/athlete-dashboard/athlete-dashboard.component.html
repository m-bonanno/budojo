<div class="layout">
  <!-- Mobile topbar (<768px): brand + avatar. The hamburger off-canvas
       drawer is retired (#1109) — the bottom tab bar is the primary nav. -->
  <header class="topbar" role="banner">
    <a
      routerLink="/dashboard/me/feed"
      class="topbar__title"
      [attr.aria-label]="'nav.homeAriaLabel' | translate"
      data-cy="topbar-home-link"
    >
      <app-brand-glyph class="topbar__logo" />
      Budojo
    </a>
    <app-notification-bell />
    @if (user(); as topbarUser) {
      <app-user-avatar [name]="topbarUser.full_name" [url]="topbarUser.avatar_url" />
    }
  </header>

  <!-- Desktop social rail (>=768px) — the shared app-side-rail (#1120). Same
       IA as the mobile bottom tab bar; hidden on mobile, where the bottom nav
       owns navigation. -->
  <app-side-rail
    data-cy="athlete-rail"
    [tabs]="tabs()"
    [brand]="railBrand"
    [profile]="railProfile()"
    [notifications]="railNotifications()"
    [ariaLabel]="navAriaLabel()"
  />

  <main class="main">
    <router-outlet />
  </main>

  <!-- Mobile bottom tab bar (<768px) + the role's ➕ create sheet (#1109). -->
  <app-bottom-nav
    class="mobile-nav"
    [tabs]="tabs()"
    [centerAction]="centerAction()"
    [ariaLabel]="navAriaLabel()"
    (centerActivated)="onCreate()"
  />
  <app-create-sheet [actions]="createActions()" [heading]="createTitle()" />
</div>
