          type: string
          format: uri
          nullable: true
          maxLength: 255
          description: Instagram profile URL (#162).
          example: 'https://instagram.com/mariorossi'
        date_of_birth:
          type: string
          format: date
          nullable: true
        belt:
          $ref: '#/components/schemas/Belt'
        stripes:
          type: integer
          minimum: 0
          maximum: 4
        status:
          $ref: '#/components/schemas/AthleteStatus'
        joined_at:
          type: string
          format: date
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          nullable: true
          description: Structured address (#72b), or null when the athlete has none on file.
        created_at:
          type: string
          format: date-time
          nullable: true
        paid_current_month:
          type: boolean
          description: |
            Derived: `true` iff a row exists in `athlete_payments` for this
            athlete with `(year, month) = (NOW()->year, NOW()->month)`. The
            `/athletes` index endpoint eager-loads only the current-month
            payments slice to keep this derivation O(1) per row (no N+1).
        active_carnet:
          type: object
          nullable: true
          description: |
            The athlete's spendable carnet today — inside its validity window
            with entries left — or `null` when they hold none. Lets the roster
            render a balance chip without a per-row call; the index endpoint
            eager-loads the window slice the same way it does for
            `paid_current_month`. When more than one is spendable this is the
            one that expires soonest, i.e. the one that will be charged next.
          required: [id, code, remaining_entries, expires_at]
          properties:
            id:
              type: integer
              format: int64
            code:
              type: string
              example: A7K2
            remaining_entries:
              type: integer
              minimum: 1
            expires_at:
              type: string
              format: date
        fee_tier:
          type: object
          nullable: true
          description: |
            The line of the academy's monthly price list this athlete is on
            (#1381), or `null` when they are on none — the case for every
            athlete until someone moves them, and the one where the academy's
            own `monthly_fee_cents` applies.
          required: [id, label, amount_cents, lessons_per_week]
          properties:
            id:
              type: integer
              format: int64
            label:
              type: string
              example: 2 lezioni
            amount_cents:
              type: integer
              minimum: 0
              example: 5500
            lessons_per_week:
              type: integer
              minimum: 1
              maximum: 14
              example: 2
        payment_coverage:
          type: string
          enum: [monthly, quarterly, half_yearly, annual, carnet, none]
          description: |
            What is paying for this athlete's **current** month (#1402): the
            fee's period when one covers it, otherwise a spendable carnet,
            otherwise nothing.

            Resolved server-side by `App\Support\MonthCoverage`. **The monthly
            fee wins over a carnet**, which is not a decision this field takes
            — it is the rule the carnet ledger has applied since #1380, where a
            month covered by a fee charges no entry. A client that ranked them
            the other way would contradict the ledger it is summarising.

            `paid_current_month` sits beside it and keeps its narrower meaning:
            a carnet is `payment_coverage: carnet` and `paid_current_month:
            false`, because it is not a paid month and the unpaid widget, the
            `?paid` filter and both reminders still read that.
          example: monthly
        attendance_month_count:
          type: integer
          nullable: true
          minimum: 0
          description: |
            How many sessions this athlete attended in the **current calendar
            month** (#1447), by the server's clock.

            Selected only by the roster index, as a `withCount` alias. On
            `GET /athletes/{id}` it is `null` — read that as **"not asked
            for"**, never as zero, which is a real answer meaning someone has
            not trained this month.

            Counts days, not rows: at most one live attendance record exists
            per (athlete, day), enforced on insert, and a day corrected by
            soft-delete-and-reinsert is counted once.
          example: 6
        attendance_total_count:
          type: integer
          nullable: true
          minimum: 0
          description: |
            The same count over the current SEASON (#1447, rescoped in
            #1484) — the academy's training year, resolved from
            `season_start_month`, floored per athlete at their own
            `joined_at`. Same null-means-not-selected rule as
            `attendance_month_count`.

            It counted the athlete's whole history until #1484, which answers
            a question about the gym rather than about this year: a number
            that silently spans three seasons is not comparable between two
            athletes who joined five years apart.

            The two counts answer different questions, and diverge on exactly
            the athlete the roster is most worth spotting: the one with a full
            season of sessions who has not appeared this month.
          example: 214
        billing_period_months:
          type: integer
          enum: [1, 3, 6, 12]
          description: |
            How often this athlete is expected to pay (#1382), in months.
            Not the same question as what they last paid: the app needs the
            expectation to answer "is anyone late", and a payment only says
            what already happened. `1` — monthly — until someone changes it.
          example: 1
        monthly_fee_cents:
          type: integer
          nullable: true
          minimum: 0
          description: |
            What this athlete actually pays each month, in cents (#1381) —
            their tier's amount if they are on one, the academy's flat
            `monthly_fee_cents` otherwise. Resolved server-side so the client
            never re-derives the fallback and the two cannot disagree.

            `null` means neither exists and `POST /athletes/{id}/payments`
            will refuse with 422.
          example: 5500
        user_handle:
          type: string
          nullable: true
          description: |
            Linked-user public handle. Null when the athlete hasn't been
            linked to a user yet, OR when the linked user has no handle.
            The SPA athletes-list shows a "view public profile" icon only
            when this is non-null.
        user_avatar_url:
          type: string
          format: uri
          nullable: true
          description: |
            Linked-user avatar URL (#983). Null when the athlete row has
            no linked user yet OR the user hasn't uploaded an avatar.
            The SPA falls back to an initials placeholder in that case.
            Absolute URL — `Storage::disk('public')->url(...)` resolves
            against `APP_URL`, not `/storage/...`.
        photo_url:
          type: string
          format: uri
          nullable: true
          description: |
            The athlete's own photo (#1357), independent of any linked user
            account — which is the point: `athlete_accounts` is absent from the
            desktop runtime, so before this an athlete on a shipped build could
            never have a picture at all. Null until the first upload.

            The SPA prefers this over `user_avatar_url` and falls back to the
            initials placeholder when both are null.

            Carries a `?v={updated_at}` cache-buster: a same-format replacement
            writes to the same path, so without it the browser would keep
            serving the picture that was just replaced.
        invitation:
          nullable: true
          description: |
            Read-side projection of the single invitation row the SPA's
            athlete-detail card renders (#467, M7 PR-B-UI). Eager-loaded
            on `GET /athletes/{id}` only — index responses always
            carry `null`.

            Lifecycle: `pending` rows are consumable links awaiting the
            athlete; `accepted` rows are post-redemption history (the
            athlete now has a Budojo user). Revoked + expired rows
            stay in the database for audit but are never surfaced
            here — the owner re-invites by sending a new invite, not
            by reading terminal history. Never carries the raw token
            or its sha-256 hash.
          type: object
          required: [id, state, sent_at, expires_at, accepted_at]
          properties:
            id:
              type: integer
              format: int64
            state:
              type: string
              enum: [pending, accepted]
            sent_at:
              type: string
              format: date-time
              description: Most recent send timestamp (`last_sent_at`), falling back to `created_at` on legacy rows. Always non-null when the `invitation` block itself is non-null — `created_at` is a Laravel-managed timestamp column, never absent.
            expires_at:
              type: string
              format: date-time
            accepted_at:
              type: string
              format: date-time
              nullable: true

    AthletePayment:
      type: object
      required: [id, athlete_id, year, month, period_months, amount_cents, paid_at]
      properties:
        id:
          type: integer
          format: int64
        athlete_id:
          type: integer
          format: int64
        year:
          type: integer
          minimum: 2020
          maximum: 2100
          description: Calendar year the covered period starts in.
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: Calendar month the covered period starts in.
        period_months:
          type: integer
          enum: [1, 3, 6, 12]
          description: |
            How many months this one payment covers, counting from
            (`year`, `month`) (#1382). `1` monthly, `3` quarterly, `6`
            half-yearly, `12` annual — the four cases of `BillingPeriod`.

            The period **runs from its start month**, not from a calendar
            quarter: a quarterly recorded for February covers February, March
            and April, and may cross a year boundary.
          example: 3
        amount_cents:
          type: integer
          minimum: 0
          description: |
            Snapshot of the fee that applied to this athlete at recording
            time — their tier's amount if they were on one, the academy's
            flat `monthly_fee_cents` otherwise (#1381) — **times the months
            covered** (#1382). Budojo has nowhere to record a discounted
            annual and does not pretend to.
        paid_at:
          type: string
          format: date-time

    AthletePaymentCreateRequest:
      type: object
      required: [year, month]
      properties:
        year:
          type: integer
          minimum: 2020
          maximum: 2100
          description: Calendar year the covered period starts in.
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: Calendar month the covered period starts in.
        period_months:
          type: integer
          enum: [1, 3, 6, 12]
          description: |
            How many months to cover (#1382). Omit it and the athlete's own
            `billing_period_months` applies, which is monthly for everyone
            until someone changes it. A period that shares a month with one
            already recorded is refused with a 422 on this field.
          example: 3

    Carnet:
      type: object
      required:
        [id, code, athlete_id, total_entries, remaining_entries, price_cents, purchased_at, valid_from, expires_at, is_active]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          minLength: 4
          maxLength: 4
          pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{4}$'
          description: |
            Human-facing handle, unique across all carnets. Generated
            server-side from an alphabet that omits the glyphs misread on a
            handwritten card (no `0`/`O`, no `1`/`I`/`L`).
          example: A7K2
        athlete_id:
          type: integer
          format: int64
        total_entries:
          type: integer
          minimum: 1
          maximum: 255
          description: Snapshot of `academy.carnet_entries` at sale time
        remaining_entries:
          type: integer
          minimum: 0
          description: |
            Derived as `total_entries` minus the number of consumed entries in
            the ledger. Never stored, so it cannot drift.
        price_cents:
          type: integer
          minimum: 0
          description: Snapshot of `academy.carnet_price_cents` at sale time
        purchased_at:
          type: string
          format: date
          description: When money changed hands.
        valid_from:
          type: string
          format: date
          description: |
            When the carnet starts covering sessions. Defaults to the sale and
            may precede it: a carnet dated to cover March pays for training
            already on the register for March. Editable via `PATCH`.
        expires_at:
          type: string
          format: date
          description: |
            `valid_from` + 12 months, recomputed whenever `valid_from` moves.
            The window is always twelve months, so pulling the start back
            spends validity rather than adding it.
        is_active:
          type: boolean
          description: |
            Spendable **today**: inside the validity window and with entries
            left. Consumption asks the same question of the attended date
            instead, so a back-filled session is judged by the coverage that
            was in force when it happened.

    CarnetEntry:
      type: object
      required: [id, carnet_id, attendance_record_id, used_on]
      properties:
        id:
          type: integer
          format: int64
        carnet_id:
          type: integer
          format: int64
        attendance_record_id:
          type: integer
          format: int64
          description: |
            The presence that consumed this entry. Unique across the table —
            one attendance can never consume two entries.
        used_on:
          type: string
          format: date
          description: Copy of the attendance record's `attended_on`

    CarnetCreateRequest:
      type: object
      properties:
        purchased_at:
          type: string
          format: date
          nullable: true
          description: |
            Business date of the sale. Defaults to today when omitted or null.
            May be back-dated; a future date is rejected with 422.
        valid_from:
          type: string
          format: date
          nullable: true
          description: |
            Where the carnet starts covering sessions. Defaults to the sale.
            Set it earlier to count training already on the register — those
            sessions are charged immediately. A future date is rejected.

    CarnetValidityUpdateRequest:
      type: object
      required: [valid_from]
      properties:
        valid_from:
          type: string
          format: date
          description: |
            The new validity start. The expiry moves with it and the ledger is
            rebuilt: sessions are claimed or released at either end.

    AthletePromotionRecordedAtUpdateRequest:
      type: object
      required: [recorded_at]
      properties:
        recorded_at:
          type: string
          format: date
          description: |
            Date-only, matching the timeline's display precision. Must not be
            in the future — a promotion can't be recorded ahead of today.

    AthletePromotionCreateRequest:
      type: object
      description: |
        `from_belt`/`to_belt` are only accepted (and `to_belt` required)
        when `kind=belt`; `from_stripes`/`to_stripes`/`belt_at_event` are
        only accepted (and required) when `kind=stripe`. Sending a
        belt-shaped field with `kind=stripe`, or vice versa, is a 422.
      required: [kind, recorded_at]
      properties:
        kind:
          type: string
          enum: [belt, stripe]
        recorded_at:
          type: string
          format: date
          description: Date-only. Must not be in the future.
        from_belt:
          allOf:
            - $ref: '#/components/schemas/Belt'
          nullable: true
          description: Null on the athlete's first belt assignment. `kind=belt` only.
        to_belt:
          $ref: '#/components/schemas/Belt'
        from_stripes: { type: integer, minimum: 0, maximum: 6 }
        to_stripes: { type: integer, minimum: 0, maximum: 6 }
        belt_at_event:
          allOf:
            - $ref: '#/components/schemas/Belt'
          description: |
            `kind=stripe` only — the belt this stripe happened on. Not
            accepted for `kind=belt`; the server derives it as `to_belt`.

    AthleteEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Athlete'

    AthleteList:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Athlete'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Document ──────────────────────────────────────────────────────────

    DocumentType:
      type: string
      description: Kind of document attached to an athlete
      enum: [id_card, medical_certificate, insurance, other]

    DocumentUploadRequest:
      type: object
      required: [type, file]
      description: |
        Multipart payload. `file` must be a PDF, JPEG, or PNG, at most 10 MB.
        If both `issued_at` and `expires_at` are present, `expires_at` must be
        on or after `issued_at`.
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        file:
          type: string
          format: binary
          description: The document file (application/pdf, image/jpeg, image/png)
        issued_at:
          type: string
          format: date
          nullable: true
        expires_at:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          maxLength: 500
          nullable: true

    DocumentUpdateRequest:
      type: object
      description: |
        Partial metadata update. All fields are optional. The file cannot be
        replaced via PUT — to swap the underlying file, upload a new document
        row and delete the old one.
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        issued_at:
          type: string
          format: date
          nullable: true
        expires_at:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          maxLength: 500
          nullable: true

    AthleteSummary:
      type: object
      description: |
        Minimal athlete identity inlined into a document response when the
        endpoint returns documents across athletes (e.g. `/documents/expiring`).
        For single-athlete endpoints this is omitted.
      required: [id, first_name, last_name]
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string

    Document:
      type: object
      required:
        - id
        - athlete_id
        - type
        - original_name
        - mime_type
        - size_bytes
        - issued_at
        - expires_at
        - notes
        - created_at
      properties:
        id:
          type: integer
          format: int64
        athlete_id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/DocumentType'
        original_name:
          type: string
          description: Original filename at upload time (used in `Content-Disposition` on download)
        mime_type:
          type: string
          description: MIME type at upload time (used in `Content-Type` on download)
        size_bytes:
          type: integer
          format: int64
        issued_at:
          type: string
          format: date
          nullable: true
        expires_at:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Soft-delete marker. **Always present** in the response: `null`
            for active documents, ISO-8601 timestamp for tombstones.
            Tombstone rows are only returned by the list endpoint when it is
            called with `?trashed=1` — active callers (toggle off) never see
            a non-null `deleted_at` because those rows are filtered out.
            When this field is set the physical file has been wiped, so
            `GET /documents/{id}/download` returns 410 Gone.
        athlete:
          $ref: '#/components/schemas/AthleteSummary'

    DocumentEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Document'

    DocumentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Attendance ──────────────────────────────────────────────────────

    AttendanceRecord:
      type: object
      required: [id, athlete_id, attended_on, source]
      properties:
        id:
          type: integer
          format: int64
        athlete_id:
          type: integer
          format: int64
        attended_on:
          type: string
          format: date
          description: YYYY-MM-DD
        notes:
          type: string
          nullable: true
          maxLength: 500
        source:
          type: string
          enum: [instructor, self]
          description: |
            Who marked the presence. `instructor` is the default (and
            backfill for legacy rows) — owner-side widget. `self` is
            pinned by the athlete-side `POST /me/attendance/today`.
        created_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Non-null when the record is a tombstone.

    AttendanceTodayPeer:
      type: object
      required: [id, first_name, last_name_initial, belt]
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name_initial:
          type: string
          description: |
            Single uppercase letter (the initial of the last name) +
            empty string when the last_name is empty. The full
            last_name is intentionally never emitted on this surface.
        handle:
          type: string
          nullable: true
        belt:
          type: string
          description: Backed-enum value of the athlete's current belt.
        avatar_url:
          type: string
          nullable: true

    AttendanceRecordList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'

    MarkAttendancePayload:
      type: object
      required: [date, athlete_ids]
      properties:
        date:
          type: string
          format: date
          description: YYYY-MM-DD. Must be today or within the last 7 days.
        athlete_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64

    AttendanceSummaryRow:
      type: object
      required: [athlete_id, first_name, last_name, count]
      properties:
        athlete_id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        count:
          type: integer
          minimum: 1
          description: Number of active attendance records in the month.

    AttendanceSummaryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceSummaryRow'

    AthleteInvitation:
      type: object
      required: [id, athlete_id, email, expires_at, state, last_sent_at]
      description: |
        Lifecycle row for an athlete-side login invitation (#445, M7 PR-B).
        `state` is derived server-side from the (`accepted_at`, `revoked_at`,
        `expires_at`) triplet — the four states are pairwise mutually
        exclusive. The row's `token` column is intentionally NOT on the wire:
        the column stores a SHA-256 hash and emitting it would give a leaked
        envelope nothing actionable.
      properties:
        id:
          type: integer
        athlete_id:
          type: integer
        email:
          type: string
          format: email
          description: Snapshot of the athlete's email at invite time.
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_sent_at:
          type: string
          format: date-time
          nullable: true
        state:
          type: string
          enum: [pending, accepted, revoked, expired]
          description: |
            Derived server-side. `pending` = un-accepted, un-revoked, expiry
            in the future. The other three are terminal and pairwise mutually
            exclusive with each other and with `pending`.

    SupportTicket:
      type: object
      required: [id, created_at]
      description: |
        Lean response shape for the /support endpoint. Only the row
        id and the persisted timestamp are surfaced — the SPA renders
        a confirmation toast and never re-reads the ticket back. The
        id is stable for an eventual "copy ticket reference" UX.
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    CommunityPostType:
      type: string
      enum: [belt_promotion, stripe_promotion, event, owner_announcement, shared_video]
      description: |
        Discriminator on `payload` shape:
        - `belt_promotion` — emitted by the AthleteObserver when an
          athlete's belt column changes. Payload: `{ athlete_id,
          old_belt, new_belt, promoted_at }`.
        - `stripe_promotion` — emitted by the AthleteObserver on a
          stripes change. Payload: `{ athlete_id, belt, old_stripes,
          new_stripes, promoted_at }`.
        - `event` — owner-authored open mat / seminar / grading.
          Payload carries title + start time + optional location
          (text address, lat, lon nullable).
        - `owner_announcement` — generic owner-side broadcast (also
          the factory default).
        - `shared_video` — athlete- or owner-shared external technique
          video (#1153). Payload: `{ provider, url, video_id,
          thumbnail_url?, title?, author_name?, caption? }`.

    CommunityPostVisibility:
      type: string
      enum: [academy, public]
      description: |
        V1 always emits `academy` (post visible only to the owning
        academy's users). The `public` value is reserved for V2's
        cross-academy timeline; baked into the enum today so the V2
        migration is non-destructive.

    CommunityPostAuthor:
      type: object
      description: |
        Identity flair surfaced on every feed item. Belt comes from
        the linked athlete row; for owner-authored posts it's null and
        the SPA renders the owner variant of `<app-user-flair>`.
      required: [id, first_name, last_name]
      properties:
        id: { type: integer, format: int64 }
        first_name: { type: string }
        last_name: { type: string }
        full_name: { type: string, description: 'Computed accessor — trimmed `first_name + " " + last_name`.' }
        handle: { type: string, nullable: true, description: 'Instagram-style @handle, lowercase letters/numbers/underscore.' }
        avatar_url: { type: string, format: uri, nullable: true }
        belt:
          allOf:
            - $ref: '#/components/schemas/Belt'
          nullable: true
          description: 'Athlete belt color. Null for owner-authored posts.'

    ReactionEmoji:
      type: string
      enum: [clap, pray]
      description: |
        Allowed emoji on `post_reactions` (M9 PR-C). V1 hard-codes a
        short positive-only set — `clap` for "ben fatto" + `pray` for
        "rispetto / namaste". V2 may extend if 2+ academies request
        different defaults (PRD open question).

    PostReaction:
      type: object
      description: |
        One reaction row on a community post — used by the reactions-
        list endpoint (post-v2.9.0). Carries the reactor's identity
        flair so the SPA can render `<app-user-flair>` without a
        second fetch. `user.belt` is null for owner reactions
        (owners don't have athlete rows); the SPA switches to the
        owner flair variant on null.
      required: [id, emoji, created_at, user]
      properties:
        id: { type: integer, format: int64 }
        emoji: { $ref: '#/components/schemas/ReactionEmoji' }
        created_at:
          type: string
          format: date-time
          nullable: true
        user:
          type: object
          required: [id, first_name, last_name, full_name, handle, avatar_url, belt]
          properties:
            id: { type: integer, format: int64 }
            first_name: { type: string }
            last_name: { type: string }
            full_name: { type: string }
            handle:
              type: string
              nullable: true
            avatar_url:
              type: string
              format: uri
              nullable: true
            belt:
              allOf:
                - $ref: '#/components/schemas/Belt'
              nullable: true

    RsvpResponse:
      type: string
      enum: [going, maybe]
      description: |
        RSVP response on an event-type community post (M9 PR-E). Two
        explicit positive values. The absence of a row means "no
        answer" — there is no explicit Declined value (V1 only tracks
        who is coming).

    PublicProfilePromotionKind:
      type: string
      enum: [belt, stripe]
      description: |
        Promotion-event discriminator on the public profile timeline.
        `belt` rows carry `from_belt`/`to_belt`; `stripe` rows carry
        `from_stripes`/`to_stripes`. `belt_at_event` is the canonical
        belt colour at the moment the promotion was recorded —
        present for both kinds.

    PublicProfilePromotion:
      type: object
      required: [id, kind, from_belt, to_belt, from_stripes, to_stripes, belt_at_event, recorded_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/PublicProfilePromotionKind' }
        from_belt: { type: string, nullable: true, description: 'IBJJF belt slug; null on stripe-only rows.' }
        to_belt: { type: string, nullable: true, description: 'IBJJF belt slug; null on stripe-only rows.' }
        from_stripes: { type: integer, nullable: true, minimum: 0, maximum: 6 }
        to_stripes: { type: integer, nullable: true, minimum: 0, maximum: 6 }
        belt_at_event: { type: string, description: 'IBJJF belt slug at the moment the event was recorded. Always present — the column is NOT NULL on every promotion row.' }
        recorded_at: { type: string, format: date-time }

    PublicProfileAchievementKind:
      type: string
      enum: [first_class, '30_day_streak', '100_sessions', '1_year_at_academy', belt_promotion]
      description: |
        Lifetime milestone kind on the public profile achievements row
        (#961). The SPA looks up the glyph per kind (🥋 / 🔥 / 💯 / 🎂 / 🎉).

    PublicProfileAchievement:
      type: object
      required: [kind, unlocked_at]
      properties:
        kind: { $ref: '#/components/schemas/PublicProfileAchievementKind' }
        unlocked_at: { type: string, format: date-time }
        metadata:
          type: object
          nullable: true
          description: |
            Kind-specific extras. Today `belt_promotion` carries
            `{ "belt": "<slug>" }` to remember the awarded belt; the
            other kinds emit `null`.

    PublicProfile:
      type: object
      required: [id, first_name, handle, avatar_url, belt, joined_at, promotions, achievements]
      properties:
        id: { type: integer, format: int64 }
        first_name: { type: string }
        handle:
          type: string
          pattern: '^[a-z][a-z0-9._]{2,29}$'
          description: |
            The target's Instagram-style handle (#479). Non-empty on
            this surface — the route regex 404s before reaching the
            controller when the handle is malformed.
        avatar_url: { type: string, nullable: true, format: uri }
        belt: { type: string, nullable: true, description: 'Current belt slug. Null when the athlete row has no belt yet.' }
        joined_at: { type: string, nullable: true, format: date, description: 'Date the athlete row was registered in this academy.' }
        promotions:
          type: array
          description: 'Top-50 belt + stripe promotions, newest first.'
          items: { $ref: '#/components/schemas/PublicProfilePromotion' }
        achievements:
          type: array
          description: 'Lifetime milestones unlocked by the athlete (#961), newest first.'
          items: { $ref: '#/components/schemas/PublicProfileAchievement' }

    CommunityPost:
      type: object
      required: [id, type, visibility, payload, created_at, created_by, reactions_count, reaction_counts, comments_count, rsvps_count, going_rsvps_count, maybe_rsvps_count, your_reaction, your_rsvp]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/CommunityPostType' }
        visibility: { $ref: '#/components/schemas/CommunityPostVisibility' }
        payload:
          type: object
          additionalProperties: true
          description: |
            Type-discriminated payload. Concrete shape depends on
            `type` — see `CommunityPostType` description. Stored as
            JSON in the database; surfaced verbatim.
        created_at: { type: string, format: date-time }
        created_by: { $ref: '#/components/schemas/CommunityPostAuthor' }
        reactions_count: { type: integer, minimum: 0, description: 'Aggregated total reaction count from `post_reactions`. Always non-negative; may be zero if no users have reacted yet.' }
        reaction_counts:
          type: object
          required: [clap, pray]
          properties:
            clap: { type: integer, minimum: 0 }
            pray: { type: integer, minimum: 0 }
          description: |
            Per-emoji breakdown so the SPA renders the right count
            next to each reaction button (a clap-only post would
            otherwise dump the total on whichever button rendered
            first). `clap + pray == reactions_count`.
        comments_count: { type: integer, minimum: 0, description: 'Aggregated count from `post_comments`. Zero in V1; populated by PR-D.' }
        rsvps_count: { type: integer, minimum: 0, description: 'Aggregated total RSVP count from `post_rsvps` across both response values. `going_rsvps_count + maybe_rsvps_count == rsvps_count`.' }
        going_rsvps_count: { type: integer, minimum: 0, description: 'Per-response aggregated count of RSVPs with `response = going`. Drives the count badge inside the "Going" chip on event posts so a maybe-only post doesn''t dump its total on the going button.' }
        maybe_rsvps_count: { type: integer, minimum: 0, description: 'Per-response aggregated count of RSVPs with `response = maybe`. Mirror of `going_rsvps_count` for the "Maybe" chip.' }
        your_reaction:
          type: string
          enum: [clap, pray]
          nullable: true
          description: 'The caller''s own reaction on this post (PR-C2). Null when the caller has not reacted. Used by the SPA to render reaction buttons in active state on first paint.'
        your_rsvp:
          type: string
          enum: [going, maybe]
          nullable: true
          description: 'The caller''s own RSVP on this post (PR-E2). Always null on non-event posts (no row to find) or when the caller has not RSVPed. Used by the SPA to render RSVP buttons in active state on first paint.'

    PostComment:
      type: object
      required: [id, post_id, body, created_at, created_by]
      description: |
        A 1-level comment on a community post (M9 PR-D). `created_by`
        carries the identity flair (same shape as
        `CommunityPostAuthor`) so the SPA renders the
        "name · @handle · belt" line on each comment with the same
        component used on feed cards.
      properties:
        id: { type: integer, format: int64 }
        post_id: { type: integer, format: int64 }
        body: { type: string, minLength: 1, maxLength: 500 }
        created_at: { type: string, format: date-time }
        created_by: { $ref: '#/components/schemas/CommunityPostAuthor' }

security:
  - bearerAuth: []
