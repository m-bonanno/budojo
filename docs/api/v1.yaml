openapi: 3.0.3
info:
  title: Budojo API
  version: "1.0.0"
  description: |
    REST API powering the Budojo SPA. All authenticated endpoints accept a Laravel Sanctum
    Bearer token obtained via `/auth/login` or `/auth/register`. Academy-scoping is enforced
    in the controllers: every authenticated user has (at most) one academy, and all reads
    and writes are implicitly filtered to that academy.

    Kept in sync with code per the discipline in `CLAUDE.md` §"Documentation discipline" —
    any PR that changes a route, payload, or response shape must update this file in the
    same commit history.

    Budojo ships as a desktop app (M11): the Electron shell runs this same API on a local
    loopback port. The runtime profile is a set of capabilities — on desktop the multi-user
    and networked surfaces (community, athlete accounts, web push, email, breach check) are
    disabled, and a route behind an absent capability answers `404`.
  contact:
    name: Matteo Bonanno
    url: https://github.com/Budojo/budojo

servers:
  - url: http://localhost:8000/api/v1
    description: Local dev (Docker)
  - url: http://127.0.0.1:{port}/api/v1
    description: Desktop — the Electron shell binds an ephemeral loopback port at launch and hands it to the SPA via the preload bridge.
    variables:
      port:
        default: "0"
        description: Ephemeral loopback port chosen at launch; read by the SPA from `window.__BUDOJO__.apiBase`.

tags:
  - name: health
    description: Liveness probe
  - name: runtime
    description: |
      Which runtime profile this API runs as and what it can offer (#1229).

      The same code base serves the hosted web app and the single-user
      desktop app (M11). Surfaces that assume a second human, an inbox or a
      browser push service are **capabilities**; where the profile lacks one,
      its routes answer **404** (never 403 — a surface the runtime does not
      have does not advertise itself). Capabilities: `community`,
      `athlete_accounts`, `web_push`, `email`, `password_breach_check`.
      The desktop profile has none; the web profile has all.
  - name: auth
    description: Registration, login, and Sanctum token issuance
  - name: academy
    description: The tenant entity — one per user
  - name: athletes
    description: |
      Roster of students belonging to the authenticated user's academy.

      **Email-verification gate.** Write endpoints (`POST` / `PUT` / `DELETE` on
      `/athletes` and `/athletes/{id}`) require the authenticated user to have
      verified their email. Unverified users get a `403` with
      `message: 'verification_required'` (see the `VerificationRequired`
      response component); the SPA catches this in its auth interceptor and
      redirects the user to `/dashboard/profile?reason=verify_required`.
      Reads (`GET`) stay open so the user can browse while unverified.
  - name: documents
    description: |
      Files (ID, medical cert, insurance) attached to an athlete, with expiry tracking.

      **Email-verification gate.** Same shape as athletes: writes (`POST` /
      `PUT` / `DELETE`) are gated on `verified.api`; reads stay open. See the
      `VerificationRequired` response component.
  - name: support
    description: |
      Single contact / support channel. Authenticated users file a
      ticket (subject + category + body + optional screenshot); the
      server persists a `support_tickets` row as paper trail and
      queues an email to the support inbox with Reply-To set to the
      user. The legacy `/feedback` endpoint was retired post-v1.17.0
      and folded into this channel via a `feedback` category; tickets
      tagged that way still get a row + email but signal "I'm sharing
      input, no reply expected" to the support inbox.
  - name: Stats
    description: |
      Server-side aggregations for the /dashboard/stats charts.
      Endpoints return pre-bucketed data so the frontend never N+1s
      through the athletes or payments tables.
  - name: community
    description: |
      Academy-scoped social feed (M9). Owners and athletes from the same
      academy see the same posts — belt-promotion celebrations, owner
      announcements, scheduled events. Owner-only soft-delete for
      moderation. Reactions, comments, and RSVPs land in subsequent
      slices (PR-C/D/E); today the feed surfaces the read path + the
      moderation endpoint.
  - name: profile
    description: |
      Athlete-side public profile by handle (#862, M9 social-profile
      epic slice A). Same-academy peers can read each other's basic
      identity card — avatar, first name, current belt, joined date,
      promotions timeline. Three privacy gates (unknown handle,
      opted-out target, cross-academy viewer) all collapse to 404.
  - name: engagement
    description: |
      Social-engagement endpoints introduced with the v2.30.0 train
      (#957): weekly recap (#960), monthly leaderboard (#962). These
      surfaces are read-only aggregations driven by attendance data
      and per-user opt-out flags on `users.*_visible` columns.

paths:

  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: Returns 200 if the API process is up. Does not check DB connectivity.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: The API is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /runtime:
    get:
      tags: [runtime]
      summary: Runtime profile and capabilities
      description: Public. The SPA reads it before login because the register and landing pages already differ by runtime.
      operationId: runtimeShow
      security: []
      responses:
        '200':
          description: The active profile and the capabilities it offers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Runtime'

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: |
        Creates a new user and issues a Sanctum Bearer token. The user is created without
        an academy; the SPA routes newly-registered users to `/setup` via `noAcademyGuard`.

        **Terms-of-Service gate (#420).** The request MUST carry `terms_accepted: true`.
        Missing or falsy values fail validation with `errors.terms_accepted` and the user
        row is NOT created. On success the server stamps `users.terms_accepted_at = now()`
        as the durable record of consent.
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created, token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate and obtain a Bearer token
      description: |
        Validates the supplied email and password against the `users` table and,
        on success, issues a new Sanctum personal access token. The plain-text
        token is returned in the response and must be stored by the client — it
        cannot be retrieved again.

        Rate-limited to 5 attempts per minute per IP via Laravel's standard
        throttle middleware (#414). On the 6th attempt within the window the
        endpoint returns 429 with a `Retry-After` header so the SPA can render
        a countdown before re-enabling the submit button. Successful logins
        count toward the cap as well — the limiter is keyed on the request
        signature, not on response status.

        **Two-factor authentication (#412).** When the user has TOTP 2FA
        active (`two_factor_confirmed_at` is non-null), the password-only
        body returns `422` with `message: "two_factor_required"`. The
        client retries with the additional `two_factor_code` field
        (6-digit TOTP from an authenticator app, or one of the user's
        single-use backup codes — `XXXX-XXXX` format). An invalid code
        returns `422` with `message: "invalid_two_factor_code"`. A valid
        backup code is consumed (removed from the array) on use.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted, token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Invalid credentials.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Throttled (5 attempts / minute / IP). Retry after the `Retry-After` header.
          headers:
            Retry-After:
              description: Seconds the client should wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Too Many Attempts.

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password-reset email
      description: |
        Sends a password-reset email containing a link with a single-use
        opaque token (stored in `password_reset_tokens`; not a signed
        URL — contrast with the email-verification flow which uses
        `URL::signedRoute()`). Always responds with `202 Accepted`
        regardless of whether the email matches a registered user — the
        response is identical for known and unknown addresses to defeat
        account enumeration. Throttled to 6 requests / minute / IP.
      operationId: authForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request accepted; an email is queued only when the address corresponds to a registered user (caller cannot tell either way).
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Throttled (6 requests / minute / IP).

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Consume a reset token and set a new password
      description: |
        Verifies the email + token pair against the `password_reset_tokens`
        table, then writes the new password hash on the user. Tokens
        are one-shot — the matching row is deleted on success, so a
        replay returns 422. Tokens expire 60 minutes after issuance.

        Two distinct 422 shapes the client must handle:

        1. **Form-level validation** (FormRequest fires first):
           missing / malformed `email`, missing `token`, missing
           `password`, password under 8 chars, `password` not
           confirmed, OR `password` rejected by the HaveIBeenPwned
           breach check (#415) — surfaced as
           `errors.password[0] = "password_breached"` so the SPA
           can render a specific actionable message → `errors`
           carries the offending field name (`email` / `token` /
           `password` / `password_confirmation`).

        2. **Broker failures** (token invalid, token expired,
           unknown email, token already consumed): collapsed to an
           `errors.email` payload by the controller — clients should
           treat this as "the link is invalid or has expired" and
           offer a "Request a new link" CTA without trying to
           differentiate which branch failed.
      operationId: authResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: |
            Password updated; the user can sign in with the new
            credentials. The `message` field is a localized human
            string resolved from Laravel's `passwords.reset`
            translation key — the example below shows the English
            value; under an active `it` locale it reads
            "La tua password è stata reimpostata.".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Your password has been reset.
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [auth]
      summary: Fetch the currently authenticated user
      description: |
        Returns the authenticated user resource (including `email_verified_at`).
        The SPA calls this on bootstrap so it can render verification state
        after a page reload without waiting for the next register/login.
      operationId: authMe
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out — revoke the current token
      description: Deletes the personal access token that authenticated this request. Idempotent; the SPA and the desktop shell call it on sign-out before forgetting the token locally.
      operationId: authLogout
      responses:
        '204':
          description: Token revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me:
    patch:
      tags: [auth]
      summary: Update the authenticated user's profile (name)
      description: |
        Self-edit on the authenticated user's profile (#463). Currently
        scoped to `name` only — the email-change flow lands separately
        because it needs a pending-email-changes schema + signed-link
        verification + banner UX.

        The response mirrors `GET /auth/me` so the SPA can swap its
        cached user envelope without an extra round-trip.
      operationId: meUpdateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated user envelope (same shape as `/auth/me`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/email-change:
    post:
      tags: [auth]
      summary: Request an email change with verification
      description: |
        Pending-then-verify email change for the authenticated user
        (#476). Creates a `pending_email_changes` row and queues two
        mails:

        - **Verification mail to the NEW address** — the click on the
          link in the body is the proof the candidate is reachable +
          the auth on the verify endpoint below.
        - **Audit notification to the OLD address** — text-only "if
          this wasn't you, contact support immediately" notice.

        The live `users.email` is NOT mutated here; only on a successful
        click on `POST /email-change/{token}/verify` does the email
        actually flip. Two anti-pattern mitigations drive the pending-
        then-verify split (see entity doc):

        - **Typo lockout** — a typo in the new address would lock the
          user out of their own account if applied immediately.
        - **Hijack vector** — a compromised account could redirect the
          login email to one the attacker controls and harvest
          password-reset tokens; the audit mail to OLD gives the
          legitimate owner a chance to react.

        **Throttle:** 5 requests / hour PER USER (the
        `email-change-request` named limiter, shared with
        `POST /athletes/{id}/email`).

        **Validation rejections (422):**
        - `email_taken` — the candidate is already a different user's email.
        - `email_unchanged` — the candidate equals the user's current email.
      operationId: meRequestEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeRequest'
      responses:
        '202':
          description: |
            The change has been logged; the verification mail is on its
            way to the new address. The live `users.email` is unchanged
            until the click confirms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: verification_link_sent
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/Throttled'
    delete:
      tags: [auth]
      summary: Cancel an outstanding pending email-change
      description: |
        Drop the `pending_email_changes` row for the authenticated
        user (#476). Idempotent — calling when no row exists still
        returns 204. Useful when the user notices a typo immediately
        after submitting the request and wants to revert without
        waiting out the 24h expiry.
      operationId: meCancelEmailChange
      responses:
        '204':
          description: Pending row dropped (or no row existed — both report 204).
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /email-change/{token}/verify:
    post:
      tags: [auth]
      summary: Confirm a pending email change via the signed-link token
      description: |
        Public endpoint hit by the user clicking the link in the
        verification mail (#476). The 64-char raw token in the path
        IS the auth — no Sanctum bearer required. The server hashes
        the token, looks up the matching `pending_email_changes` row,
        applies the change to `users.email` (and `athletes.email` when
        the user is linked to a roster row — state C), stamps
        `email_verified_at = now()`, and deletes the pending row in a
        single transaction.

        **Deliberately does NOT auto-login** the user — the conservative
        anti-leak choice. The SPA's verify page renders a confirmed
        panel and bounces to `/auth/login` so the user signs in with
        the new address.

        Three failure modes collapse into the same 410 response (no
        signal leak between them): unknown token, expired row,
        already-consumed token.
      operationId: verifyEmailChange
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{64}$'
      responses:
        '200':
          description: The change has been applied; the SPA bounces the user to /auth/login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: email_change_confirmed
        '410':
          description: The token is unknown, expired, or has already been consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: invalid_or_expired_link

  /athletes/{id}/email:
    post:
      tags: [athletes]
      summary: Owner-side email change on an athlete (state-aware)
      description: |
        Change an athlete's email — owner only, academy-scoped (#476).
        The action branches on the athlete's lifecycle state and the
        SPA reads the returned `mode` to pick the toast copy:

        - `direct` — no invitation, no `user_id` — `athletes.email` is
          mutated immediately, no mail goes out.
        - `invite_swap` — pending invitation, `user_id === null` —
          the active invitation is revoked, `athletes.email` is
          updated, and a fresh invitation is queued to the new address
          (atomic on the server).
        - `pending` — `user_id !== null` (athlete logged in at least
          once) — the action delegates to `RequestEmailChangeAction`
          against the linked user. `athletes.email` is NOT mutated
          until the athlete confirms via the verification link;
          `ConfirmEmailChangeAction` syncs both columns atomically.

        **Throttle:** 5 requests / hour PER OWNER user (shared
        `email-change-request` budget with `POST /me/email-change`).
      operationId: athleteChangeEmail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAthleteEmailRequest'
      responses:
        '200':
          description: |
            The action ran. The `mode` discriminator tells the SPA
            which side-effects landed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [mode]
                    properties:
                      mode:
                        $ref: '#/components/schemas/EmailChangeMode'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/Throttled'

  /me/password:
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      description: |
        Re-authenticates with the current password and rotates it to a new
        one in a single round-trip. The user is already authenticated via
        Sanctum to even reach the route; the second password check is a
        re-auth gate so a hijacked token alone cannot rotate the credential.

        **Side effects on success.** Every Sanctum personal-access-token
        row belonging to the user is deleted — EXCEPT the one the request
        was authenticated with. Defence-in-depth (a hijacked session is
        invalidated when the legitimate owner rotates the credential)
        without logging the user out of the tab they're using.

        **Validation.**

        - `current_password` must Hash::check against the stored password.
        - `password` policy mirrors registration: `min:8`, `confirmed`
          (matching `password_confirmation`), and the HaveIBeenPwned breach
          check (#415) — a breached password is rejected with
          `errors.password[0] = "password_breached"`.
        - `password` must differ from `current_password` — a no-op rotation
          is rejected with a 422 on the `password` field rather than
          silently succeeding.

        Throttled to 5 requests / minute (Laravel's default IP-based key)
        to defeat brute-force on the current-password gate.
      operationId: meChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated; the surviving Sanctum token continues to authenticate the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Password updated.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Throttle limit exceeded — retry after the `Retry-After` header.

  /me/export:
    get:
      tags: [auth]
      summary: Export the authenticated user's full account data (GDPR Art. 20)
      description: |
        Returns every byte we hold about the authenticated user — academy,
        athletes (with their addresses, payments, attendance, document
        metadata), and personal access tokens — as a single self-describing
        envelope `{ version, exported_at, data }`.

        Two output formats:

        - **default (no `format`)** — `application/json` with a `Content-Disposition: attachment` header
        - **`?format=zip`** — `application/zip` containing `data.json` plus the binary documents under `documents/athlete-{id}/{document-id}-{original-filename}`

        Throttled to **1 request per minute per user** because the ZIP variant
        is heavy on disk + bandwidth, and a tight cap protects against
        accidental loops in client retry logic.
      operationId: meExport
      parameters:
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [json, zip]
            default: json
      responses:
        '200':
          description: Account data download (JSON or ZIP per `format`)
          content:
            application/json:
              schema:
                type: object
                required: [version, exported_at, data]
                properties:
                  version:
                    type: string
                    example: "1.0"
                  exported_at:
                    type: string
                    format: date-time
                  data:
                    type: object
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          description: Throttle limit exceeded — retry after the `Retry-After` header

  /me/deletion-request:
    post:
      tags: [auth]
      summary: Request hard-deletion of the authenticated account (GDPR Art. 17)
      description: |
        Enters the user into a 30-day grace window. After the window
        elapses, a scheduled task hard-deletes the account and the
        full academy + athlete data tied to it.

        Re-auth gate: the request body must include the current
        account password. The user is already authenticated via
        Sanctum to reach this route; the second password check is a
        UX safeguard because the action is irreversible after the
        grace window.

        Idempotent: a second call by the same user while a pending
        deletion already exists returns the EXISTING grace-window
        timestamps rather than restarting the clock — preventing
        indefinite deferral of the actual purge.

        Throttled to 5 calls per minute per user (defeats brute-force
        on the password gate).
      operationId: meDeletionRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: Current account password.
      responses:
        '202':
          description: Grace-window scheduled (or returned existing one if idempotent)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [requested_at, scheduled_for, grace_days]
                    properties:
                      requested_at:
                        type: string
                        format: date-time
                      scheduled_for:
                        type: string
                        format: date-time
                      grace_days:
                        type: integer
                        example: 30
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Throttle limit exceeded.
    delete:
      tags: [auth]
      summary: Cancel a pending account deletion during the grace window
      description: |
        Removes the user's `pending_deletions` row, restoring full
        access. Idempotent: cancelling something that was never
        pending returns 200 with `cancelled: false` rather than
        a 404 — the SPA can call this freely without checking
        state first.
      operationId: meDeletionCancel
      responses:
        '200':
          description: Cancellation result.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [cancelled]
                    properties:
                      cancelled:
                        type: boolean
                        description: True when a pending row existed and was removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/deletion-request/cancel/{token}:
    post:
      tags: [auth]
      summary: Cancel a pending account deletion via the email-link token (no auth)
      description: |
        Public, unauthenticated entry point for the "Cancel deletion"
        CTA in the deletion-confirmation email (#545). The token is
        the 64-char `confirmation_token` from the user's
        `pending_deletions` row, served on the email at request time.

        On success, the row is deleted and the user's account is
        preserved. The token is invalidated by the row delete, so a
        second click on the same link resolves to `cancelled: false`
        — same shape as already-clicked / never-valid /
        already-purged / grace-window-elapsed. The SPA renders one
        "deletion is no longer pending" panel for all of these; we
        don't leak which case the user is in.

        Route binding constrains `{token}` to `[A-Za-z0-9]{64}`, so a
        malformed link 404s before reaching the controller.
      operationId: meDeletionRequestCancelByToken
      # Override the global `security: - bearerAuth: []` — this
      # endpoint is INTENTIONALLY public; the click on the email link
      # IS the auth.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{64}$'
            example: 'a3f2c8d4b9e1f7c2a3f2c8d4b9e1f7c2a3f2c8d4b9e1f7c2a3f2c8d4b9e1f7c2'
          description: |
            One-time `confirmation_token` from `pending_deletions`.
      responses:
        '200':
          description: Cancellation result.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [cancelled]
                    properties:
                      cancelled:
                        type: boolean
                        description: |
                          True when the token matched an active row
                          (with `scheduled_for` still in the future)
                          and the row was removed. False when the
                          token matched nothing (idempotent re-click,
                          never valid, account already purged, or
                          grace window already elapsed).
        '404':
          description: |
            Returned when `{token}` does not match the
            `[A-Za-z0-9]{64}` shape — the route binding rejects the
            request before the controller is reached. A real
            consumed/never-valid token returns 200 with
            `cancelled: false` instead (see above) — the 404 here
            covers ONLY the malformed-shape case.

  /unsubscribe/{userId}/{category}:
    get:
      tags: [auth]
      summary: One-click unsubscribe via signed URL (no auth)
      description: |
        Public, signed-URL endpoint for the unsubscribe footer link
        embedded in non-transactional Mailables (#417). The signed
        URL is built by `App\Support\UnsubscribeUrl::for(User, category)`
        with a 30-day expiry; the framework's `signed` middleware
        validates the signature server-side. Tampered / expired
        signatures get a 403 from the middleware before reaching the
        controller.

        On success, the controller flips
        `users.notification_preferences.{category} = false` and
        302-redirects to the SPA `/unsubscribed?category={category}`
        page. On unknown category / unknown user_id (signature valid
        but the row is gone), it redirects to
        `/unsubscribed?status=invalid` instead.
      operationId: unsubscribeGet
      security: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
            example: 42
        - in: path
          name: category
          required: true
          schema:
            type: string
            example: 'medical_cert_expiry_reminders'
        - in: query
          name: expires
          required: true
          schema:
            type: integer
            description: Unix-time signature expiry from `URL::temporarySignedRoute`.
        - in: query
          name: signature
          required: true
          schema:
            type: string
            description: HMAC signature produced from the app key.
      responses:
        '302':
          description: |
            Redirects to `/unsubscribed?category={category}` on success
            or `/unsubscribed?status=invalid` on unknown user_id /
            unknown category.
        '403':
          description: |
            Signature missing, tampered, or expired (the `signed`
            middleware rejects before the controller fires).
        '404':
          description: Returned for non-numeric `userId` (route binding constraint).
    post:
      tags: [auth]
      summary: One-click unsubscribe via List-Unsubscribe-Post (RFC 8058)
      description: |
        Same effect as the GET — flips the matching preference off —
        but adapted for Gmail / Yahoo's bulk-sender
        `List-Unsubscribe-Post: List-Unsubscribe=One-Click` flow.
        Email clients send a no-body POST and don't render any UI;
        the response is always 200 with an empty body so the client
        doesn't surface server-side errors to the user (RFC 8058 § 3).
      operationId: unsubscribePost
      security: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: category
          required: true
          schema:
            type: string
        - in: query
          name: expires
          required: true
          schema:
            type: integer
        - in: query
          name: signature
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success (empty body).
        '403':
          description: Signature missing, tampered, or expired.
        '404':
          description: Non-numeric `userId`.

  /me/notification-preferences:
    get:
      tags: [auth]
      summary: Read the user's per-category email-notification preferences
      description: |
        Returns the snapshot of toggleable digest / reminder
        categories with their current boolean state (#416).
        Default-opt-in: a category not explicitly stored in the
        underlying JSON resolves to `true`.

        Transactional emails (welcome, password-reset,
        email-verification, account-deletion-*, athlete-invitation)
        are NOT toggleable and are NOT surfaced here. The SPA panel
        labels them in a separate read-only "always sent" block.
      operationId: meNotificationPreferencesShow
      responses:
        '200':
          description: Snapshot of toggleable categories.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: boolean
                    example:
                      medical_cert_expiry_reminders: true
                      unpaid_athletes_digest: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [auth]
      summary: Update one or more email-notification preferences
      description: |
        Accepts a partial map of `{category: bool}` and merges with
        the existing JSON column. Unknown category keys are rejected
        with 422 — the catalog of valid keys mirrors the constants in
        `App\Support\NotificationCategory`. Echoes the full snapshot
        back so the SPA can refresh local state with one request.
      operationId: meNotificationPreferencesUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: object
                  additionalProperties:
                    type: boolean
                  example:
                    medical_cert_expiry_reminders: false
      responses:
        '200':
          description: Full snapshot of the user's notification preferences.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/notifications:
    get:
      tags: [auth]
      summary: In-app notification inbox (latest 20 + unread count)
      description: |
        Backs the bell-icon dropdown in the dashboard topbar (#418).
        Returns the most recent 20 notification rows for the authed
        user (`ORDER BY created_at DESC LIMIT 20`) plus an unread
        count for the badge.

        **Population is deferred** — the inbox surface ships here;
        wiring the existing reminder Actions (medical-cert expiry
        digest, unpaid-athletes monthly digest) to ALSO call
        `$user->notify(...)` alongside their email channel is a
        focused follow-up. Today the `notifications` table is empty
        in production until that follow-up lands.
      operationId: meNotificationsIndex
      responses:
        '200':
          description: Latest notifications + unread count.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, type, title, body, link, read_at, created_at]
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          example: 'App\Notifications\MedicalCertExpiringNotification'
                        title:
                          type: string
                        body:
                          type: string
                        link:
                          type: string
                          nullable: true
                          example: '/dashboard/athletes/42/documents'
                        kind:
                          type: string
                          nullable: true
                          description: Stable category discriminator driving the type badge.
                          example: community_reaction_on_your_post
                        actor:
                          type: object
                          nullable: true
                          description: Who triggered it (avatar + name); null for system notifications (recap, payment, …).
                          required: [name, avatar_url]
                          properties:
                            name:
                              type: string
                            avatar_url:
                              type: string
                              format: uri
                              nullable: true
                              example: 'https://api.budojo.local/storage/avatars/u-42.jpg?v=1716840000'
                        read_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                          nullable: true
                  meta:
                    type: object
                    required: [unread_count]
                    properties:
                      unread_count:
                        type: integer
                        example: 3
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/notifications/{id}/read:
    post:
      tags: [auth]
      summary: Mark a single notification as read
      description: |
        Flips `read_at` to `now()` on the addressed row (#418).
        Idempotent — re-posting on an already-read row does NOT
        advance the timestamp. 404s when the id doesn't belong to
        the authenticated user; the response shape matches the
        "id never existed" branch so an enumeration probe cannot
        recover other users' notification ids.
      operationId: meNotificationsMarkAsRead
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Row updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, read_at]
                    properties:
                      id:
                        type: string
                        format: uuid
                      read_at:
                        type: string
                        format: date-time
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Notification id doesn't belong to the authenticated user.

  /me/notifications/read-all:
    post:
      tags: [auth]
      summary: Bulk mark every unread notification as read
      description: |
        Flips every `read_at IS NULL` row owned by the authenticated
        user (#418). Returns the count that was flipped — `0` when
        the user had no unread notifications.
      operationId: meNotificationsMarkAllAsRead
      responses:
        '200':
          description: Bulk update count.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [marked_read]
                    properties:
                      marked_read:
                        type: integer
                        example: 5
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/onboarding:
    get:
      tags: [auth]
      summary: Current first-run onboarding state for the authenticated user
      description: |
        Surfaces the user's first-run onboarding flags (#424) so the SPA
        can decide whether to render the guided tour / "Getting started"
        checklist on the dashboard home. Three boolean-derived states:

        - `dismissed_at !== null` → user explicitly dismissed the tour;
          the SPA never re-renders it.
        - `completed_steps.length === available_steps.length` → user
          has ticked every step; checklist self-dismisses.
        - Otherwise → checklist + tour both render.
      operationId: meOnboardingShow
      responses:
        '200':
          description: Current onboarding state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [dismissed_at, completed_steps, available_steps]
                    properties:
                      dismissed_at:
                        type: string
                        format: date-time
                        nullable: true
                      completed_steps:
                        type: array
                        items:
                          type: string
                        example: ['add_athlete']
                      available_steps:
                        type: array
                        items:
                          type: string
                        example:
                          [
                            'add_athlete',
                            'log_attendance',
                            'mark_payment',
                            'upload_document',
                            'view_stats',
                          ]
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/onboarding/steps:
    post:
      tags: [auth]
      summary: Mark an onboarding step as completed
      description: |
        Idempotent (#424): re-posting the same step key is a no-op.
        Unknown step keys (anything outside `OnboardingStep::all()`)
        return 422 to keep the column shape disciplined.
      operationId: meOnboardingCompleteStep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step]
              properties:
                step:
                  type: string
                  enum:
                    - add_athlete
                    - log_attendance
                    - mark_payment
                    - upload_document
                    - view_stats
      responses:
        '200':
          description: Step recorded — the full completed list returns.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [completed_steps]
                    properties:
                      completed_steps:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/onboarding/dismiss:
    post:
      tags: [auth]
      summary: Permanently dismiss the first-run onboarding tour
      description: |
        Stamps `onboarding_dismissed_at = now()` (#424). Idempotent —
        re-dismissing does NOT advance the timestamp; the first
        dismissal is the meaningful one. The action is irreversible
        from the SPA today (no "show me the tour again" surface).
      operationId: meOnboardingDismiss
      responses:
        '200':
          description: Dismissal timestamp returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [dismissed_at]
                    properties:
                      dismissed_at:
                        type: string
                        format: date-time
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/login-history:
    get:
      tags: [auth]
      summary: List the last 50 login attempts on the authenticated user (success + failure)
      description: |
        Read-only audit log over the `login_attempts` table (#430).
        Pairs with `/me/sessions` — sessions covers LIVE Sanctum
        tokens, history covers PAST attempts including ones whose
        token has since been revoked or expired.

        Both successful AND failed attempts are surfaced — failed
        bursts are the high-signal compromise event the user wants
        to detect. Rows are sorted newest-first and capped at 50;
        retention on the underlying table is 90 days (enforced by
        the `budojo:purge-expired-login-attempts` cron).

        The `device` field is parsed from the stored User-Agent at
        read time using the same `App\Support\UserAgentLabel` helper
        used by `/me/sessions` ("Chrome on macOS", "Safari on iOS",
        "Unknown device").

        **Privacy**: `ip_address` is personal data per GDPR Art. 4
        (1). Storage justified by Art. 6 (1) (f) — legitimate
        interest in security and audit. Disclosed in the public
        privacy policy and DPA template.
      operationId: meLoginHistoryIndex
      responses:
        '200':
          description: Up to 50 login attempts, newest-first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, success, device, ip_address, created_at]
                      properties:
                        id:
                          type: integer
                        success:
                          type: boolean
                          description: True for a successful login, false for a failed attempt.
                        device:
                          type: string
                          example: 'Chrome on macOS'
                        ip_address:
                          type: string
                          nullable: true
                          example: '203.0.113.42'
                        created_at:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/sessions:
    get:
      tags: [auth]
      summary: List the authenticated user's active sessions (Sanctum tokens)
      description: |
        Surfaces every personal-access-token row tied to the user
        (#413). Backs the "Active sessions" panel on
        `/dashboard/profile`. Rows are returned sorted by
        `COALESCE(last_used_at, created_at) DESC` (most-recently-active
        first); the row that authenticated THIS request is marked with
        `is_current: true`.

        Token `name` is the human-readable device label set at token
        creation by `App\Support\UserAgentLabel` — e.g. "Chrome on
        macOS", "Safari on iOS", or "Unknown device" when the
        originating User-Agent header was empty / unparseable. Older
        tokens minted before #413 still carry the legacy `auth` /
        `athlete-invite-accept` strings.
      operationId: meSessionsIndex
      responses:
        '200':
          description: One row per Sanctum personal-access-token tied to the user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, last_used_at, created_at, is_current]
                      properties:
                        id:
                          type: integer
                          example: 42
                        name:
                          type: string
                          example: 'Chrome on macOS'
                        last_used_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                          nullable: true
                        is_current:
                          type: boolean
                          description: True on the row that authenticated this request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags: [auth]
      summary: Revoke every OTHER active session (keep the current one)
      description: |
        The "logout everywhere except here" pattern (#413). Useful
        when the user suspects compromise on another device or has
        just changed their password. Returns the count of rows that
        were actually revoked so the SPA can flash a confirmation
        toast — `0` when the user only had this session.
      operationId: meSessionsDestroyOthers
      responses:
        '200':
          description: Count of revoked sessions (excluding the current one).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked:
                        type: integer
                        example: 3
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/sessions/{id}:
    delete:
      tags: [auth]
      summary: Revoke a single Sanctum token by id
      description: |
        Drops the row from `personal_access_tokens` (#413). 204 on
        success. 404 when the id doesn't belong to the authenticated
        user — same shape as a never-existed id, so a probe cannot
        enumerate other users' token IDs by status code.

        A user CAN revoke their CURRENT session. The next request
        from that tab gets 401 and the SPA's auth interceptor
        bounces them to /auth/login.

        Route binding constrains `{id}` to digits — non-numeric
        404s before reaching the controller.
      operationId: meSessionsDestroy
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            example: 42
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: |
            Returned when the id doesn't belong to the authenticated
            user, when the id never existed, or when the path fails
            the route binding's digit constraint. The status code is
            the same in all three cases so a probe can't enumerate
            other users' token IDs by status alone — the response
            body shape, however, is NOT normalised across the three
            (the controller emits its own JSON, while route-binding
            failures fall through to Laravel's default 404 page).

  /me/api-tokens:
    get:
      tags: [auth]
      summary: List the authenticated user's API tokens
      description: |
        Surfaces every `kind = 'api'` row in `personal_access_tokens`
        tied to the user (#431). Session tokens (`kind = 'session'`)
        are NOT included here — they live on `/me/sessions`. The
        `meta.available_abilities` array is the catalog the SPA
        renders as the checkbox grid on the "Generate a new token"
        dialog; new tokens MUST pick a non-empty subset.
      operationId: meApiTokensIndex
      responses:
        '200':
          description: API token rows + abilities catalog.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, abilities, last_used_at, expires_at, created_at]
                      properties:
                        id:
                          type: integer
                          example: 42
                        name:
                          type: string
                          example: 'nightly-export-script'
                        abilities:
                          type: array
                          items:
                            type: string
                        last_used_at:
                          type: string
                          format: date-time
                          nullable: true
                        expires_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                          nullable: true
                  meta:
                    type: object
                    required: [available_abilities]
                    properties:
                      available_abilities:
                        type: array
                        items:
                          type: string
                        example:
                          ['athletes:read', 'athletes:write', 'documents:read', 'documents:write']
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [auth]
      summary: Mint a new API token (plaintext returned ONCE)
      description: |
        Creates a fresh Sanctum personal-access-token (#431) with
        `kind = 'api'`, the supplied name, the supplied non-empty
        abilities subset, and an optional `expires_in_days` window
        (1-730 days, null means no expiry). Returns the plaintext
        token in `data.plain_text_token` ONCE — the SPA MUST surface
        it immediately with a copy CTA and a "you won't see this
        again" warning. The string is unrecoverable from the DB after
        the response is dropped.
      operationId: meApiTokensCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, abilities]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: 'nightly-export-script'
                abilities:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  example: ['athletes:read', 'documents:read']
                expires_in_days:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 730
                  example: 30
      responses:
        '201':
          description: Token minted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      [id, name, abilities, expires_at, created_at, plain_text_token]
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      abilities:
                        type: array
                        items:
                          type: string
                      expires_at:
                        type: string
                        format: date-time
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                        nullable: true
                      plain_text_token:
                        type: string
                        description: |
                          The bearer string. Returned ONCE — never
                          retrievable after this response.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: |
            Rate-limited (10/min per user, #1011). Caps unbounded
            token mint per session — each row is a permanent
            credential until revoked. Response carries `Retry-After`.

  /me/api-tokens/{id}:
    delete:
      tags: [auth]
      summary: Revoke an API token
      description: |
        Drops the row from `personal_access_tokens` (#431). 200 on
        success. 404 when the id doesn't belong to the authenticated
        user — same shape as a never-existed id, so a probe cannot
        enumerate other users' token IDs by status code.
      operationId: meApiTokensDestroy
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            example: 42
      responses:
        '200':
          description: Token revoked.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Token id doesn't belong to the authenticated user.

  /me/push-subscriptions:
    get:
      tags: [auth]
      summary: List the authenticated user's Web Push subscriptions
      description: |
        Surfaces every `push_subscriptions` row tied to the user
        (#419). Backs the "Browser notifications" toggle on
        `/dashboard/profile` (SPA half lands in a focused follow-up).
        The response also carries the VAPID public key so the SPA
        can call `PushManager.subscribe()` without a separate
        config fetch.

        **Endpoint privacy** — only the host of each subscription
        endpoint is surfaced (e.g. `fcm.googleapis.com`); the full
        URL is the bearer credential the push vendor uses to route
        messages and is treated as sensitive.

        **`meta.enabled`** is `false` when ANY of VAPID public key /
        private key / subject is missing in the server env — the
        SPA renders the toggle as disabled in that case.
      operationId: meWebPushIndex
      responses:
        '200':
          description: Push subscriptions + VAPID configuration meta.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, endpoint_host, last_seen_at, created_at]
                      properties:
                        id:
                          type: integer
                          example: 17
                        endpoint_host:
                          type: string
                          example: 'fcm.googleapis.com'
                        last_seen_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                          nullable: true
                  meta:
                    type: object
                    required: [vapid_public_key, enabled]
                    properties:
                      vapid_public_key:
                        type: string
                        nullable: true
                      enabled:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [auth]
      summary: Subscribe a browser device for Web Push
      description: |
        Accepts the `PushSubscription.toJSON()` envelope the SPA
        receives from `PushManager.subscribe(...)` (#419) and
        upserts on `(user_id, sha256(endpoint))` — re-subscribing
        the same browser refreshes the keys without creating a
        duplicate row.

        **`endpoint`** must be a fully-formed `https://` URL.
        Non-HTTPS schemes are rejected to prevent SSRF on the
        future server-side fanout that will POST back to the
        endpoint with a VAPID-signed JWT.

        **`keys.p256dh` / `keys.auth`** carry the base64url shape
        from the W3C `PushSubscription` serialisation — anything
        outside the `[A-Za-z0-9_-]` charset is rejected so garbage
        rows can't slip in and fail later at signing time.

        Returns `503` when VAPID public/private/subject is not
        configured on the server.
      operationId: meWebPushStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                  format: uri
                  pattern: '^https://'
                  example: 'https://fcm.googleapis.com/fcm/send/...'
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh:
                      type: string
                      example: 'BJ_...'
                    auth:
                      type: string
                      example: 'r5y6Z...'
      responses:
        '200':
          description: Subscription already existed; keys refreshed. Body shape mirrors the 201 response so the SPA can read `endpoint_hash` on every successful POST.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, endpoint_host, endpoint_hash, created_at]
                    properties:
                      id:
                        type: integer
                      endpoint_host:
                        type: string
                      endpoint_hash:
                        type: string
                        description: SHA-256 hash of the endpoint URL. Lets the SPA match the existing device against the device list, so the "(this device)" pill renders without a follow-up GET.
                        pattern: '^[a-f0-9]{64}$'
                        example: 'd2c8fef9a5b7e1f3c4a6b8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0'
                      created_at:
                        type: string
                        format: date-time
        '201':
          description: New subscription created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, endpoint_host, endpoint_hash, created_at]
                    properties:
                      id:
                        type: integer
                      endpoint_host:
                        type: string
                      endpoint_hash:
                        type: string
                        description: SHA-256 hash of the endpoint URL. Lets the SPA match the just-subscribed device against the device list without a follow-up GET, so the "(this device)" pill renders immediately.
                        pattern: '^[a-f0-9]{64}$'
                        example: 'd2c8fef9a5b7e1f3c4a6b8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0'
                      created_at:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: |
            Rate-limited (30/min per user, #1011). Caps subscribe
            envelope spam — generous for first-session + page-refresh,
            tight against scripts. Response carries `Retry-After`.
        '503':
          description: VAPID keys not configured on the server.

  /me/push-subscriptions/test:
    post:
      tags: [auth]
      summary: Send a one-shot test push to the authenticated user's subscriptions
      description: |
        User-triggered diagnostic ping (#819). Fires a `TestPushNotification`
        via `WebPushChannel` to every active subscription belonging to the
        authenticated user, so the user can self-verify their device's push
        channel is healthy (and we get a one-tap support diagnostic).

        Hardened in #828 against transient channel failures: if
        `Notification::send` throws (e.g. VAPID library raises at signing
        time, push vendor returns a 5xx, an unexpected `\Error` from the
        php extension), the controller catches `\Throwable`, logs the
        exception with full stack trace under the reserved Monolog
        `exception` key, and returns a structured 503 with
        `reason: 'dispatch_failed'` so the SPA can branch on the failure
        and show an explanatory toast instead of a misleading 200.

        The notification uses ONLY the `WebPushChannel` (no database
        channel) so no inbox row is created — the user's inbox stays
        clean of diagnostic pings. Quiet hours suppression is
        inherited from `WebPushChannel`.
      operationId: meWebPushTest
      responses:
        '200':
          description: Test push dispatched to the user's subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sent]
                    properties:
                      sent:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: The authenticated user has no push subscriptions to test against.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: No push subscriptions registered for this user.
        '503':
          description: |
            Notification dispatch threw an exception (VAPID signing
            failure, push vendor 5xx, etc.). The `reason` discriminator
            lets the SPA show a specific error toast instead of a
            generic "something went wrong".
          content:
            application/json:
              schema:
                type: object
                required: [message, reason]
                properties:
                  message:
                    type: string
                    example: Could not dispatch the test notification.
                  reason:
                    type: string
                    enum: [dispatch_failed]
                    example: dispatch_failed
        '429':
          description: |
            Rate-limited (5/min per user, #1011). Tight cap to
            prevent vendor-fanout spam at our expense. Response
            carries `Retry-After`.

  /me/push-subscriptions/{id}:
    delete:
      tags: [auth]
      summary: Revoke a Web Push subscription
      description: |
        Drops the row from `push_subscriptions` (#419). 200 on
        success. 404 when the id doesn't belong to the authenticated
        user — same shape as a never-existed id, so a probe cannot
        enumerate other users' subscription IDs.
      operationId: meWebPushDestroy
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            example: 17
      responses:
        '200':
          description: Subscription revoked.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Subscription id doesn't belong to the authenticated user.

  /me/two-factor:
    get:
      tags: [auth]
      summary: Show the current two-factor enrolment state
      description: |
        Surfaces the user's 2FA enrolment shape for the SPA panel
        (#412). Three states encoded in two booleans:

        - `enabled=false, pending=false` → never enrolled.
        - `enabled=false, pending=true`  → secret minted, awaiting
          TOTP confirmation (the QR-code-shown state).
        - `enabled=true`                 → fully active. `recovery_codes_remaining`
          carries the current backup-code count (drops by one on every
          backup-code login).
      operationId: meTwoFactorShow
      responses:
        '200':
          description: Current 2FA enrolment state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [enabled, pending, recovery_codes_remaining]
                    properties:
                      enabled:
                        type: boolean
                      pending:
                        type: boolean
                      recovery_codes_remaining:
                        type: integer
                        example: 8
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags: [auth]
      summary: Disable two-factor authentication (requires current password)
      description: |
        Wipes `two_factor_secret`, `two_factor_recovery_codes`, and
        `two_factor_confirmed_at` (#412). Requires the current password
        in the request body as a re-auth gate — defense in depth so a
        stolen session cannot strip 2FA without the password.
      operationId: meTwoFactorDestroy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  example: 'correct-horse-battery-staple'
      responses:
        '200':
          description: 2FA disabled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [disabled]
                    properties:
                      disabled:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Password missing or incorrect.
        '429':
          description: |
            Rate-limited (5/min per user). Hard cap to close the
            brute-force window on the disable-by-password gate
            (#1006). Response carries `Retry-After`.

  /me/two-factor/enrol:
    post:
      tags: [auth]
      summary: Mint a TOTP secret and return the provisioning URI
      description: |
        Step 1 of the 3-step enrolment flow (#412). Generates a fresh
        32-character base32 TOTP secret, stores it on the user UNCONFIRMED
        (i.e. `two_factor_confirmed_at` stays null), and returns the
        `otpauth://` URI for QR-code rendering on the SPA. Calling this
        on an already-active 2FA setup returns 422 — the user must
        explicitly `DELETE /me/two-factor` first.

        The secret travels back to the SPA in plaintext so the user can
        type it manually if QR scanning isn't possible. The server-side
        column is encrypted at-rest via Eloquent's `encrypted` cast.
      operationId: meTwoFactorEnrol
      responses:
        '200':
          description: Fresh secret + provisioning URI.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secret, provisioning_uri]
                    properties:
                      secret:
                        type: string
                        example: 'JBSWY3DPEHPK3PXP'
                      provisioning_uri:
                        type: string
                        example: 'otpauth://totp/Budojo:tester%40example.com?secret=JBSWY3DPEHPK3PXP&issuer=Budojo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: 2FA already enabled — call DELETE first to reset.
        '429':
          description: |
            Rate-limited (5/min per user). Hard cap to close the
            brute-force window on the TOTP code (#1006). Response
            carries `Retry-After` so the SPA can render a countdown.

  /me/two-factor/confirm:
    post:
      tags: [auth]
      summary: Confirm enrolment with a TOTP and receive backup codes
      description: |
        Step 2 of the 3-step enrolment flow (#412). The user types the
        6-digit TOTP shown by their authenticator app; on a valid code
        the server flips `two_factor_confirmed_at` to now() and mints
        8 single-use backup codes (`XXXX-XXXX` format). The plaintext
        codes are returned ONCE here — the SPA must surface them with
        a "save these somewhere safe" warning.
      operationId: meTwoFactorConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: 2FA active. Backup codes returned once.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [recovery_codes]
                    properties:
                      recovery_codes:
                        type: array
                        items:
                          type: string
                        example: ['AAAA-2345', 'BCDF-6789']
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: |
            Code missing / malformed, OR no secret was previously
            minted via `/me/two-factor/enrol`, OR 2FA is already
            confirmed for this user.
        '429':
          description: |
            Rate-limited (5/min per user). Hard cap to close the
            brute-force window on the TOTP code (#1006). Response
            carries `Retry-After` so the SPA can render a countdown.

  /me/two-factor/recovery-codes/regenerate:
    post:
      tags: [auth]
      summary: Regenerate 8 fresh backup codes, invalidating the old ones
      description: |
        Mints 8 new single-use backup codes (#412). The previous codes
        are atomically replaced — any unused code in the old set stops
        working. Only callable while 2FA is already active
        (`two_factor_confirmed_at` is non-null); the SPA shouldn't
        surface the action before that point.
      operationId: meTwoFactorRegenerateRecoveryCodes
      responses:
        '200':
          description: Fresh backup codes returned once.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [recovery_codes]
                    properties:
                      recovery_codes:
                        type: array
                        items:
                          type: string
                        example: ['NEWA-2345', 'NEWB-6789']
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: 2FA not active — call /me/two-factor/enrol first.
        '429':
          description: |
            Rate-limited (5/min per user). Hard cap to close the
            brute-force window on the TOTP code (#1006). Response
            carries `Retry-After` so the SPA can render a countdown.

  /me/attendance/today:
    post:
      tags: [attendance]
      summary: Self-register the athlete's presence for today
      description: |
        Athlete-side self-mark (#960). Idempotent: 201 on the first
        call, 200 on subsequent same-day calls (returns the existing
        row, which may carry `source: instructor` if the instructor
        already marked them — the self-mark is a no-op in that case,
        NOT a source flip).

        - 422 when today is not in the academy's `training_days`
        - 404 when the caller has no linked `athletes` row
      operationId: meMarkAttendanceToday
      responses:
        '201':
          description: New self-mark created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AttendanceRecord' }
        '200':
          description: A row already exists for today (idempotent re-call or instructor-marked).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AttendanceRecord' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No athlete profile found for the caller.
        '422':
          description: Today is not a configured training day for the academy.

    delete:
      tags: [attendance]
      summary: Revert the athlete's own self-mark for today
      description: |
        Idempotent — 204 both when a row was deleted and when none
        existed. Returns 403 when today's row was instructor-marked
        (only the instructor can revert their own marks).
      operationId: meUnmarkAttendanceToday
      responses:
        '204':
          description: Row removed (or already absent).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The existing row is instructor-marked; only the instructor can revert it.
        '404':
          description: No athlete profile found for the caller.

  /me/attendance/today/peers:
    get:
      tags: [attendance]
      summary: Peer preview for "Chi viene stasera?" on the self-mark page
      description: |
        Same-academy athletes whose attendance row exists for today.
        Drives the peer-preview row on `/dashboard/me/attendance/today`
        (#958). Server-side caps at 8 rows and filters out athletes
        who opted out via `users.attendance_peer_visible = false`.

        Narrower shape than `AthleteResource` on purpose — only
        `first_name + last_name_initial + handle + belt + avatar_url`,
        no email / phone / fiscal code. Defence-in-depth against
        shoulder-surfing the page in a public space.

        - 404 when the caller has no linked athlete row
        - 200 with `{data: []}` when the user is fine but nobody is
          marked yet
      operationId: meAttendanceTodayPeers
      responses:
        '200':
          description: List of same-academy peers marked for today.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AttendanceTodayPeer' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No athlete profile found for the caller.

  /me/recap:
    get:
      tags: [engagement]
      summary: Weekly recap for the authenticated user
      description: |
        Read-side of the Sunday 19:00 weekly recap push (#960). `week`
        is an ISO Monday in `YYYY-MM-DD` form — server validates
        Monday-only and rejects with 422 otherwise. Mirrors the same
        numbers the push carried (training days, total mat hours at
        1.5 h/session, top three peers by overlap count).

        - 200 when the user has at least one attendance row in the week.
        - 404 when the week is empty (no rows) — the SPA renders an
          "you did not train this week" empty state.
        - 422 when `week` is malformed or not a Monday.
      operationId: meWeeklyRecap
      parameters:
        - in: query
          name: week
          required: true
          schema: { type: string, format: date }
          description: ISO Monday date that anchors the recap week.
      responses:
        '200':
          description: Recap payload for the week.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [iso_week_start, sessions, hours, partners]
                    properties:
                      iso_week_start: { type: string, format: date }
                      sessions: { type: integer, minimum: 1 }
                      hours: { type: number, format: float }
                      partners:
                        type: array
                        maxItems: 3
                        items:
                          type: object
                          required: [first_name, last_name_initial, overlap]
                          properties:
                            first_name: { type: string }
                            last_name_initial: { type: string }
                            overlap: { type: integer, minimum: 1 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No attendance recorded for this week.
        '422':
          description: weekStart is malformed or not a Monday.

  /me/avatar:
    post:
      tags: [auth]
      summary: Upload or replace the authenticated user's avatar
      description: |
        Multipart `avatar` upload (#411). The server stores the original
        bytes under `users/avatars/{user-id}.{ext}` on the public disk
        (extension tracks the upload — `.png`, `.jpg`, `.webp`). The SPA
        renders the image inside a fixed circular frame via CSS
        `object-fit: cover`, so server-side resize is intentionally not
        applied. Replacing an avatar with the same extension overwrites
        in place; replacing with a different extension unlinks the
        orphan from the previous upload.

        Accepts `image/jpeg`, `image/png`, `image/webp`. SVG is intentionally
        rejected on this surface — the academy-logo flow has its own
        hand-rolled SVG sanitiser, and a head-shot doesn't justify that
        surface area. Max size 2 MB.

        The response is the full `User` envelope (mirroring the `/auth/me`
        shape) so the SPA can swap its cached user without a follow-up
        `GET /auth/me`.
      operationId: meUploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: |
            Rate-limited (10/min per user, #1011). Caps the multipart
            upload storage-flood vector — protects the public disk
            from a buggy client retry loop. Response carries
            `Retry-After`.

    delete:
      tags: [auth]
      summary: Remove the authenticated user's avatar
      description: |
        Deletes the stored file and clears `avatar_path`. Returns the user
        envelope with `avatar_url: null`. Idempotent — calling it when no
        avatar is set is a no-op success (still 200), so a refresh-after-toast
        pattern in the SPA can't paper over a stale 404.
      operationId: meDeleteAvatar
      responses:
        '200':
          description: Avatar removed (or no-op when none was set)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /email/verification-notification:
    post:
      tags: [auth]
      summary: Resend the verification email to the authenticated user
      description: |
        Triggers a fresh signed-link verification email. Idempotent — already-verified
        users get a 204 with no email dispatched. Rate-limited to one request per minute
        per user; over-limit calls return 429.
      operationId: authResendVerificationEmail
      responses:
        '204':
          description: Email queued (or no-op if already verified)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          description: Rate limit exceeded — retry after the `Retry-After` header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Too Many Attempts.

  /email/verify/{id}/{hash}:
    get:
      tags: [auth]
      summary: Verify email via signed link (callback from the verification email)
      description: |
        Public endpoint, but the URL is signed (HMAC). Browsers click this from the
        verification email; the controller marks the user verified and bounces them
        to the SPA via `302 Location: ${CLIENT_URL}/auth/verify-success`. Tampered or
        expired signatures redirect to `${CLIENT_URL}/auth/verify-error` instead of
        returning a bare 403 — the SPA renders the explainer page from there.
      operationId: authVerifyEmail
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: hash
          required: true
          schema: { type: string, example: 'a4d3...' }
        - in: query
          name: signature
          required: true
          schema: { type: string }
        - in: query
          name: expires
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '302':
          description: |
            Redirect to the SPA. On success: `${CLIENT_URL}/auth/verify-success`.
            On failure (expired signature, tampered signature, hash mismatch, unknown user):
            `${CLIENT_URL}/auth/verify-error`.
          headers:
            Location:
              schema: { type: string }

  /athlete-invite/{token}/preview:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9]{64}$'
        description: |
          Raw 64-char URL-safe athlete invite token. The DB column stores its
          SHA-256 hash; the action hashes the URL-presented value and looks
          up the row by hash. Malformed tokens fail the route constraint and
          404 before the controller is hit.

    get:
      tags: [auth]
      summary: Pre-fill snapshot for the athlete invite landing page
      description: |
        Public endpoint (#445, M7 PR-C). Returns the athlete name + email +
        academy name for a PENDING invitation; 404 on any other state
        (unknown / accepted / revoked / expired). Throttled at 30/min to
        cap firehose probing — the response leaks nothing in the unknown-
        token path so brute-force is uninteresting.
      operationId: athleteInvitePreview
      responses:
        '200':
          description: Pending invite — fields ready for the SPA pre-fill.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [first_name, last_name, email, academy_name, expires_at]
                    properties:
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
                        format: email
                      academy_name:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
        '404':
          description: Invitation not found, or no longer in pending state.
        '429':
          description: Throttled.

  /athlete-invite/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9]{64}$'

    post:
      tags: [auth]
      summary: Accept an athlete invitation and create the linked user
      description: |
        Public endpoint (#445, M7 PR-C). Consumes a pending invitation:
        validates the token (must hash to a row that is pending), creates
        a `User` row with `role=athlete`, links `athletes.user_id`, marks
        the invitation `accepted_at`, and returns a Sanctum bearer token
        that the SPA drops into its auth state. The token IS the email
        proof — `email_verified_at` is set immediately, no second-step
        verification email. Throttled at 5/min/IP to cap brute-force on
        the token search space (64 chars URL-safe = ~10^115 keyspace,
        but defence in depth is cheap).
      operationId: athleteInviteAccept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation, accept_privacy, accept_terms]
              properties:
                password:
                  type: string
                  minLength: 8
                  description: |
                    New password for the linked user account. Same policy as
                    `RegisterRequest.password`: `min:8` plus the HaveIBeenPwned
                    breach check (#415). A breached password is rejected with
                    `errors.password[0] = "password_breached"`.
                password_confirmation:
                  type: string
                accept_privacy:
                  type: boolean
                accept_terms:
                  type: boolean
      responses:
        '201':
          description: |
            Account created and linked. The `token` is the Sanctum bearer
            for subsequent authenticated calls.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [token, user]
                    properties:
                      token:
                        type: string
                      user:
                        type: object
                        required: [id, name, email, role]
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          email:
                            type: string
                            format: email
                          role:
                            type: string
                            enum: [owner, athlete]
        '422':
          description: |
            Validation failed. `errors.token[0]` carries one of:
            `invite_invalid` (unknown token), `invite_already_accepted`,
            `invite_revoked`, `invite_expired`. `errors.email[0]` may be
            `email_already_registered` (race-window guard against a public
            register hitting the same email between invite-send and
            invite-accept). `errors.password` / `errors.accept_privacy` /
            `errors.accept_terms` carry the standard Laravel validation
            messages.
        '429':
          description: Throttled.

  /academy:
    post:
      tags: [academy]
      summary: Create the authenticated user's academy
      description: |
        One-shot creation. The slug is server-generated as
        `slugify(name) + '-' + 8 random lowercase chars`.
        Attempts to create a second academy for the same user return 409.
      operationId: academyCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademyCreateRequest'
      responses:
        '201':
          description: Academy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: User already has an academy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Academy already exists.
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [academy]
      summary: Fetch the authenticated user's academy
      description: |
        The SPA's `hasAcademyGuard` uses this endpoint to detect first-login state —
        a 404 response routes the user to `/setup`.
      operationId: academyShow
      responses:
        '200':
          description: The user's academy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The user has not set up an academy yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: No academy found.

    patch:
      tags: [academy]
      summary: Update the authenticated user's academy
      description: |
        Partial update of `name` and/or `address`. The `slug` is immutable by
        design — renames keep the original permalink stable. A user without
        an academy gets a 403 `{"message":"Forbidden."}` (same wire contract
        the rest of the API uses for ownership failures), not a 404.
      operationId: academyUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademyUpdateRequest'
      responses:
        '200':
          description: Academy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The authenticated user has no academy to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Forbidden.
        '422':
          $ref: '#/components/responses/ValidationError'

  /academy/logo:
    post:
      tags: [academy]
      summary: Upload or replace the academy logo
      description: |
        Multipart `logo` upload. Replaces the previous logo (the prior file is
        removed from disk). Mime types: `png`, `jpg`, `jpeg`, `svg`, `webp`.
        Max size 2 MB. The response is the full academy resource with the
        fresh `logo_url`.
      operationId: academyUploadLogo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Logo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The authenticated user has no academy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [academy]
      summary: Remove the academy logo
      description: |
        Deletes the stored file and clears `logo_path`. Returns the academy
        resource with `logo_url: null`. No-op when no logo is currently set
        (still 200, idempotent).
      operationId: academyDeleteLogo
      responses:
        '200':
          description: Logo removed (or no-op when none was set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The authenticated user has no academy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /academy/schedules:
    post:
      tags: [academy]
      summary: Schedule a future training_days change (#1094)
      description: |
        Inserts a new row into the academy's schedule history with the
        given `training_days` effective from a future calendar date.
        `effective_from` MUST be strictly after today — same-day changes
        go through `PATCH /api/v1/academy`.

        Invariant: at most ONE pending future schedule per academy at any
        time (the "single pending change" model from the PRD). A second
        POST while a pending row exists returns 422. The owner cancels
        the pending row via `DELETE /api/v1/academy/schedules/{id}`
        before scheduling another.

        Reads of the schedule history are folded into the academy
        resource (`current_schedule`, `next_schedule`, `schedules`) —
        there is no dedicated GET for an index here.
      operationId: academyScheduleStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [training_days, effective_from]
              properties:
                training_days:
                  $ref: '#/components/schemas/TrainingDays'
                effective_from:
                  type: string
                  format: date
                  description: ISO YYYY-MM-DD; must be strictly after today.
                  example: '2026-06-01'
      responses:
        '201':
          description: Schedule change planned
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AcademySchedule'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The authenticated user has no academy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '422':
          $ref: '#/components/responses/ValidationError'

  /academy/schedules/{schedule}:
    delete:
      tags: [academy]
      summary: Cancel a pending future schedule change (#1094)
      description: |
        Deletes the targeted `academy_schedules` row. Only rows with
        `effective_from > today` are deletable — past or today rows are
        immutable and a 422 fires if the caller targets one. Mismatched
        ownership (the row belongs to another academy) collapses to a
        404 so existence isn't leaked across tenants.
      operationId: academyScheduleDelete
      parameters:
        - in: path
          name: schedule
          required: true
          schema:
            type: integer
            format: int64
          description: The schedule row id to cancel.
      responses:
        '204':
          description: Pending schedule cancelled
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The schedule does not belong to the authenticated user's academy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '422':
          description: The schedule is past or today (immutable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /academy/fee-tiers:
    get:
      tags: [academy]
      summary: The academy's monthly price list (#1381)
      description: |
        Returns every fee tier the academy has configured, ordered by
        `lessons_per_week` then `id`. An academy that charges one flat fee
        has none — the empty list is the normal state, not an error, and
        `academies.monthly_fee_cents` is what applies to everyone.

        Each row carries `athletes_count`: how many athletes are on that
        tier. Deleting a tier hands all of them back to the academy's flat
        fee, so the count is what turns that into a decision rather than a
        guess.

        Requires `academy_settings_read`, which every membership role holds.
      operationId: academyFeeTierIndex
      responses:
        '200':
          description: The price list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AcademyFeeTier'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [academy]
      summary: Add a fee tier (#1381)
      description: |
        Creates one line of the price list. `label` must be unique within the
        academy — two tiers with the same name at different prices is a
        mistake, not a use case — and the owner reads the label to pick one,
        so it has to identify.

        Requires `academy_settings_update`: the price list is academy
        configuration, gated by the same capability as the flat fee it
        generalises.
      operationId: academyFeeTierStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademyFeeTierRequest'
      responses:
        '201':
          description: Tier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyFeeTierEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /academy/fee-tiers/{tier}:
    patch:
      tags: [academy]
      summary: Re-price or rename a fee tier (#1381)
      description: |
        Partial update — send only the fields you want to change.

        Re-pricing does **not** rewrite history: `athlete_payments.amount_cents`
        is snapshotted when a payment is recorded, so what athletes already
        handed over stays correct. It changes what the next payment will cost
        for everyone on the tier.

        Requires `academy_settings_update` **in the tier's own academy** —
        the check is against the row, not the caller's active academy, so a
        user with settings rights in academy A cannot re-price academy B.
      operationId: academyFeeTierUpdate
      parameters:
        - $ref: '#/components/parameters/FeeTierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademyFeeTierUpdateRequest'
      responses:
        '200':
          description: Tier updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyFeeTierEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [academy]
      summary: Remove a fee tier (#1381)
      description: |
        Deletes the tier. Athletes on it are **not** deleted with it — the FK
        is `nullOnDelete`, so they fall back to the academy's own
        `monthly_fee_cents`. Removing a price must never remove the people who
        were paying it.

        Requires `academy_settings_update` in the tier's own academy.
      operationId: academyFeeTierDestroy
      parameters:
        - $ref: '#/components/parameters/FeeTierId'
      responses:
        '204':
          description: Tier deleted; athletes on it fall back to the academy fee
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /search:
    get:
      tags: [auth]
      summary: Global search backing the Cmd/Ctrl-K command palette
      description: |
        Free-text search across the authenticated academy's roster (#426).
        Returns up to 20 `Athlete` rows that match `?q=` — same shape as
        the athlete envelope used elsewhere, just unwrapped (no
        pagination links / meta) since the palette is a quick-jump and
        the SPA does not paginate the popover.

        Match semantics mirror `GET /athletes?q=` exactly: the query is
        tokenised on whitespace and applied as AND — every token must
        match (case-insensitive `LIKE %token%`) either `first_name` or
        `last_name`. Empty / whitespace-only `q` returns an empty array
        without touching the DB. Soft-deleted athletes are never
        returned, and the result is implicitly scoped to the
        authenticated user's academy.

        V1 indexes only athletes; future V2 expansion (academy +
        payments) is intentionally left out of scope per the issue.
      operationId: searchAcademy
      parameters:
        - name: q
          in: query
          description: |
            Free-text name search. Tokens are AND-matched across
            `first_name` + `last_name`. Empty / whitespace-only values
            short-circuit to an empty `data` array.
          required: false
          schema:
            type: string
            example: mario
      responses:
        '200':
          description: |
            Up to 20 matching athletes. The array is empty when `q` is
            missing or whitespace-only.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Athlete'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OwnerGateForbidden'

  /athletes:
    get:
      tags: [athletes]
      summary: Paginated list of athletes in the authenticated academy
      description: |
        Returns 20 athletes per page, newest first. Soft-deleted athletes are
        never returned. Optional filters `belt`, `status`, and `q` narrow the
        set; the first two match exactly one enum value, `q` is a free-text
        name search.
      operationId: athleteList
      parameters:
        - name: belt
          in: query
          description: Filter by belt rank
          required: false
          schema:
            $ref: '#/components/schemas/Belt'
        - name: status
          in: query
          description: Filter by enrollment status
          required: false
          schema:
            $ref: '#/components/schemas/AthleteStatus'
        - name: q
          in: query
          description: |
            Free-text search across `first_name` and `last_name`. The query is
            tokenised on whitespace and applied as AND — every token must
            match (case-insensitive `LIKE %token%`) either column. So `mario`
            finds Mario Rossi and Anna Mariotti; `mario ros` finds Mario
            Rossi (token `mario` matches first_name, token `ros` matches
            last_name) but not Marco Rossini. Empty/whitespace-only values
            are ignored and return the unfiltered list.
          required: false
          schema:
            type: string
            example: mario
        - name: paid
          in: query
          description: |
            Filter on the athlete's current-month payment status. `yes`
            returns only athletes with a row in `athlete_payments` for the
            current calendar (year, month); `no` returns only those without
            AND whose `status` is `active` (#805 — payment is not expected
            from inactive athletes, so they're excluded from
            the "owes" view). The asymmetry is deliberate: `paid=yes`
            does NOT carry the same status gate, because an athlete who
            paid earlier in the month and went inactive is still factually
            "paid" and worth surfacing for any caller asking the inverse
            question. Unrecognised values are silently ignored (no filter
            applied). Server-side because the table is paginated — a
            client-side filter would only sweep the current page of 20.
          required: false
          schema:
            type: string
            enum: [yes, no]
        - name: page
          in: query
          description: Page number, starting at 1. Page size is fixed at 20.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: sort_by
          in: query
          description: |
            Column to sort by. `belt` is rank-aware on the full IBJJF scale
            (kids: grey < yellow < orange < green; adults: white < blue <
            purple < brown < black; senior: red-and-black < red-and-white <
            red) via a SQL CASE expression — NOT a lexicographic
            sort on the column value — and chains `stripes desc` + `last_name
            asc` as stable tiebreakers so two athletes at the same belt
            level always render in the same row order. `stripes` is not
            accepted as a primary sort (it's meaningful only as a within-belt
            tiebreaker — a 4-stripe blue above a 0-stripe black is never
            correct); requesting it falls back to the default ordering.
            `attendance_month` and `attendance_total` (#1447) sort on the two
            counts this endpoint selects rather than on a column, and always
            tiebreak on `last_name asc, first_name asc` regardless of
            `sort_order`. Counts are small integers over a roster of hundreds,
            so ties are the common case; without a stable second key the tied
            block reorders between requests and an athlete can land on two
            pages or none. The tiebreak stays ascending because the names are
            a stable key, not a second dimension the caller asked to reverse.

            Unknown values also fall back to the default `created_at desc`.
          required: false
          schema:
            type: string
            enum:
              [
                first_name,
                last_name,
                belt,
                joined_at,
                created_at,
                attendance_month,
                attendance_total,
              ]
        - name: sort_order
          in: query
          description: Sort direction. Defaults to `desc` when `sort_by` is set.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OwnerGateForbidden'

    post:
      tags: [athletes]
      summary: Create an athlete in the authenticated academy
      description: |
        The new athlete is automatically attached to the authenticated user's
        academy — the client does not send `academy_id`. Email uniqueness is
        scoped per academy; a previously soft-deleted row with the same email
        does not block creation.
      operationId: athleteCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteCreateRequest'
      responses:
        '201':
          description: Athlete created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthleteWrite'
        '422':
          $ref: '#/components/responses/ValidationError'

  /athletes/import:
    post:
      tags: [athletes]
      summary: Import a roster from a CSV file
      description: |
        Bulk-create athletes from a spreadsheet (#1346). Guarded by the same
        capability as creating one by hand — anyone who may add an athlete may
        add sixty.

        **Called twice for one import.** The first call sends the file alone
        and answers with the columns found, the mapping guessed, and what every
        row *would* do. The second sends the same file with
        `validate_only=false`, plus a corrected `mapping` if the guess was
        wrong. Nothing is written until that second call.

        `validate_only` **defaults to `true`**, deliberately: a missing flag
        must never be the one that creates sixty athletes.

        The two-step shape is the feature, not caution. A real file's dates are
        ambiguous (`03/04/2019` is 3 April in Europe and 4 March in the US),
        its belts are in another language, and its columns are named by
        whoever made the sheet. No parser settles that reliably — showing the
        owner exactly what would be written does.

        **What the server works out on its own:**

        - The delimiter. Excel in an Italian locale writes `;`, because the
          comma is the decimal separator.
        - A UTF-8 BOM, which Excel writes and never mentions.
        - Which column is which, from Italian or English header names.
        - Belts written as `Blu`, `cintura blu` or `blue`.
        - Dates as `gg/mm/aaaa`, `gg-mm-aa`, ISO, with or without a time.
        - A phone in one column, split into the stored pair. A number with no
          prefix takes the academy's own dial code.

        **Defaults:** `status` is `active` and `joined_at` is today when the
        column is absent; `stripes` is `0`. `belt`, `first_name` and
        `last_name` have none — a request whose mapping lacks any of them is
        refused with `422` naming the missing ones, rather than returning one
        identical error per row.

        **Rows are numbered as Excel shows them**, so the header is row 1 and
        the first athlete is row 2.

        Every row is validated against the same rules as `POST /athletes`. The
        write is one transaction: an import either lands whole or not at all,
        because a half-imported roster cannot be re-run without duplicating
        whatever did land.
      operationId: athletesImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The CSV, max 2 MB and 2000 rows. `.xlsx` is not read —
                    "Save as CSV" is one menu item, and a spreadsheet library
                    is a heavy thing to ship inside a desktop installer.
                validate_only:
                  type: boolean
                  default: true
                  description: |
                    `true` (the default) reports what would happen and writes
                    nothing. `false` performs the import.
                mapping:
                  type: object
                  description: |
                    Field → the header name carrying it. Optional: absent
                    fields fall back to the server's guess, so correcting one
                    wrong column does not mean restating the ones already
                    right. Only the field names in `fields` are accepted; an
                    unknown key is a validation error rather than a silently
                    ignored instruction.
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: |
            The import report. Identical in shape whether or not anything was
            written — `dry_run` says which it was.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [dry_run, delimiter, columns, mapping, fields, imported, skipped, rows]
                    properties:
                      dry_run:
                        type: boolean
                      delimiter:
                        type: string
                        description: The separator detected in the file.
                        example: ';'
                      columns:
                        type: array
                        description: The header row, as written in the file.
                        items: { type: string }
                      mapping:
                        type: object
                        description: The mapping actually used — the caller's, filled out with the guess.
                        additionalProperties: { type: string }
                      fields:
                        type: array
                        description: Every field the import can fill, for building the mapping UI.
                        items: { type: string }
                      imported:
                        type: integer
                        description: Rows written, or that would be written on a dry run.
                      skipped:
                        type: integer
                      rows:
                        type: array
                        items:
                          type: object
                          required: [row, status, values, errors]
                          properties:
                            row:
                              type: integer
                              description: The line number as Excel shows it; the header is row 1.
                            status:
                              type: string
                              enum: [ok, invalid, duplicate]
                              description: |
                                `duplicate` means an athlete of that name is
                                already on the roster, or appeared earlier in
                                this same file. A known date of birth on both
                                sides that differs makes them two people.
                            values:
                              type: object
                              description: The parsed athlete, as it would be created.
                              additionalProperties: true
                            errors:
                              type: object
                              description: Field → messages, for an `invalid` row.
                              additionalProperties:
                                type: array
                                items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthleteWrite'
        '422':
          description: |
            The upload failed validation, or the file cannot be imported as
            mapped — no header row, more rows than one import takes, or a
            required column left unmapped. The last carries `missing`,
            `columns` and `mapping` so the caller can fix the mapping without
            re-reading the file.

  /athletes/{id}:
    parameters:
      - $ref: '#/components/parameters/AthleteId'

    get:
      tags: [athletes]
      summary: Fetch a single athlete
      description: |
        Returns the athlete if it exists and belongs to the authenticated user's
        academy. Soft-deleted athletes are not accessible via this endpoint.
      operationId: athleteShow
      responses:
        '200':
          description: The athlete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthlete'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [athletes]
      summary: Partially update an athlete
      description: All body fields are optional — only the ones present are updated.
      operationId: athleteUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteUpdateRequest'
      responses:
        '200':
          description: Athlete updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthleteWrite'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [athletes]
      summary: Soft-delete an athlete
      description: |
        Sets `deleted_at`; the row is preserved and no longer appears in list
        responses. Cascades soft-delete + file wipe to every document attached
        to the athlete (via `AthleteObserver`) — see the `documents` tag for
        the full policy.
      operationId: athleteDelete
      responses:
        '204':
          description: Soft-deleted successfully. Response body is empty.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthleteWrite'
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{id}/invite:
    parameters:
      - $ref: '#/components/parameters/AthleteId'

    post:
      tags: [athletes]
      summary: Send a login invitation to the athlete
      description: |
        Owner-side endpoint (#445, M7 PR-B). Creates or refreshes a pending
        `AthleteInvitation` row for the athlete and queues a tokenized-link
        email to their address on file. The link carries a 64-char URL-safe
        random bearer token; the DB column stores its SHA-256 hash. Re-clicking
        on an already-pending invite re-uses the same row but replaces the
        token hash, so the URL emitted on a previous send is invalidated. The
        read+write is wrapped in a transaction with a row-level lock on the
        athlete to serialise concurrent calls — without the lock the de-dupe
        would have a TOCTOU window where two threads each create a pending
        row.
        Throttled at 5 requests per minute per user. Body is empty (no user-
        supplied fields; everything is derived from the route-bound athlete).
      operationId: athleteInvite
      responses:
        '201':
          description: Invitation created (or refreshed if pending one existed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AthleteInvitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Either the caller is not the owner of the athlete's academy, or
            the caller is an authenticated owner who hasn't yet verified
            their email. The route lives inside the `verified.api` group, so
            an unverified owner gets `403 { message: "verification_required" }`
            — the SPA's auth interceptor keys on that exact string to redirect
            to the profile page. The non-verification 403 carries the standard
            "This action is unauthorized." body.
        '422':
          description: |
            Either the athlete has no email on file (`email: email_missing`) or
            the athlete's email is already a Budojo user (`email:
            email_already_registered`). Both block invite creation.
        '429':
          description: Throttled.

  /athletes/{id}/invite/resend:
    parameters:
      - $ref: '#/components/parameters/AthleteId'

    post:
      tags: [athletes]
      summary: Resend a pending invitation
      description: |
        Wire-shape identical to `/athletes/{id}/invite` but always returns 200
        (vs 201 on first send) so the SPA can branch on the URL + status. Same
        action under the hood — re-uses the pending row + replaces the token
        hash so the previous email's link is invalidated.
      operationId: athleteInviteResend
      responses:
        '200':
          description: Invitation refreshed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AthleteInvitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Same shape as `/invite`. Either the caller is not the owner of
            the athlete's academy, or the caller is an unverified owner
            (`{ message: "verification_required" }`) — route is inside the
            `verified.api` group.
        '422':
          description: Same shape as `/invite` — `email_missing` / `email_already_registered`.
        '429':
          description: Throttled.

  /athletes/{id}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
      - name: invitationId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the invitation row (`AthleteInvitation.id`).

    delete:
      tags: [athletes]
      summary: Revoke a pending invitation
      description: |
        Sets `revoked_at`; the row is preserved as audit trail. Idempotent on
        already-terminal invites (accepted / revoked / expired): returns 204
        regardless. Returns 404 when the invitation does not belong to the
        path-bound athlete (defence-in-depth against crafted URLs).
      operationId: athleteInviteRevoke
      responses:
        '204':
          description: Revoked (or no-op).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Same shape as `/invite`. Either the caller is not the owner of
            the athlete's academy, or the caller is an unverified owner
            (`{ message: "verification_required" }`) — route is inside the
            `verified.api` group.
        '404':
          description: |
            Invitation not found, or the bound invitation does not belong
            to the path-bound athlete. The two cases share the same Laravel
            `ModelNotFoundException` body so a caller cannot distinguish
            "doesn't exist" from "exists for a different athlete".

  /athletes/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/AthleteId'

    get:
      tags: [documents]
      summary: Paginated list of documents for the given athlete
      description: |
        Returns up to 50 documents for the athlete, newest `created_at` first.
        By default only non-soft-deleted rows are returned. Pass `?trashed=1`
        to include soft-deleted "tombstone" rows — their `deleted_at` field is
        non-null and the file has been wiped from disk (see PRD P0.7b).
      operationId: athleteDocumentList
      parameters:
        - name: trashed
          in: query
          description: |
            Opt-in flag. The only supported/defined value is `1`, which
            includes soft-deleted documents (tombstones) in the response.
            Omit the parameter to receive only active rows. Tombstones are
            identified by `deleted_at` being non-null.
          required: false
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: Paginated list of documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthlete'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [documents]
      summary: Upload a document for the given athlete
      description: |
        Multipart upload. The file is stored on the private `local` disk under
        `storage/app/private/documents/` and is NEVER reachable from the web
        root — only via `GET /documents/{id}/download`. Server-side validates
        size (max 10 MB) and MIME type (`application/pdf`, `image/jpeg`,
        `image/png`); client pre-validation is advisory only.
      operationId: athleteDocumentUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
      responses:
        '201':
          description: Document created and file stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthleteWrite'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /documents/expiring:
    get:
      tags: [documents]
      summary: Documents expiring in the next N days (or already expired)
      description: |
        Cross-athlete, scoped to the authenticated academy. Returns every
        document with `expires_at` ≤ today + `days` (default 30), ordered
        `expires_at` ascending so the most urgent item is first. Already
        expired documents are included. Documents with `expires_at = null`
        are excluded. Each item inlines an `athlete` summary (id, first_name,
        last_name) for deep-linking from the dashboard widget.
      operationId: documentExpiring
      parameters:
        - name: days
          in: query
          description: |
            Look-ahead window in days. Clamped server-side to [1, 365];
            values outside the range are silently corrected.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: |
            Composite documents-health envelope. `data` is the expiring/expired
            document list (existing shape). `missing_medical_certificate`
            (#881) lists ACTIVE athletes in the academy with no live row of
            `type=medical_certificate`. Same CONI/insurance risk surface as
            an expired certificate — the SPA widget combines both into one
            "needs attention" count.
          content:
            application/json:
              schema:
                type: object
                required: [data, missing_medical_certificate]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                    description: Documents whose `expires_at` is in the past OR within `days`. Ordered by `expires_at` ascending.
                  missing_medical_certificate:
                    type: array
                    description: Active athletes with no live medical-certificate row.
                    items:
                      type: object
                      required: [id, first_name, last_name]
                      properties:
                        id: { type: integer, format: int64 }
                        first_name: { type: string }
                        last_name: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OwnerGateForbidden'

  /documents/{id}/download:
    parameters:
      - $ref: '#/components/parameters/DocumentId'

    get:
      tags: [documents]
      summary: Stream the document file
      description: |
        Authenticated file stream. Response body is the raw file bytes;
        `Content-Type` is the stored `mime_type`; `Content-Disposition`
        includes the original filename. A missing file on disk (e.g. wiped
        out-of-band) returns 404. A soft-deleted document — visible in the
        list via `?trashed=1` as a tombstone — returns **410 Gone**: the
        resource once existed but its file has been permanently wiped.
      operationId: documentDownload
      responses:
        '200':
          description: File stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: |
            The document is soft-deleted (tombstone). The DB row still exists
            (so the client can still render it as a cancelled entry) but the
            file has been physically removed from disk and cannot be
            re-downloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: This document has been cancelled and is no longer available.

  /documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'

    put:
      tags: [documents]
      summary: Partially update document metadata
      description: |
        Only `type`, `issued_at`, `expires_at`, and `notes` are updateable.
        The request cannot replace the file — to swap the file, upload a new
        document row and delete the old one.
      operationId: documentUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdateRequest'
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenDocumentWrite'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [documents]
      summary: Soft-delete the document and wipe its file
      description: |
        Soft-deletes the DB row (`deleted_at`) AND removes the physical file
        from disk via `Storage::delete`. No restore path. Idempotent if the
        file is already missing on disk.
      operationId: documentDelete
      responses:
        '204':
          description: Deleted. Response body is empty.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenDocumentWrite'
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athlete}/payments:
    get:
      tags: [athletes]
      summary: List an athlete's payments touching a given year
      description: |
        Returns every `AthletePayment` whose covered period **touches** the
        given year, in calendar order. Touching, not starting in (#1382): a
        quarterly bought in December 2025 pays for January and February 2026,
        and the twelve-month table cannot render those months as covered
        without the row behind them. The client spreads each payment across
        the cells it covers, reading `year`, `month` and `period_months`.

        Defaults to the current calendar year when `?year` is omitted.
        Cross-academy access returns 403.
      operationId: athletePaymentList
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: year
          in: query
          required: false
          schema: { type: integer, minimum: 2020, maximum: 2100 }
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AthletePayment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthlete'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [athletes]
      summary: Record an athlete's payment for a (year, month)
      description: |
        Records a payment covering `period_months` from `(year, month)`
        (#1382) — one row, one amount, one receipt, whatever its length.
        **Idempotent**: POSTing the same `(year, month, period_months)` twice
        returns the existing row instead of creating a duplicate. Re-posting
        the same start month with a *different* length is refused with a 422
        instead — the caller is asking for something else.

        A period sharing a month with one already recorded is refused with a
        422 on `period_months`. The unique index cannot catch that on its own:
        a March monthly and a February quarterly start in different months and
        both cover March. `amount_cents` on the resulting
        row is snapshotted from **the fee that applies to this athlete** —
        their price tier's amount if they are on one, the academy's flat
        `monthly_fee_cents` otherwise (#1381). Future fee, tier, or
        tier-membership changes do NOT rewrite past records.

        Returns 422 when no fee applies at all: the athlete is on no tier
        **and** `academy.monthly_fee_cents` is null. An athlete on a tier is
        payable even when the academy has no flat fee. The athlete resource's
        `monthly_fee_cents` is the resolved amount, so a client can tell
        upfront. Cross-academy returns 403.
      operationId: athletePaymentRecord
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthletePaymentCreateRequest'
      responses:
        '201':
          description: Payment recorded (or returned existing row on idempotent retry)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AthletePayment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthlete'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /athletes/{athlete}/payments/{year}/{month}:
    delete:
      tags: [athletes]
      summary: Undo the payment covering a month
      description: |
        Hard-deletes the payment **covering** `(athlete, year, month)` —
        whichever month its own period started in (#1382). The owner looking
        at April clicks unmark and the quarterly bought in February comes off;
        keying on the start month would make a quarterly undeletable from two
        of the three months it pays for.

        The **whole period** goes. One payment, one receipt, one deletion:
        releasing a single month would leave the amount no longer matching
        what it covers, and a partial refund is an accounting event Budojo
        does not model.

        The table has no soft-delete tombstone — the absence of a covering
        row IS the canonical "not paid" state. Returns 404 if nothing covers
        the given month; cross-academy access returns 403.
      operationId: athletePaymentDelete
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: year
          in: path
          required: true
          schema: { type: integer, minimum: 2020, maximum: 2100 }
        - name: month
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '204':
          description: Payment deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthlete'
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athlete}/carnets:
    get:
      tags: [athletes]
      summary: List an athlete's entry carnets
      description: |
        Returns every carnet the athlete has ever held, newest purchase
        first. `remaining_entries` is derived by counting the consumption
        ledger — it is never stored — so it cannot drift from the entries
        actually used. Cross-academy access returns 403.
      operationId: athleteCarnetList
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: List of carnets
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Carnet'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthlete'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [athletes]
      summary: Sell an entry carnet to an athlete
      description: |
        Sells one carnet. `code`, `total_entries` and `price_cents` are all
        generated or snapshotted server-side and are never accepted from the
        client: the pack size and price come from the academy's
        `carnet_entries` / `carnet_price_cents` settings at the moment of
        sale, so a later price change does NOT rewrite carnets already sold.

        `expires_at` is computed as `purchased_at` + 12 months and stored.
        `purchased_at` defaults to today and may be back-dated (transcribing
        a paper register) but never post-dated.

        Returns 422 when either half of the academy's carnet offering is
        unconfigured — the `errors` object names whichever field is missing.
        Cross-academy returns 403.
      operationId: athleteCarnetSell
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarnetCreateRequest'
      responses:
        '201':
          description: Carnet sold
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Carnet'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthlete'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /athletes/{athlete}/carnets/{carnet}/entries:
    get:
      tags: [athletes]
      summary: List the sessions a carnet paid for
      description: |
        The consumption register for one carnet, most recent session first —
        the answer to "where did my ten entries go".

        Returns 403 when the carnet does not belong to the athlete in the
        path, as well as on cross-academy access: pairing someone else's
        carnet id with an athlete you can reach must not expose it.
      operationId: athleteCarnetEntryList
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: carnet
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Consumed entries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CarnetEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthlete'
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athlete}/carnets/{carnet}:
    patch:
      tags: [athletes]
      summary: Move a carnet's validity start
      description: |
        The only editable field on a carnet: code, price and pack size are
        snapshots of the sale, and the expiry is derived. Moving `valid_from`
        drags `expires_at` twelve months behind it and recomputes which
        sessions the carnet pays for — in either direction, so pushing the
        start forward releases sessions as surely as pulling it back claims
        them.

        403 when the carnet does not belong to the athlete in the path.
      operationId: athleteCarnetUpdateValidity
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: carnet
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarnetValidityUpdateRequest'
      responses:
        '200':
          description: The updated carnet, with the recomputed balance
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Carnet'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthlete'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [athletes]
      summary: Undo a carnet sold by mistake
      description: |
        Removes the carnet. The sessions it paid for **stay on the attendance
        register** — they are a record of what happened, not a payment — and
        become uncovered, unless another carnet's window can take them.

        403 when the carnet does not belong to the athlete in the path.
      operationId: athleteCarnetDelete
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: carnet
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Carnet deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenAthlete'
        '404':
          $ref: '#/components/responses/NotFound'

  /attendance:
    get:
      tags: [attendance]
      summary: List attendance for a given date (defaults to today)
      description: |
        Cross-athlete list scoped to the authenticated academy. Use
        `?trashed=1` to include soft-deleted (tombstone) records alongside
        active ones — useful for auditing corrections.
      operationId: attendanceDailyList
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: YYYY-MM-DD. Defaults to today if omitted.
        - name: trashed
          in: query
          required: false
          schema: { type: integer, enum: [0, 1] }
          description: Pass `1` to include tombstones.
      responses:
        '200':
          description: Attendance records for the given date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecordList' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated user has no academy, so attendance access is forbidden.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }

    post:
      tags: [attendance]
      summary: Bulk mark athletes present on a date
      description: |
        Bulk upsert — idempotent. Re-posting the same athlete + date is a
        no-op, not a validation error. Date must be today or within the
        last 7 days (backfill window). Future dates are rejected.
      operationId: attendanceMark
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkAttendancePayload' }
      responses:
        '201':
          description: The records now active for this date × athletes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecordList' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Attempting to mark an athlete in another academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '422':
          $ref: '#/components/responses/ValidationError'

  /attendance/{id}:
    delete:
      tags: [attendance]
      summary: Soft-delete an attendance record
      description: |
        Used to un-mark a mistakenly-tapped athlete. The row is soft-deleted
        (reversible via future admin tooling); a fresh record on the same
        (athlete, date) can still be created — the app-level uniqueness
        check filters tombstones.
      operationId: attendanceDelete
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Record soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Record belongs to another academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404':
          $ref: '#/components/responses/NotFound'

  /attendance/summary:
    get:
      tags: [attendance]
      summary: Monthly attendance count per athlete
      description: |
        Aggregated count of active (non-deleted) attendance rows per
        athlete for a single calendar month. Only athletes with at least
        one record in the month appear. Sorted DESC by count, then by
        last_name ASC for stable ordering at ties.
      operationId: attendanceMonthlySummary
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          description: YYYY-MM.
      responses:
        '200':
          description: Per-athlete counts for the month.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceSummaryEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated user has no academy, so attendance access is forbidden.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '422':
          $ref: '#/components/responses/ValidationError'

  /attendance/leaderboard:
    get:
      tags: [engagement]
      summary: Monthly mat-hours leaderboard for the caller's academy
      description: |
        Top 5 athletes by attendance session count for the given month
        (#962). Sessions count distinct `attended_on` days, hours are
        computed at 1.5 h per session. Defaults to the current month
        when `month` is omitted.

        Anonymisation: athletes who opted out via `users.leaderboard_visible
        = false` still count toward the rank, but their row carries
        `anonymous: true` with `first_name = ''` and `last_name_initial
        = ''`. The session count remains visible so the order is faithful.

        The caller's own row (when the caller is an athlete) carries
        `is_self: true`. Owners never get `is_self` set because they
        have no athlete row of their own.
      operationId: attendanceLeaderboard
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          description: YYYY-MM. Defaults to the current month.
      responses:
        '200':
          description: Top 5 athletes by session count for the month.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      required: [athlete_id, first_name, last_name_initial, anonymous, sessions, hours, is_self]
                      properties:
                        athlete_id: { type: integer, format: int64 }
                        first_name: { type: string, description: Empty string when anonymous. }
                        last_name_initial: { type: string, description: Empty string when anonymous. }
                        anonymous: { type: boolean }
                        sessions: { type: integer, minimum: 1 }
                        hours: { type: number, format: float }
                        is_self: { type: boolean }
                  meta:
                    type: object
                    required: [month]
                    properties:
                      month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Caller has no academy context (orphan athlete).
        '422':
          $ref: '#/components/responses/ValidationError'

  /support:
    post:
      tags: [support]
      summary: File a support ticket — persists a row and emails the support inbox
      description: |
        Authenticated users can file a support ticket (subject +
        category + body). The server persists a `support_tickets`
        row (paper trail) AND queues an email to the support inbox
        with `Reply-To` set to the user, so the inbox owner can hit
        Reply directly and the response lands in the user's mailbox.
        Throttled to 5 req/min per user.

        Distinct from `/feedback` — feedback is fire-and-forget for
        product feedback / bug reports; this endpoint is the
        "I want a reply" channel.

        Mail dispatch is best-effort: a queue insert failure does
        NOT fail the request, the row is still persisted and the
        client receives a 202.
      operationId: submitSupportTicket
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [subject, category, body]
              properties:
                subject:
                  type: string
                  minLength: 3
                  maxLength: 100
                category:
                  type: string
                  enum: [account, billing, bug, feedback, other]
                  description: |
                    Coarse routing label. The five cases reflect the
                    most common reasons a user reaches out — the
                    SupportTicketCategory PHP enum mirrors them. The
                    `feedback` case was added when the legacy
                    /dashboard/feedback page was retired and folded
                    into support; it tags messages where the user is
                    sharing input rather than expecting a reply, but
                    Reply-To is still set to the user so a follow-up
                    is always possible.
                body:
                  type: string
                  minLength: 10
                  maxLength: 5000
                image:
                  type: string
                  format: binary
                  description: |
                    Optional screenshot. Max 5 MB, png/jpeg/webp only.
                    NOT persisted server-side — sent only as an email
                    attachment and discarded with the request lifecycle.
              description: |
                The X-Budojo-Version request header (when sent by the
                SPA) and the User-Agent header are auto-attached to the
                ticket row + the support email. They are NEVER asked
                from the user; they are server-derived context for the
                support inbox.
      responses:
        '202':
          description: Ticket persisted and email queued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SupportTicket' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Throttle limit hit (5 req/min per user).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }

  /athletes/{athlete}/photo:
    post:
      tags: [athletes]
      summary: Upload or replace an athlete's photo (owner-only)
      description: |
        Multipart `photo` upload (#1357). The server stores the original bytes
        under `athletes/photos/{athlete-id}.{ext}` on the public disk, with the
        extension tracking the upload; `jpeg` is normalised to `jpg` so the path
        does not depend on which browser sent it.

        No server-side resize: GD in the API image ships with PNG support only,
        so the SPA frames the image with CSS `object-fit: cover` instead — the
        same choice `/me/avatar` documents. Replacing with the same extension
        overwrites in place; a different extension unlinks the orphan.

        Accepts `image/jpeg`, `image/png`, `image/webp`, max 2 MB. SVG is
        rejected on this surface for the same reason as user avatars: it is a
        script vector, and the sanitiser the academy-logo flow needed is far
        more surface than a head-shot justifies.

        Academy-scoped, and here that is load-bearing rather than routine — the
        storage path is derived from the path parameter, so the check is what
        stops one academy writing files into another's namespace.

        The response is the full athlete envelope, so the SPA swaps the row in
        without a follow-up `GET`. Its `photo_url` carries a `?v={updated_at}`
        cache-buster; without it a same-format replacement would leave the
        browser showing the picture that was just replaced.
      operationId: athleteUploadPhoto
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo uploaded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Athlete'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The athlete belongs to another academy.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: |
            Rate-limited (10/min per user). Caps the multipart-upload
            storage-flood vector, as `/me/avatar` does. Carries `Retry-After`.

    delete:
      tags: [athletes]
      summary: Remove an athlete's photo (owner-only)
      description: |
        Deletes the stored file and clears `photo_path`, returning the athlete
        envelope with `photo_url: null`.

        Idempotent: removing a photo that is not there is still a 200. Deleting
        nothing leaves the caller in the state it asked for, and a 404 would
        only make the SPA special-case a success.
      operationId: athleteDeletePhoto
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Photo removed (or no-op when none was set)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Athlete'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The athlete belongs to another academy.

  /athletes/{athlete}/promotions:
    get:
      tags: [athletes]
      summary: Belt + stripe promotion history for an athlete (owner-only)
      description: |
        Returns every belt and stripe promotion event recorded for
        the athlete, descending by `recorded_at`. Written by the
        `AthleteObserver` in lock-step with the corresponding
        `belt_promotion` / `stripe_promotion` CommunityPost so the
        owner can answer "when did I give which stripe to whom" from
        a queryable surface, not by scraping the feed.

        Academy-scoped: caller must own the athlete's academy or
        the response is a canonical 403 envelope.
      operationId: athletePromotionHistory
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Paginated promotion history (20/page).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AthletePromotion' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Athlete is not in the authenticated academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }

    post:
      tags: [athletes]
      summary: Backfill a historical promotion (#1431 PR 2 of 2)
      description: |
        Transcribes a promotion that happened before Budojo existed, for
        either belts or stripes. Writes straight to the row; never touches
        the athlete's current `belt` or `stripes`, so it cannot fire the
        `AthleteObserver` — no spurious `CommunityPost`, no notification
        fanout. `recorded_by_user_id` on the created row is always the
        caller, never a guess at who recorded the real-world event.

        A backfill that contradicts an existing same-kind neighbour in the
        athlete's timeline (its `from_*` doesn't match the nearest earlier
        row's `to_*`, or its `to_*` doesn't match the nearest later row's
        `from_*`) is refused with a 422 naming the row it disagrees with.
        A row with no same-kind neighbour on one side is unconstrained on
        that side — the athlete's earliest or latest known event of that
        kind. Belt and stripe chains are checked independently; a stripe
        row is never cross-checked against belt rows.

        `belt_at_event` is not accepted for `kind=belt` — it always equals
        `to_belt` and is derived server-side.
      operationId: athletePromotionCreate
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthletePromotionCreateRequest'
      responses:
        '201':
          description: The created promotion row.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AthletePromotion'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Athlete is not in the authenticated academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '422':
          $ref: '#/components/responses/ValidationError'

  /athletes/{athlete}/promotions/{promotion}:
    patch:
      tags: [athletes]
      summary: Correct when a promotion actually happened (#1431 PR 1 of 2)
      description: |
        The only editable field on a promotion row: `kind`, the belt/stripe
        transition, and who recorded it describe the event itself and stay
        put. Fixes the common case where a promotion was entered after the
        fact — the row carries the date it was *typed*, not the date it
        *happened*.

        Writes straight to the row; never touches the athlete's current
        `belt` or `stripes`, so it cannot fire the `AthleteObserver` or spawn
        another promotion row. `recorded_at` may not be set in the future.

        403 when the promotion does not belong to the athlete in the path.
      operationId: athletePromotionUpdateRecordedAt
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: promotion
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthletePromotionRecordedAtUpdateRequest'
      responses:
        '200':
          description: The updated promotion row.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AthletePromotion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Athlete is not in the authenticated academy, or the promotion does not belong to it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [athletes]
      summary: Undo a promotion entered by mistake (#1431 PR 2 of 2)
      description: |
        Hard delete — a promotion row has no downstream ledger to
        reconcile, so there is no restore concept here (unlike athletes
        or carnets).

        403 when the promotion does not belong to the athlete in the path.
      operationId: athletePromotionDelete
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: promotion
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Promotion deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Athlete is not in the authenticated academy, or the promotion does not belong to it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athlete}/attendance:
    get:
      tags: [attendance]
      summary: Per-athlete attendance history in a date window
      description: |
        Returns an athlete's attendance records ordered newest-first.
        `from` and `to` are optional — an omitted bound means unbounded on
        that side. Academy-scoped: other academies' athletes return 403.
      operationId: attendanceAthleteHistory
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Attendance records for the athlete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecordList' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Athlete is not in the authenticated academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }

  /athletes/{athlete}/attendance/summary:
    get:
      tags: [attendance]
      summary: Per-athlete attendance summary over the last N days
      description: |
        Aggregate attendance % for one athlete over the trailing window.
        `range` is one of {30, 90, 365}; default 90.

        **Denominator semantic.** `expected_count` is the count of *realized
        lesson days* in the window — distinct dates where the academy has at
        least one attendance row AND the athlete was already on the roster
        (`joined_at <= date`). This avoids penalizing the athlete for
        cancellations / holidays / pre-roster days.

        `rate = attended_count / expected_count`, rounded to 4 decimal places.
        When the academy held no lessons in the window (`expected_count = 0`),
        `rate` is `null`. The `series` array exposes one entry per realized
        lesson day, oldest first — sparkline-ready.

        Response is cached for 5 minutes per (athlete_id, range).
      operationId: attendanceAthleteSummary
      parameters:
        - name: athlete
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: range
          in: query
          required: false
          schema:
            type: integer
            enum: [30, 90, 365]
            default: 90
      responses:
        '200':
          description: Attendance summary payload.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [range_days, range_start, range_end, attended_count, expected_count, rate, series]
                    properties:
                      range_days: { type: integer, enum: [30, 90, 365] }
                      range_start: { type: string, format: date }
                      range_end: { type: string, format: date }
                      attended_count: { type: integer, minimum: 0 }
                      expected_count: { type: integer, minimum: 0 }
                      rate:
                        type: number
                        nullable: true
                        minimum: 0
                        maximum: 1
                        description: |
                          `null` when `expected_count` is 0 (no realized lesson
                          days in the window); a 0..1 fraction otherwise.
                      series:
                        type: array
                        items:
                          type: object
                          required: [date, attended]
                          properties:
                            date: { type: string, format: date }
                            attended: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Athlete is not in the authenticated academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404':
          description: Athlete does not exist.
        '422':
          description: Validation error — `range` must be 30, 90, or 365.

  /audit-entries:
    get:
      operationId: listAuditEntries
      summary: Paginated audit log of academy actions
      description: |
        Owner-only paginated read of the immutable audit log (#429).
        Academy-scoped; writes are observer-driven, this endpoint is
        read-only. Default ordering: `created_at DESC, id DESC`.

        Filters narrow the result set:
          - `action` — exact match on the action verb (e.g. `athlete.deleted`).
          - `actor_user_id` — exact match.
          - `from` / `to` — inclusive date range on `created_at` (YYYY-MM-DD).
          - `subject_type` + `subject_id` — per-entity history.
          - `per_page` — page size (1..100, default 20).
      tags: [Audit]
      parameters:
        - in: query
          name: action
          required: false
          schema: { type: string, maxLength: 80 }
        - in: query
          name: actor_user_id
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date }
        - in: query
          name: subject_type
          required: false
          schema: { type: string, maxLength: 120 }
        - in: query
          name: subject_id
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: per_page
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Paginated audit entries page.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, action, actor_label, created_at]
                      properties:
                        id: { type: integer }
                        action: { type: string }
                        actor_user_id: { type: integer, nullable: true }
                        actor_label: { type: string, nullable: true }
                        subject_type: { type: string, nullable: true }
                        subject_id: { type: integer, nullable: true }
                        subject_label: { type: string, nullable: true }
                        before: { type: object, nullable: true, additionalProperties: true }
                        after: { type: object, nullable: true, additionalProperties: true }
                        ip: { type: string, nullable: true }
                        user_agent: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                  meta:
                    type: object
                    required: [current_page, last_page, total, per_page]
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
                      per_page: { type: integer }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden — athlete-role users are not owners. }
        '422': { description: Validation error on a filter. }

  /stats/attendance/daily:
    get:
      operationId: statsAttendanceDaily
      summary: Daily attendance counts for the GitHub-contributions-style heatmap
      description: |
        Returns only the days that have at least one non-deleted attendance record
        (sparse response) over the trailing N months ending TODAY. N must be one
        of {3, 6, 12} — the three buttons exposed in the heatmap range selector.
        The frontend backfills zero-count days when laying out the heatmap grid.
        Window start: `today − N months + 1 day` (inclusive).
      tags: [Stats]
      parameters:
        - in: query
          name: months
          required: false
          schema:
            type: integer
            enum: [3, 6, 12]
            default: 3
      responses:
        '200':
          description: Daily attendance rows, oldest to newest, only populated days
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [date, count]
                      properties:
                        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: '2026-04-12' }
                        count: { type: integer, minimum: 1 }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — authed user has no academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '422': { description: 'Validation error — months must be 3, 6, or 12.' }

  /stats/payments/monthly:
    get:
      operationId: statsPaymentsMonthly
      summary: Monthly revenue bucketed by business (year, month)
      description: |
        Returns N consecutive calendar-month buckets ending with the current
        month (default 12, max 24). Each bucket contains the total
        `amount_cents` collected across all athletes of the academy for that
        business month. Bucketing uses the business months on
        `athlete_payments` — NOT `paid_at` — so the figures reflect the
        fee period the payment covers, not the wall-clock recording time.

        A payment covering a period (#1382) is **spread evenly** across every
        month it pays for: a €165 quarterly contributes €55 to each of three
        buckets. The split is integer with the remainder on the first month,
        so buckets always add back up to what was paid.

        **Carnet sales are included on the same terms** (#1383): a pack's
        `price_cents` is spread across the months of its validity window, so
        €70 valid twelve months contributes about €5.83 a month. The expiry
        month itself gets nothing.
        Buckets with no payments are included (amount_cents = 0) so the
        frontend can render a continuous chart without gap-filling.
        Currency is always EUR (single-currency-per-academy invariant).
      tags: [Stats]
      parameters:
        - in: query
          name: months
          required: false
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
      responses:
        '200':
          description: Monthly revenue buckets, oldest to newest
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [month, currency, amount_cents]
                      properties:
                        month: { type: string, pattern: '^\d{4}-\d{2}$' }
                        currency: { type: string, example: EUR }
                        amount_cents: { type: integer, minimum: 0 }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — authed user has no academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '422': { description: Validation error }

  /stats/athletes/age-bands:
    get:
      operationId: statsAthleteAgeBands
      summary: IBJJF age-division histogram of the academy's athletes
      description: |
        Returns all 13 canonical IBJJF age divisions in order (Mighty Mite
        through Master 7), each with the count of athletes whose age today
        falls in that division. Empty divisions are included with count 0 so
        the frontend can render the full histogram without gap-filling.
        Athletes with a NULL date_of_birth are excluded from band counts and
        reported in the top-level `missing_dob` field.
      tags: [Stats]
      responses:
        '200':
          description: All 13 IBJJF age divisions in canonical order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [bands, total, missing_dob]
                    properties:
                      bands:
                        type: array
                        items:
                          type: object
                          required: [code, category, min, max, count]
                          properties:
                            code:
                              type: string
                              enum:
                                - mighty_mite
                                - pee_wee
                                - junior
                                - teen
                                - juvenile
                                - adult
                                - master_1
                                - master_2
                                - master_3
                                - master_4
                                - master_5
                                - master_6
                                - master_7
                            category: { type: string, enum: [kids, adults] }
                            min: { type: integer, minimum: 0 }
                            max: { type: integer, nullable: true }
                            count: { type: integer, minimum: 0 }
                      total: { type: integer, minimum: 0 }
                      missing_dob: { type: integer, minimum: 0 }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — authed user has no academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }

  /users/{handle}/profile:
    get:
      tags: [profile]
      summary: Read a same-academy peer's public profile by handle
      description: |
        Returns the public-profile view of the user identified by the
        provided handle — `first_name`, `handle`, `avatar_url`,
        current `belt`, `joined_at` date, and the top-50 `promotions`
        timeline (newest first).

        Three privacy gates all collapse to **404 Not Found** so this
        endpoint never leaks the existence of a user behind any of them:

          1. Handle is unknown.
          2. Target opted out (`profile_is_public = false`).
          3. Viewer is not in the same academy as the target.

        The handle path segment is bound by a route regex matching the
        canonical handle format (#479) — lowercase `[a-z][a-z0-9._]{2,29}`.
        Malformed values 404 at the route layer before reaching the
        controller.
      operationId: getPublicProfile
      parameters:
        - in: path
          name: handle
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9._]{2,29}$'
            example: mariobjj
          description: The target user's handle (3-30 chars).
      responses:
        '200':
          description: The peer's public profile snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicProfile'
        '401':
          description: Unauthenticated.
        '404':
          description: Handle unknown, profile opted-out, or viewer is cross-academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Not Found. }

  /community/feed:
    get:
      tags: [community]
      summary: Read the authenticated user's academy timeline
      description: |
        Returns a paginated, descending-created-at list of community
        posts visible to the authenticated user's academy. Owners and
        athletes from the same academy see the same set. Posts from
        other academies are filtered out at the query level (tenant
        isolation rule — M9 PRD § Hard rules).

        Each item carries a `created_by` identity flair envelope so the
        SPA can render the "Mario Rossi · @mariobjj · 🟦 Blue" line.
        `belt` is null for owner-authored posts.

        `reactions_count`, `comments_count`, and `rsvps_count` are
        zeroed in V1 — PR-C and PR-D will start populating them.
      operationId: getCommunityFeed
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
          description: 1-based page index. 20 items per page.
      responses:
        '200':
          description: Paginated feed (page-size 20).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CommunityPost' }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer, minimum: 1 }
                      per_page: { type: integer, example: 20 }
                      total: { type: integer, minimum: 0 }
                      last_page: { type: integer, minimum: 1 }
        '401': { description: Unauthenticated }

  /community/posts/{post}:
    delete:
      tags: [community]
      summary: Soft-delete a community post (owner-only)
      description: |
        Owner-only moderation surface. The FormRequest authorize() gate
        rejects (403) any caller who is not the owner of the post's
        academy. Successful soft-delete (`deleted_at` set; row remains
        recoverable) returns 204 and the post immediately disappears
        from `/community/feed`.

        V1 has no athlete-side delete-my-own-post surface — that lands
        with M9 PR-D when comments/posts gain inline edit + delete on
        the author's own rows.
      operationId: deleteCommunityPost
      parameters:
        - in: path
          name: post
          required: true
          schema: { type: integer, minimum: 1 }
          description: Community post id.
      responses:
        '204': { description: Post soft-deleted. }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — caller is not an owner OR the post belongs to a different academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404': { description: Post not found (already hard-deleted or invalid id). }

  /community/posts/{post}/reactions:
    get:
      tags: [community]
      summary: List every reaction on a community post
      description: |
        Paginated (20/page) list of every reaction on a post with the
        reactor's identity flair (post-v2.9.0 feature: "voglio vedere
        chi ha messo cosa come Facebook"). Ordered by `created_at DESC,
        id DESC` for deterministic pagination. Same academy-scope gate
        as the toggle endpoint (owner OR athlete in the post's academy
        → 200; cross-academy → 403). Throttled via the shared
        `community-react` limiter (60/min/user).
      operationId: listCommunityPostReactions
      parameters:
        - in: path
          name: post
          required: true
          schema: { type: integer, minimum: 1 }
          description: Community post id.
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Paginated list of reactions on the post.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostReaction' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — caller belongs to a different academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404': { description: Post not found. }
        '429':
          description: Rate-limit exceeded (60 / minute / user, shared `community-react` limiter).
    post:
      tags: [community]
      summary: Toggle the authenticated user's emoji reaction on a post
      description: |
        Toggle the caller's emoji reaction on the given community post.
        One row per `(post_id, user_id)` per the PR-A UNIQUE index — same-
        emoji toggles off, different-emoji swaps in place. Owners and
        athletes in the post's academy both react via this endpoint;
        cross-academy → 403 with the canonical `{"message":"Forbidden."}`
        envelope.

        Response carries the resulting state so the SPA can reconcile
        its optimistic update without a second fetch.
      operationId: toggleCommunityReaction
      parameters:
        - in: path
          name: post
          required: true
          schema: { type: integer, minimum: 1 }
          description: Community post id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { $ref: '#/components/schemas/ReactionEmoji' }
      responses:
        '200':
          description: Reaction state after toggle.
          content:
            application/json:
              schema:
                type: object
                required: [your_reaction, counts]
                properties:
                  your_reaction:
                    type: string
                    enum: [clap, pray]
                    nullable: true
                    description: 'The caller''s reaction after toggling. Null when the toggle was off.'
                  counts:
                    type: object
                    required: [clap, pray]
                    properties:
                      clap: { type: integer, minimum: 0 }
                      pray: { type: integer, minimum: 0 }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — caller belongs to a different academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404': { description: Post not found. }
        '422':
          description: Unknown emoji value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorBody' }
        '429':
          description: Rate-limit exceeded (60 reactions / minute / user).

  /community/posts/{post}/comments:
    get:
      tags: [community]
      summary: List comments on a community post
      description: |
        Paginated (50/page) list of comments on a post, ascending by
        `created_at` (oldest first — natural thread order). Soft-
        deleted comments are excluded. Caller must belong to the
        post's academy (403 envelope otherwise).
      operationId: listCommunityComments
      parameters:
        - in: path
          name: post
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Paginated comment list.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostComment' }
                  links:
                    type: object
                    description: 'Laravel paginator URL block — first / last / prev / next link strings; `prev` and `next` are null at the boundaries.'
                    properties:
                      first: { type: string, format: uri, nullable: true }
                      last: { type: string, format: uri, nullable: true }
                      prev: { type: string, format: uri, nullable: true }
                      next: { type: string, format: uri, nullable: true }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer, minimum: 1 }
                      per_page: { type: integer, example: 50 }
                      total: { type: integer, minimum: 0 }
                      last_page: { type: integer, minimum: 1 }
                      from: { type: integer, nullable: true }
                      to: { type: integer, nullable: true }
                      path: { type: string, format: uri }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — caller belongs to a different academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404': { description: Post not found. }

    post:
      tags: [community]
      summary: Create a 1-level comment on a community post
      description: |
        Adds a comment under the given post. Body is required, trimmed
        before storing, and capped at 500 chars. Caller must belong to
        the post's academy. Rate-limited at 30 / minute / user via
        the `community-comment-create` named limiter.
      operationId: createCommunityComment
      parameters:
        - in: path
          name: post
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: 'Comment text. Trimmed before storage. Empty / over-500 → 422.'
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PostComment' }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — caller belongs to a different academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404': { description: Post not found. }
        '422':
          description: Body missing, empty after trim, or > 500 chars.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorBody' }
        '429':
          description: Rate-limit exceeded (30 comments / minute / user).

  /community/comments/{comment}:
    delete:
      tags: [community]
      summary: Soft-delete a comment
      description: |
        Soft-deletes the comment so it disappears from `GET
        .../comments` immediately but remains recoverable in the DB.
        Two authorization paths:

        - **Author**: a user can always delete their own comment.
        - **Owner**: the owner of the post's academy can delete any
          comment under that post (moderation surface).

        403 with the canonical envelope otherwise.
      operationId: deleteCommunityComment
      parameters:
        - in: path
          name: comment
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Comment soft-deleted. }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — caller is neither the author nor the owner of the post's academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404': { description: Comment not found. }

  /community/posts/{post}/rsvp:
    post:
      tags: [community]
      summary: Toggle an RSVP on an event-type post
      description: |
        Toggle the caller's RSVP on an event-type community post.
        Same-response toggles off, different-response swaps in
        place (Going ↔ Maybe). Only `type=event` posts accept
        RSVPs — other types surface as 422 with the
        `rsvp_not_event_post` error key. Rate-limited at 30/min/user
        via the `community-rsvp` named limiter.

        Response carries the resulting state so the SPA can
        reconcile its optimistic update in one roundtrip.
      operationId: toggleCommunityRsvp
      parameters:
        - in: path
          name: post
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { $ref: '#/components/schemas/RsvpResponse' }
      responses:
        '200':
          description: RSVP state after toggle.
          content:
            application/json:
              schema:
                type: object
                required: [your_rsvp, counts]
                properties:
                  your_rsvp:
                    type: string
                    enum: [going, maybe]
                    nullable: true
                    description: 'The caller''s RSVP after the toggle. Null when toggled off.'
                  counts:
                    type: object
                    required: [going, maybe]
                    properties:
                      going: { type: integer, minimum: 0 }
                      maybe: { type: integer, minimum: 0 }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — caller belongs to a different academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '404': { description: Post not found. }
        '422':
          description: Unknown response value OR post is not an event (error key `rsvp_not_event_post`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorBody' }
        '429':
          description: Rate-limit exceeded (30 RSVPs / minute / user).

  /community/events:
    post:
      tags: [community]
      summary: Create a community event post (owner only)
      description: |
        Create an event-type community post in the caller's owned
        academy. Owner-only — athletes get a 403 envelope. The post
        flows into the same feed as belt-promotion / announcement
        posts; the SPA renders title + start time + optional
        location text on the event card.

        V1 ships create only — edit / cancel surfaces are V2. The
        nullable `location_lat` / `location_lon` columns are baked
        in so the V2 map view doesn't need a destructive migration.
      operationId: createCommunityEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, nullable: true, maxLength: 2000 }
                starts_at: { type: string, format: date-time, description: 'ISO 8601 date-time (any TZ; stored canonical).' }
                location_text: { type: string, nullable: true, maxLength: 200 }
                location_lat: { type: number, format: float, nullable: true, minimum: -90, maximum: 90 }
                location_lon: { type: number, format: float, nullable: true, minimum: -180, maximum: 180 }
                max_attendees: { type: integer, nullable: true, minimum: 1, maximum: 10000 }
      responses:
        '201':
          description: Event post created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CommunityPost' }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — caller is not an owner OR has no linked academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '422':
          description: Malformed payload (empty title, invalid date, out-of-range lat/lon, …).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorBody' }

  /community/videos:
    post:
      tags: [community]
      summary: Share an external technique video to the feed
      description: |
        Share an Instagram reel / YouTube / TikTok technique video into the
        caller's academy feed. Open to **athletes and owners** (any academy
        member with feed-interaction) — the first feed write athletes can
        author. The server resolves the preview from the allowlisted provider
        (that host allowlist is also the SSRF boundary for the outbound fetch)
        and stores a `shared_video` post; the SPA renders a tap-to-play facade
        card. Throttled — each create makes an outbound oEmbed / OG fetch.
      operationId: createCommunitySharedVideo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: 'Instagram / YouTube / TikTok video URL (allowlisted hosts only).'
                caption: { type: string, nullable: true, maxLength: 500, description: "The sharer's own note." }
      responses:
        '201':
          description: Shared-video post created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CommunityPost' }
        '401': { description: Unauthenticated }
        '403':
          description: Forbidden — caller is not a member of an academy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: Forbidden. }
        '422':
          description: URL is not an allowlisted provider, or its preview could not be resolved (deleted / private / provider error).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorBody' }
        '429': { description: Too many shares — throttled. }

  # ─── Athlete restore + Me-side surfaces (#1019 — doc-drift recovery) ───
  # Routes that have been live in api_v1.php but were missing from the
  # OpenAPI spec. Documented here in a single block so a future audit
  # can grep one anchor instead of seven scattered entries.

  /athletes/{athlete}/restore:
    post:
      tags: [athletes]
      summary: Restore a soft-deleted athlete (#700)
      description: |
        Bring a soft-deleted athlete back into the active roster. The
        route's `withTrashed()` binding resolves both trashed + non-
        trashed ids; non-trashed → 404 so the action stays idempotent
        ("restore on an already-active row is not a state flip"). Same
        ownership gate as `destroy` (owner of the athlete's academy).
      operationId: athletesRestore
      parameters:
        - in: path
          name: athlete
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Restored athlete envelope.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Athlete' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Caller lacks AthletesRestore capability.
        '404':
          description: Athlete not deleted (or unknown id).

  /me/academy:
    get:
      tags: [academy]
      summary: Read the athlete's view of their academy
      description: |
        Athlete-side projection of the academy they're linked to. Narrower
        wire shape than the owner's `/academy` (no admin fields).
      operationId: meAcademyShow
      responses:
        '200':
          description: Academy snapshot for the linked user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: User has no linked athlete row / academy.

  /me/active-academy:
    get:
      tags: [auth]
      summary: Read the user's currently-selected academy (#427)
      description: |
        Returns the active membership + role + capability list the SPA
        needs for the `*budojoCan` directive. 204 No Content when the
        user hasn't been added to any academy yet (SPA shows the empty /
        onboarding state).
      operationId: meActiveAcademyShow
      responses:
        '200':
          description: Active membership snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        '204':
          description: User has zero memberships — show onboarding state.
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [auth]
      summary: Switch the active academy (#427, TOCTOU-safe — #990)
      description: |
        Swaps `users.active_academy_id`. The action re-validates the
        membership inside a transaction with `lockForUpdate()` so a
        concurrent revoke between FormRequest validation and persist
        can't leave the pointer on a revoked row. On race, 409.
      operationId: meActiveAcademyUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academy_id]
              properties:
                academy_id: { type: integer, format: int64 }
      responses:
        '200':
          description: Switch persisted; new membership snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: Membership was revoked concurrently — refresh and try again.
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/athlete:
    post:
      tags: [athletes]
      summary: Owner self-enrolment as an athlete (#748)
      description: |
        Adds the calling owner to the roster of their own academy as
        an athlete (`is_self: true`). Idempotent — re-enrolling returns
        the existing row with 200 instead of 201. Restores any
        previously-soft-deleted self row.
      operationId: meAthleteStore
      responses:
        '200':
          description: Already enrolled — existing row returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Athlete' }
        '201':
          description: Newly enrolled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Athlete' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Caller is not an owner / has no academy.
    delete:
      tags: [athletes]
      summary: Owner leaves their own academy as an athlete (#748)
      description: |
        Soft-deletes the `is_self` athlete row. History (attendance,
        promotions) is preserved if the owner re-enrolls later. The
        only way to remove a self-enrolled athlete — `DELETE /athletes/{id}`
        is gated against it.
      operationId: meAthleteDestroy
      responses:
        '204':
          description: Self-enrolled athlete removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: User is not currently self-enrolled.

  /me/athlete/state:
    get:
      tags: [athletes]
      summary: Owner-as-athlete enrolment state (#748)
      description: |
        Returns `{ enrolled: bool, athlete: Athlete | null }` so the
        SPA can decide whether to render the "Train at this academy"
        toggle in the on or off state.
      operationId: meAthleteState
      responses:
        '200':
          description: State snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [enrolled]
                    properties:
                      enrolled: { type: boolean }
                      athlete:
                        nullable: true
                        allOf:
                          - $ref: '#/components/schemas/Athlete'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/attendance:
    get:
      tags: [attendance]
      summary: Athlete's own attendance history
      description: |
        Paginated list of the calling athlete's attendance rows.
        Athletes use this for the personal "training log" page;
        owners use the cross-athlete `/attendance` instead.
      operationId: meAttendanceIndex
      responses:
        '200':
          description: Paginated attendance rows.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: User has no linked athlete row.

  /me/documents:
    get:
      tags: [documents]
      summary: Athlete's own documents list
      description: |
        Returns the documents tied to the calling athlete's row.
        Narrower wire shape than the owner-side `/athletes/{id}/documents`:
        the athlete sees only their own row.
      operationId: meDocumentsIndex
      responses:
        '200':
          description: Athlete's documents.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: User has no linked athlete row.

  /me/carnets:
    get:
      tags: [auth]
      summary: Athlete's own entry carnets
      description: |
        The calling athlete's carnets, newest purchase first, with the
        residual balance and expiry — so "quanti ingressi mi restano" does not
        have to be asked at the desk. Owners get 404: they have no personal
        ledger, and `/athletes/{id}/carnets` is their entry point.
      operationId: meCarnetsIndex
      responses:
        '200':
          description: The athlete's carnets
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Carnet'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The authenticated user has no athlete profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example: { message: No athlete profile found. }

  /me/payments:
    get:
      tags: [auth]
      summary: Athlete's own payments history
      description: |
        Paginated list of the calling athlete's payment rows.
        Athletes use this on the personal "subscription / payments"
        page; owners use the cross-athlete `/athletes/{id}/payments`.
      operationId: mePaymentsIndex
      responses:
        '200':
          description: Athlete's payments.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: User has no linked athlete row.

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: |
        Laravel Sanctum personal-access token obtained from `/auth/login` or `/auth/register`.
        Send as `Authorization: Bearer <token>`.

  parameters:
    AthleteId:
      name: id
      in: path
      required: true
      description: Athlete primary key
      schema:
        type: integer
        format: int64
        minimum: 1

    FeeTierId:
      name: tier
      in: path
      required: true
      description: Fee tier primary key
      schema:
        type: integer
        format: int64
        minimum: 1

    DocumentId:
      name: id
      in: path
      required: true
      description: Document primary key
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    Unauthenticated:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: Unauthenticated.

    NoAcademy:
      description: The authenticated user has not set up an academy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: No academy found.

    VerificationRequired:
      description: |
        The authenticated user has not verified their email. Returned by
        `verified.api`-gated routes (athlete writes + document writes).
        The SPA's auth interceptor keys on `message: 'verification_required'`
        to bounce the user to `/dashboard/profile?reason=verify_required`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: verification_required

    RoleRequired:
      description: |
        The authenticated user does not have the role required by the
        endpoint. Returned by `role:owner`-gated routes (#774, M7 PR-F)
        when an athlete-role caller reaches an owner-only surface. The
        SPA's auth interceptor keys on `message: 'role_required'` to
        bounce the caller to `/dashboard/me/profile` (athlete-portal home).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: role_required

    OwnerGateForbidden:
      description: |
        Composite 403 for endpoints behind both `role:owner` (#774) and
        the owner-setup check. The body discriminates the cause:

        - `role_required` — athlete-role caller (server-side role gate, fires before the controller).
        - `No academy found.` — owner caller but no academy linked yet.

        The SPA's auth interceptor keys on the exact message string to
        decide between bouncing to the athlete portal vs. the academy
        setup wizard.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            roleRequired:
              summary: Athlete-role caller (server-side role gate)
              value:
                message: role_required
            noAcademy:
              summary: Owner caller, no academy linked
              value:
                message: No academy found.

    Forbidden:
      description: |
        Forbidden — generic 403 envelope for endpoints that gate on ownership
        or role. Used when the caller doesn't satisfy the FormRequest's
        `authorize()` (typically `role:owner` + academy ownership of the
        bound resource). The wire shape mirrors `ForbiddenAthlete*` but is
        scoped wider so endpoints not bound to an athlete can reuse it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: Forbidden.

    Throttled:
      description: |
        Rate-limit hit. The `Retry-After` response header carries the seconds
        the caller should wait before retrying. Endpoints that share this
        response (`/me/email-change`, `/athletes/{athlete}/email`, `/me/password`,
        ...) document their per-route limiter cap in their own description.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: Too Many Attempts.

    ForbiddenAthleteWrite:
      description: |
        Forbidden — gated athlete-write endpoint refused. Two reasons can
        produce a 403 here, both with the same `ErrorMessage` shape:
          - `message: "Forbidden."` — the FormRequest's `authorize()`
            rejected the request. Covers BOTH "user has no academy" and
            "athlete is in a different academy" — both surface the same
            wire shape via `failedAuthorization()` in the FormRequest.
          - `message: "verification_required"` — email not verified (#167);
            emitted directly by the `verified.api` middleware. SPA's auth
            interceptor catches this and redirects to
            `/dashboard/profile?reason=verify_required`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            forbidden:
              summary: No academy OR cross-academy (failedAuthorization)
              value:
                message: Forbidden.
            verificationRequired:
              summary: Email not verified (gated by `verified.api`)
              value:
                message: verification_required

    ForbiddenDocumentWrite:
      description: |
        Forbidden — gated document-write endpoint refused. Same combined
        shape as `ForbiddenAthleteWrite`. The `Forbidden.` variant covers
        no-academy AND cross-academy (document belongs to a different
        academy, checked transitively via `document.athlete.academy_id`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            forbidden:
              summary: No academy OR cross-academy (failedAuthorization)
              value:
                message: Forbidden.
            verificationRequired:
              summary: Email not verified (gated by `verified.api`)
              value:
                message: verification_required

    ForbiddenAthlete:
      description: The athlete does not belong to the authenticated user's academy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: Forbidden.

    ForbiddenDocument:
      description: |
        The document does not belong to the authenticated user's academy
        (checked transitively via `document.athlete.academy_id`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: Forbidden.

    NotFound:
      description: |
        Resource not found. The response body carries a `message` field but its exact text
        is currently Laravel's default handling of `ModelNotFoundException` (e.g.
        `"No query results for model [App\\Models\\Athlete] 42"` in debug mode, `"Not Found"`
        in production). A normalized API-wide 404 payload is tracked as a future refinement;
        consumers should treat the status code as the contract and the message as advisory.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'

    ValidationError:
      description: Request payload failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'

  schemas:

    Runtime:
      type: object
      required: [profile, capabilities]
      properties:
        profile:
          type: string
          enum: [web, desktop]
          description: The runtime profile the API is running as (BUDOJO_RUNTIME).
        capabilities:
          type: array
          description: What this profile offers. Routes behind an absent capability answer 404.
          items:
            type: string
            enum: [community, athlete_accounts, web_push, email, password_breach_check]
          example: [community, athlete_accounts, web_push, email, password_breach_check]

    # ── Enums ─────────────────────────────────────────────────────────────

    Belt:
      type: string
      description: |-
        IBJJF belt ranks on a single linear scale.
          - Youth: `grey`, `yellow`, `orange`, `green` (added in #230).
          - Adult: `white`, `blue`, `purple`, `brown`, `black`.
          - Senior beyond black: `red-and-black` (7° grau, coral),
            `red-and-white` (8° grau, coral), `red` (9°/10° grau, grand
            master). Added in #229.

        Per-belt stripes cap: `black` allows 0–6 (graus 1°–6° within the
        black-belt phase); every other belt caps at 0–4.
      enum:
        [
          grey,
          yellow,
          orange,
          green,
          white,
          blue,
          purple,
          brown,
          black,
          red-and-black,
          red-and-white,
          red
        ]

    AthleteStatus:
      type: string
      description: Enrollment status for an athlete
      enum: [active, inactive]

    # ── Generic envelopes ─────────────────────────────────────────────────

    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationErrorBody:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email has already been taken.

    AthletePromotion:
      type: object
      description: |
        One row of an athlete's belt or stripe promotion history.
        `kind` discriminates the populated columns: `belt` →
        `from_belt`/`to_belt` set, stripes null. `stripe` →
        `from_stripes`/`to_stripes` set, belts null. `belt_at_event`
        is the snapshot of the athlete's belt at the moment of the
        promotion — populated on both kinds, lets the SPA render the
        belt-badge context on stripe rows without joining back to the
        (possibly belt-changed-since) athlete. `recorded_by` is
        nullable as a defensive guard against hard-deleted User rows.
      required: [id, kind, from_belt, to_belt, from_stripes, to_stripes, belt_at_event, recorded_at, recorded_by]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [belt, stripe] }
        from_belt:
          allOf:
            - $ref: '#/components/schemas/Belt'
          nullable: true
        to_belt:
          allOf:
            - $ref: '#/components/schemas/Belt'
          nullable: true
        from_stripes: { type: integer, minimum: 0, maximum: 6, nullable: true }
        to_stripes: { type: integer, minimum: 0, maximum: 6, nullable: true }
        belt_at_event:
          $ref: '#/components/schemas/Belt'
        recorded_at: { type: string, format: date-time }
        recorded_by:
          type: object
          nullable: true
          required: [id, full_name]
          properties:
            id: { type: integer, format: int64 }
            full_name: { type: string }

    PaginationMeta:
      type: object
      description: Laravel pagination metadata for AnonymousResourceCollection responses
      required: [current_page, from, last_page, path, per_page, to, total]
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        path:
          type: string
        per_page:
          type: integer
          example: 20
        to:
          type: integer
          nullable: true
        total:
          type: integer

    PaginationLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    # ── Auth ──────────────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [first_name, last_name, email, password, password_confirmation, terms_accepted]
      properties:
        first_name:
          type: string
          minLength: 2
          maxLength: 100
          description: Given name (#479).
          example: Mario
        last_name:
          type: string
          minLength: 2
          maxLength: 100
          description: Family name (#479).
          example: Rossi
        email:
          type: string
          format: email
          maxLength: 255
          example: mario@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: |
            Plain-text password. Server enforces `min:8` plus the HaveIBeenPwned
            breach check (#415): a password that appears in the HIBP `range`
            dataset is rejected with `errors.password[0] = "password_breached"`
            so the SPA can render an actionable "this password has appeared in
            known data breaches" message. Upstream outage soft-fails (the
            request is accepted) — the check is defence-in-depth, not a hard
            availability dependency.
        password_confirmation:
          type: string
          format: password
          description: Must match `password`
        terms_accepted:
          type: boolean
          enum: [true]
          description: |
            Terms-of-Service acceptance gate (#420). The literal `true`
            is the only valid value — Laravel's `accepted` rule rejects
            `false`, missing field, and non-truthy strings, so generated
            clients should refuse to send anything else. The server
            stamps `users.terms_accepted_at = now()` on success.
          example: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        two_factor_code:
          type: string
          description: |
            Required ONLY on the second submit when the first one
            returned `422 two_factor_required` (#412). Either a 6-digit
            TOTP from the user's authenticator app, or one of the
            single-use backup codes in `XXXX-XXXX` format.
          minLength: 6
          maxLength: 32
          example: '123456'

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email:
          type: string
          format: email
        token:
          type: string
          description: One-shot reset token from the email link.
        password:
          type: string
          format: password
          minLength: 8
          description: |
            New password. Same policy as `RegisterRequest.password`: `min:8`
            plus the HaveIBeenPwned breach check (#415). A breached password
            is rejected with `errors.password[0] = "password_breached"`.
        password_confirmation:
          type: string
          format: password
          minLength: 8

    UpdateProfileRequest:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
          minLength: 2
          maxLength: 100
          description: |
            Given name (#479). The global `TrimStrings` middleware
            trims leading/trailing whitespace before validation, so
            `"   "` is rejected as empty.
          example: Mario
        last_name:
          type: string
          minLength: 2
          maxLength: 100
          description: Family name (#479).
          example: Rossi
        handle:
          type: string
          nullable: true
          minLength: 3
          maxLength: 30
          pattern: "^[a-z][a-z0-9._]{2,29}$"
          description: |
            Instagram-style user-chosen handle (#479). Globally unique;
            422 with `errors.handle: ["handle_taken"]` if another user
            already has it. Format violations surface as
            `errors.handle: ["handle_invalid_format"]`. Pass `null` to
            clear an existing handle. Lowercased on save.
          example: matteo

    ChangePasswordRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
          description: The user's CURRENT password — re-auth gate.
        password:
          type: string
          format: password
          minLength: 8
          description: |
            The NEW password. Must differ from `current_password`. Same policy
            as `RegisterRequest.password`: `min:8` plus the HaveIBeenPwned
            breach check (#415). A breached password is rejected with
            `errors.password[0] = "password_breached"`.
        password_confirmation:
          type: string
          format: password
          minLength: 8

    RequestEmailChangeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: |
            Candidate new email. Validated as RFC + DNS shape. Rejected with
            422 `email_taken` when already a different `users.email`, or
            with 422 `email_unchanged` when equal to the requesting user's
            current email.

    ChangeAthleteEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: |
            Candidate new email for the bound athlete. Backend branches on
            athlete state — see the endpoint description for the three
            modes (`direct`, `invite_swap`, `pending`).

    EmailChangeMode:
      type: string
      enum: [direct, invite_swap, pending]
      description: |
        Which sub-flow the backend executed for an athlete email change:

        - `direct` — state A: athlete had no invitation and no linked
          user; the email was patched directly on `athletes.email`.
        - `invite_swap` — state B: athlete had a pending invitation;
          the old invitation row was revoked, `athletes.email` updated,
          and a fresh invitation was queued to the new address.
        - `pending` — state C: athlete had an accepted invitation
          (linked `users` row); a `pending_email_changes` row was
          created and the verification mail was queued. `athletes.email`
          stays in sync with `users.email` and only flips on confirm.

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    AuthResponse:
      type: object
      required: [data, token]
      properties:
        data:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Plain-text Sanctum Bearer token. Returned once, never again.
          example: "1|aBc123XyZ..."

    User:
      type: object
      required: [id, first_name, last_name, full_name, handle, email, email_verified_at, avatar_url, deletion_pending]
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
          description: |
            Given name (#479). Required server-side (NOT NULL, default '').
            May be empty for the few seconds between the migration column-add
            and backfill steps; never lands from a validated request.
          example: "Mario"
        last_name:
          type: string
          description: |
            Family name (#479). Required server-side. May legitimately be
            empty for a single-token migrated row that hasn't been edited
            yet (e.g. a pre-#479 account whose `name` was just `"Cher"`).
          example: "Rossi"
        full_name:
          type: string
          description: |
            Server-derived `trim(first_name . ' ' . last_name)` (#479).
            Read-only convenience for clients that want one string —
            mailables (legal/audit body lines), audit logs, sidebar
            greetings. Mutating this field has no server-side effect; the
            two structured fields are the source of truth.
          example: "Mario Rossi"
        handle:
          type: string
          nullable: true
          minLength: 3
          maxLength: 30
          pattern: "^[a-z][a-z0-9._]{2,29}$"
          description: |
            Instagram-style user-chosen identifier (#479). Globally unique,
            lowercase, 3-30 chars, `[a-z0-9_.]`. Must start with a letter.
            No consecutive dots. No leading/trailing dot. Lowercased on
            save (the unique index is therefore effectively case-insensitive).
            Null until the user opts in via the profile page; never
            auto-generated. Substrate for future mention / public-profile /
            fighter-card surfaces.

            The regex above expresses the charset + length + start-char
            rule; the "no consecutive dots" and "no trailing dot" checks
            are programmatic (a regex that captures all three is brittle).
          example: "matteo"
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO-8601 timestamp of when the user clicked the verification link;
            `null` until verified. Surfaced to the SPA so it can render the
            verification pillola without an extra round-trip.
          example: "2026-04-28T15:30:00+00:00"
        avatar_url:
          type: string
          format: uri
          nullable: true
          description: |
            Public URL of the user's avatar image (#411). `null` until the
            user uploads one — the SPA renders an initials fallback in that
            case. Stored as the original uploaded image (jpeg/png/webp);
            the SPA renders the avatar inside a fixed circular frame via
            CSS `object-fit: cover`, so the URL is safe to drop into any
            slot from a 32px chip up to the full profile-page card.
          example: "http://127.0.0.1:8123/storage/users/avatars/42.png"
        deletion_pending:
          nullable: true
          description: |
            GDPR Art. 17 (#223) — non-null when the user is in the 30-day
            grace window after requesting account deletion. The SPA reads
            this on bootstrap to decide whether to render the warning
            banner + the cancel CTA. `null` for normal accounts.
          type: object
          required: [requested_at, scheduled_for]
          properties:
            requested_at:
              type: string
              format: date-time
            scheduled_for:
              type: string
              format: date-time

    # ── Academy ───────────────────────────────────────────────────────────

    AcademyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          example: Gracie Barra Lisboa
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          nullable: true
          description: |
            Optional structured address (#72). Send `null` (or omit the key)
            to leave the academy without an address; send a full Address
            object to attach one. Half-filled payloads are rejected with 422.
        training_days:
          $ref: '#/components/schemas/TrainingDays'
        season_start_month:
          $ref: '#/components/schemas/SeasonStartMonth'

    AcademyUpdateRequest:
      type: object
      description: |
        Partial update. Every property is optional; only keys present in the
        payload are applied. `slug` is absent by design — it is immutable.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Gracie Barra Lisboa Centro
        phone_country_code:
          type: string
          nullable: true
          pattern: '^\+[1-9][0-9]{0,3}$'
          description: |
            E.164 country prefix incl. the leading `+`. Pair with
            `phone_national_number` — both null OR both filled (#161).
          example: '+39'
        phone_national_number:
          type: string
          nullable: true
          maxLength: 20
          pattern: '^[0-9]+$'
          description: |
            Unformatted national digits (no spaces / dashes / parentheses).
            Validated together with `phone_country_code` via libphonenumber.
          example: '3331234567'
        website:
          type: string
          format: uri
          nullable: true
          maxLength: 255
          description: |
            Public website URL (#162). Independently nullable from the
            other contact links. Validated as a parseable URL — bare
            `@handles` are rejected with 422.
          example: 'https://gracie-barra.com'
        facebook:
          type: string
          format: uri
          nullable: true
          maxLength: 255
          description: Facebook page URL (#162). See `website` for shape.
          example: 'https://facebook.com/graciebarra'
        instagram:
          type: string
          format: uri
          nullable: true
          maxLength: 255
          description: Instagram profile URL (#162). See `website` for shape.
          example: 'https://instagram.com/graciebarra'
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          nullable: true
          description: |
            Structured address (#72). Three semantics:
              - omit the key → no change
              - `null` → delete the existing address row
              - `{ ... }` → upsert (create or replace in place)
        monthly_fee_cents:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Academy-wide membership fee, stored in cents (€95.00 = 9500).
            Set to `null` to clear. Required to be non-null before any
            `POST /athletes/{id}/payments` request will succeed.
          example: 9500
        carnet_price_cents:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Price of one entry carnet, in cents (€70.00 = 7000). Set to
            `null` to stop offering carnets. Both this and `carnet_entries`
            must be non-null before `POST /athletes/{id}/carnets` succeeds.
          example: 7000
        carnet_entries:
          type: integer
          minimum: 1
          maximum: 255
          nullable: true
          description: |
            How many entries one carnet holds. Snapshotted onto each carnet
            at sale, so changing it never resizes carnets already sold.
          example: 10
        training_days:
          $ref: '#/components/schemas/TrainingDays'
        season_start_month:
          $ref: '#/components/schemas/SeasonStartMonth'

    Address:
      type: object
      description: |
        Structured postal address (#72), shared by every entity that needs
        one (today: academy; future: athletes, instructors). Wire shape
        mirrors the `addresses` table one-for-one minus the polymorphic
        owner columns.

        **Asymmetric nullability.** On the WRITE path every field except
        `line2` is required: the FormRequest's `required_with:address` rules
        and the SPA's all-or-nothing form validator both reject half-filled
        payloads. On the READ path, however, the same fields are nullable —
        legacy rows backfilled from the pre-#72 freeform `academies.address`
        column have only `line1` populated until the user re-edits, and the
        DB columns themselves are nullable to allow that backfill to land.
        Consumers reading `GET /academy` should treat `line1` / `city` /
        `postal_code` / `province` as `string | null`.

        `country` is always non-null (defaults to `IT` at the column level).
      required: [line1, city, postal_code, province, country]
      properties:
        line1:
          type: string
          maxLength: 255
          nullable: true
          example: Via Roma 1
          description: |
            Street and civic number. Required by the API on writes; may be
            null on reads for legacy rows backfilled from the pre-#72
            freeform column.
        line2:
          type: string
          maxLength: 255
          nullable: true
          example: Scala B, interno 4
          description: Floor / apt / unit — optional even on writes.
        city:
          type: string
          maxLength: 100
          nullable: true
          example: Roma
          description: Required on writes; may be null on reads for legacy backfilled rows.
        postal_code:
          type: string
          pattern: '^\d{5}$'
          nullable: true
          example: '00100'
          description: |
            Italian CAP — exactly 5 digits. Required on writes; may be null
            on reads for legacy backfilled rows. Future countries dispatch
            a per-country regex.
        province:
          type: string
          minLength: 2
          maxLength: 5
          nullable: true
          example: RM
          description: |
            ISO 3166-2:IT province code (e.g. `RM`, `MI`, `TO`). Required
            on writes when `country = "IT"`; may be null on reads for legacy
            backfilled rows. The full set is the 107 cases of the
            `App\Enums\ItalianProvince` backed enum.
        country:
          type: string
          enum: [IT]
          example: IT
          description: ISO 3166-1 alpha-2. MVP supports only Italy. Always non-null.

    Academy:
      type: object
      required:
        [
          id,
          name,
          slug,
          address,
          logo_url,
          monthly_fee_cents,
          carnet_price_cents,
          carnet_entries,
          training_days,
          season_start_month,
          season_start,
          season_label,
          phone_country_code,
          phone_national_number,
          website,
          facebook,
          instagram,
          current_schedule,
          next_schedule,
          schedules,
        ]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
          example: gracie-barra-lisboa-a3f9kx2b
          description: Server-generated, immutable, unique across the system
        phone_country_code:
          type: string
          nullable: true
          pattern: '^\+[1-9][0-9]{0,3}$'
          description: |
            Phone country prefix in E.164 form (e.g. `+39`). Either both
            `phone_*` keys are non-null or both are null — enforced server-
            side by `required_with` (#161). Same shape as Athlete.
          example: '+39'
        phone_national_number:
          type: string
          nullable: true
          maxLength: 20
          pattern: '^[0-9]+$'
          description: Unformatted national digits.
          example: '3331234567'
        website:
          type: string
          format: uri
          nullable: true
          maxLength: 255
          description: Public website URL (#162). Each contact link is independently nullable.
          example: 'https://gracie-barra.com'
        facebook:
          type: string
          format: uri
          nullable: true
          maxLength: 255
          description: Facebook page URL (#162).
          example: 'https://facebook.com/graciebarra'
        instagram:
          type: string
          format: uri
          nullable: true
          maxLength: 255
          description: Instagram profile URL (#162).
          example: 'https://instagram.com/graciebarra'
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          nullable: true
          description: Structured address (#72), or null when the academy has none on file.
        logo_url:
          type: string
          format: uri
          nullable: true
          description: |
            Absolute public URL of the academy logo (resolved server-side via
            `Storage::disk('public')->url(...)` against `APP_URL`), or null
            when no logo has been uploaded.
          example: https://api.example.com/storage/academy-logos/1/abcd1234.png
        monthly_fee_cents:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Academy-wide membership fee in cents. Since #1381 this is the
            **default for athletes on no price tier** rather than the only
            fee. `null` means "fee not configured" — the payments endpoints
            reject `POST` with 422 for any athlete no tier covers either.
            Set via `PATCH /api/v1/academy`.
          example: 9500
        fee_tier_count:
          type: integer
          minimum: 0
          description: |
            How many monthly price tiers the academy has configured (#1381),
            from `GET /academy/fee-tiers`. Zero on an academy that charges one
            flat fee, which is every academy until the owner adds a tier.

            The SPA gates the paid badge, the paid filter and the unpaid
            widget on "does this academy manage payments at all" — a question
            neither this nor `monthly_fee_cents` answers alone, since an
            academy priced only by tier leaves the flat fee null.
          example: 0
        carnet_price_cents:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Price of one entry carnet in cents. `null` on either this or
            `carnet_entries` means "this academy does not sell carnets" —
            `POST /athletes/{id}/carnets` rejects with 422 until both are set.
          example: 7000
        carnet_entries:
          type: integer
          minimum: 1
          maximum: 255
          nullable: true
          description: |
            How many entries one carnet holds. Snapshotted onto each carnet
            at sale.
          example: 10
        training_days:
          $ref: '#/components/schemas/TrainingDays'
        season_start_month:
          $ref: '#/components/schemas/SeasonStartMonth'
        season_start:
          type: string
          format: date
          description: |
            The day the CURRENT season began, resolved server-side from
            `season_start_month` against today (#1484). Read-only: it is an
            answer, not a setting. Supplied so the SPA never re-implements
            the boundary rule — "is March in this season or the last?" has
            exactly one definition, and a second copy in TypeScript is a
            second chance to get the off-by-one wrong.
          example: '2025-09-01'
        season_label:
          type: string
          description: |
            The current season's name for display — `2025/26` when it
            crosses new year, `2026` when it does not (#1484).
          example: '2025/26'
        current_schedule:
          allOf:
            - $ref: '#/components/schemas/AcademySchedule'
          nullable: true
          description: |
            Schedule history (#1094) — the row in effect today. `null` only
            when the academy was migrated in but has no history row covering
            today (e.g. `effective_from > today` for every row, which the
            backfill prevents for legacy academies). Same data as
            `training_days` for the current state; this surface exposes the
            ID + `effective_from` so the FE can render "in effect since".
        next_schedule:
          allOf:
            - $ref: '#/components/schemas/AcademySchedule'
          nullable: true
          description: |
            Schedule history (#1094) — the pending future change, or `null`
            when no future row exists. By application invariant at most one
            pending row exists at a time.
        schedules:
          type: array
          description: |
            Full schedule history (#1094), ordered most-recent-`effective_from`
            first. Use this to compute per-day denominators for mid-period
            transitions on the FE.
          items:
            $ref: '#/components/schemas/AcademySchedule'

    AcademySchedule:
      type: object
      required: [id, training_days, effective_from]
      description: |
        One row in the schedule history (#1094) — "this is the schedule
        starting on `effective_from`". See `docs/entities/academy-schedule.md`.
      properties:
        id:
          type: integer
          format: int64
        training_days:
          $ref: '#/components/schemas/TrainingDays'
        effective_from:
          type: string
          format: date
          description: ISO calendar date (YYYY-MM-DD), no time component.
          example: '2026-06-01'

    SeasonStartMonth:
      type: integer
      minimum: 1
      maximum: 12
      nullable: true
      description: |
        The month the academy's training year restarts in, 1-12 (#1484).

        A month rather than a date, because a season is a recurring boundary
        and not an event: "we start again in September" stays true every year.
        `null` is not "no season" — it is "nobody has chosen", which the
        server answers with September. Every academy has a training year
        whether or not it has an opinion about when it starts.
      example: 9

    TrainingDays:
      type: array
      nullable: true
      maxItems: 7
      uniqueItems: true
      description: |
        The weekdays the academy trains on, expressed as Carbon `dayOfWeek`
        integers (0 = Sunday … 6 = Saturday). Order is canonical (ascending)
        but not enforced — clients SHOULD treat the list as a set. `null`
        means "schedule not configured" — the daily check-in UI uses that
        as the signal to fall back to all-weekdays.
      items:
        type: integer
        minimum: 0
        maximum: 6
      example: [2, 4, 6]

    AcademyEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Academy'

    # ── Athlete ───────────────────────────────────────────────────────────

    AthleteCreateRequest:
      type: object
      required: [first_name, last_name, belt, status, joined_at]
      properties:
        first_name:
          type: string
          maxLength: 100
          example: Mario
        last_name:
          type: string
          maxLength: 100
          example: Rossi
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
          description: Unique per academy (scoped, ignoring soft-deleted rows)
        phone_country_code:
          type: string
          maxLength: 5
          nullable: true
          pattern: '^\+[1-9][0-9]{0,3}$'
          description: |
            E.164 prefix including the leading `+` (e.g. `+39`).
            Must be sent together with `phone_national_number`: either both fields are
            `null` or both carry a value. The combined pair is validated against
            `libphonenumber` — combinations unreachable in any numbering plan are rejected.
          example: '+39'
        phone_national_number:
          type: string
          maxLength: 20
          nullable: true
          pattern: '^[0-9]+$'
          description: Unformatted national digits — no spaces, no dashes. Must be sent together with `phone_country_code`.
          example: '3331234567'
        website:
          type: string
          format: uri
          maxLength: 255
          nullable: true
          description: Public website URL (#162). Validated as a parseable URL — bare `@handles` are rejected.
          example: 'https://mariorossi.com'
        facebook:
          type: string
          format: uri
          maxLength: 255
          nullable: true
          description: Facebook profile URL (#162). Same shape as `website`.
          example: 'https://facebook.com/mariorossi'
        instagram:
          type: string
          format: uri
          maxLength: 255
          nullable: true
          description: Instagram profile URL (#162). Same shape as `website`.
          example: 'https://instagram.com/mariorossi'
        date_of_birth:
          type: string
          format: date
          nullable: true
          description: Must be strictly before today
        belt:
          $ref: '#/components/schemas/Belt'
        stripes:
          type: integer
          minimum: 0
          maximum: 4
          default: 0
        status:
          $ref: '#/components/schemas/AthleteStatus'
        joined_at:
          type: string
          format: date
        billing_period_months:
          type: integer
          enum: [1, 3, 6, 12]
          description: |
            How often this athlete pays (#1382). Defaults to monthly.
          example: 1
        fee_tier_id:
          type: integer
          format: int64
          nullable: true
          description: |
            Which line of the academy's monthly price list to put the athlete
            on (#1381). Omit or send `null` to leave them on the academy's flat
            `monthly_fee_cents`, which is where every athlete starts. Must be a
            tier belonging to the athlete's own academy — anything else is a
            422 on `fee_tier_id`.
          example: 3
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          nullable: true
          description: |
            Optional structured address (#72b). Send `null` (or omit the key)
            to leave the athlete without an address; send a full Address
            object to attach one. Half-filled payloads are rejected with 422.

    AthleteUpdateRequest:
      type: object
      description: All properties are optional — send only the fields you want to change.
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        phone_country_code:
          type: string
          maxLength: 5
          nullable: true
          pattern: '^\+[1-9][0-9]{0,3}$'
          description: |
            E.164 prefix including the leading `+`. Must be sent together with
            `phone_national_number`: either both fields are `null` or both carry a
            value. The combined pair is validated against `libphonenumber`.
          example: '+39'
        phone_national_number:
          type: string
          maxLength: 20
          nullable: true
          pattern: '^[0-9]+$'
          description: Unformatted national digits — must be sent together with `phone_country_code`.
          example: '3331234567'
        website:
          type: string
          format: uri
          maxLength: 255
          nullable: true
          description: Public website URL (#162). Validated as a parseable URL.
          example: 'https://mariorossi.com'
        facebook:
          type: string
          format: uri
          maxLength: 255
          nullable: true
          description: Facebook profile URL (#162).
          example: 'https://facebook.com/mariorossi'
        instagram:
          type: string
          format: uri
          maxLength: 255
          nullable: true
          description: Instagram profile URL (#162).
          example: 'https://instagram.com/mariorossi'
        date_of_birth:
          type: string
          format: date
          nullable: true
        belt:
          $ref: '#/components/schemas/Belt'
        stripes:
          type: integer
          minimum: 0
          maximum: 4
        status:
          $ref: '#/components/schemas/AthleteStatus'
        joined_at:
          type: string
          format: date
        billing_period_months:
          type: integer
          enum: [1, 3, 6, 12]
          description: |
            How often this athlete pays (#1382). Defaults to monthly.
          example: 1
        fee_tier_id:
          type: integer
          format: int64
          nullable: true
          description: |
            Which line of the academy's monthly price list to put the athlete
            on (#1381). Omit or send `null` to leave them on the academy's flat
            `monthly_fee_cents`, which is where every athlete starts. Must be a
            tier belonging to the athlete's own academy — anything else is a
            422 on `fee_tier_id`.
          example: 3
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          nullable: true
          description: |
            Structured address (#72b). Three semantics:
              - omit the key → no change
              - `null` → delete the existing address row
              - `{ ... }` → upsert (create or replace in place)

    AcademyFeeTier:
      type: object
      description: |
        One line of an academy's monthly price list (#1381) — a label, an
        amount, and how many lessons a week it buys.
      required: [id, label, amount_cents, lessons_per_week, athletes_count]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
          maxLength: 60
          description: |
            Whatever the owner calls it — "2 lezioni", "Ragazzi". Free text,
            because an academy's own vocabulary is the useful label. Unique
            within the academy.
          example: 2 lezioni
        amount_cents:
          type: integer
          minimum: 0
          description: |
            Monthly fee for this tier, in cents (€55.00 = `5500`). Zero is
            allowed — an academy may well list a free tier.
          example: 5500
        lessons_per_week:
          type: integer
          minimum: 1
          maximum: 14
          description: |
            How often this tier trains. Structured rather than buried in the
            label so the app can eventually ask questions of it; the 14 ceiling
            catches a fat finger, it does not model a rule.
          example: 2
        athletes_count:
          type: integer
          minimum: 0
          description: |
            How many athletes are on this tier. Deleting it hands all of them
            back to the academy's flat fee, so this is what makes the deletion
            a decision rather than a guess.
          example: 7

    AcademyFeeTierRequest:
      type: object
      required: [label, amount_cents, lessons_per_week]
      properties:
        label:
          type: string
          maxLength: 60
          example: 2 lezioni
        amount_cents:
          type: integer
          minimum: 0
          example: 5500
        lessons_per_week:
          type: integer
          minimum: 1
          maximum: 14
          example: 2

    AcademyFeeTierUpdateRequest:
      type: object
      description: All properties are optional — send only the fields you want to change.
      properties:
        label:
          type: string
          maxLength: 60
        amount_cents:
          type: integer
          minimum: 0
        lessons_per_week:
          type: integer
          minimum: 1
          maximum: 14

    AcademyFeeTierEnvelope:
