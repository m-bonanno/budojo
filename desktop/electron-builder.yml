# Packaging for Budojo Desktop (#1221). The installer CI that consumes this
# lands in #1231; the config sits here so `electron-builder` is runnable
# locally from the moment the scaffold exists.
appId: it.budojo.desktop
productName: Budojo
copyright: Budojo

# Explicit publish target so electron-builder resolves the auto-update
# metadata (app-update.yml) from these values instead of sniffing
# `.git/config` — which fails on a CI detached-HEAD tag checkout with
# "Cannot detect repository by .git/config". We do NOT auto-publish here:
# the installer CI uploads the assets itself via `gh release upload`, and
# the package scripts pass `--publish never`. This block only makes the
# metadata generation deterministic (and points a future auto-updater at
# the GitHub releases).
publish:
  provider: github
  owner: Budojo
  repo: budojo

directories:
  output: release
  buildResources: build

# Pointed at explicitly rather than left to the implicit `buildResources`
# lookup (#1306). `buildResources: build` alone is silent when it is wrong:
# the directory did not exist at all, electron-builder found no icon, fell
# back to the bundled Electron atom, and the build SUCCEEDED — which is how
# every release so far shipped with the default icon in the Start menu, the
# taskbar, the shortcut, the installer and Add/Remove Programs. Naming the
# files means a rename fails the build instead of quietly reverting.
#
# Both derive from client/public/icons/icon-512.png, the PWA icon — itself a
# derivative of the locked brand geometry (docs/design/brand-kit). Do not
# redraw them here; regenerate from upstream if the glyph ever changes.
#
#   icon.ico  Windows. Multi-resolution (256/128/64/48/32/24/16) because
#             Windows picks per surface; a single-size ICO is visibly soft in
#             the 16 px Start-menu row.
#   icon.png  512x512, what the Linux targets want (#1300).
icon: build/icon.png

# `dist/` is the compiled main + preload; `dist/renderer` is the Angular build
# copied in by the build script. The PHP runtime joins them in #1222 as an
# unpacked resource — it has to stay a real directory on disk because a child
# process cannot be spawned from inside an asar archive.
files:
  - dist/**/*
  - package.json

asar: true

win:
  # The multi-resolution ICO, not the PNG the root `icon` points at. Windows
  # picks a size per surface — 16 px in the Start-menu row, 32 in the taskbar,
  # 256 in the shortcut preview — and reads them out of the one file.
  icon: build/icon.ico
  # NSIS only. The portable target was removed in #1272 — see the note below
  # the nsis block for the measurements that killed it. NSIS is already
  # per-user (`perMachine: false`) and needs no administrator rights, which
  # was most of what "portable" was here to offer.
  target:
    - nsis
  # No code-signing certificate: it costs money, which is the entire point of
  # M11 (#1218). SmartScreen will warn on first install — documented in the
  # install guide (#1232) rather than papered over.

# Artifact names carry NO spaces, and that is load-bearing for auto-update
# (#1287), not cosmetic:
#   * we upload the file under its on-disk name, and GitHub rewrites spaces to
#     dots  ->  "Budojo.Setup.2.43.0.exe"
#   * electron-updater builds its download URL from latest.yml and rewrites
#     spaces to HYPHENS ("still replace space to - due to backward
#     compatibility", GitHubProvider.resolveFiles)  ->  "Budojo-Setup-2.43.0.exe"
# Those two never meet, so every download would 404 while the check itself
# looked healthy. Hyphens on disk make all three names identical.
nsis:
  # The installer chrome is a separate surface from the app icon: without
  # these the setup window and the Add/Remove Programs entry keep the Electron
  # atom even once the installed app is branded.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # The database lives in %APPDATA% (#1223), never in the install directory,
  # so an uninstall must not be able to take the user's data with it.
  deleteAppDataOnUninstall: false

# NOTE — there was a `portable` target here until #1272, and it is not coming
# back without new evidence. Not because self-extracting is a bad idea, but
# because OUR payload makes it one: electron-builder's portable stub unpacks
# the entire ~450 MB tree — the PHP runtime plus the whole Laravel `vendor/`,
# thousands of small files Defender re-scans — to %TEMP% on EVERY launch, with
# no window and no progress while it does. Measured on the shipped v2.42.0
# artefacts, same machine, process start to a 200 from /api/v1/health:
#
#   installed build   13.7 s first launch, 2.4 s after
#   portable          ~130 s, every launch
#
# `portable.unpackDirName` (a stable unpack directory instead of the default
# random one) does not help: the payload is re-extracted regardless, and it
# measured SLOWER — 188 s / 195 s. Do not retry it.
#
# So the honest options were shrink the payload or stop shipping the artefact,
# and the second one is what happened: NSIS is per-user, needs no admin
# rights, and starts in seconds. If a portable is ever wanted again, the
# payload has to shrink FIRST — the target is the easy part.

# Real directories on disk, outside the asar: a child process cannot be spawned
# from inside an archive, and PHP needs to require thousands of files by path.
# desktop/src/php-runtime.ts § resolveDesktopPaths assumes exactly this layout
# (resources/php/php.exe, resources/server/artisan). The build recipe that
# prepares server/ for shipping — composer install --no-dev, no .env, no tests,
# empty storage — is #1231's; the layout contract is fixed here.
extraResources:
  - from: runtime/php
    to: php
  - from: ../server
    to: server
    filter:
      - "**/*"
      - "!.env"
      - "!.env.*"
      - "!tests/**"
      - "!storage/logs/**"
      - "!storage/framework/cache/**"
      - "!storage/framework/sessions/**"
      - "!storage/framework/views/**"
      # PEST's faked disks and their fixtures. Missing from this list until
      # #1326, which meant two things: packaging DIED with EACCES whenever the
      # directory was owned by the API container's user — the normal state on a
      # Linux or WSL checkout — and when it did succeed it copied test scratch
      # into the shipped app.
      - "!storage/framework/testing/**"
      - "!storage/app/**"
      - "!database/sqlite/**"
      # Laravel's compiled caches. `bootstrap/cache/packages.php` and
      # `services.php` are package discovery — safe, and worth shipping, so this
      # is deliberately NOT a blanket `bootstrap/cache/**`.
      #
      # `config.php` is the dangerous sibling: its presence makes Laravel ignore
      # every file in `config/`, freezing the shipped app's entire configuration
      # at whatever the packaging machine had. On the desktop build two of those
      # values are per-launch — `APP_URL` is `http://127.0.0.1:<ephemeral port>`,
      # and `Storage::disk('public')->url()` is built from it, so a stale one
      # breaks every avatar, logo and thumbnail with a symptom identical to
      # #1302 and a completely unrelated cause. `DB_DATABASE` and
      # `LARAVEL_STORAGE_PATH` point into the per-user data directory (#1223).
      #
      # Nothing in the repo writes these today; one `php artisan optimize` on a
      # packaging machine is all it takes (#1315).
      - "!bootstrap/cache/config.php"
      - "!bootstrap/cache/routes-*.php"
      - "!bootstrap/cache/events.php"
      - "!node_modules/**"
      - "!.git*"
      - "!phpunit.xml"
      - "!phpstan.neon"
      - "!.php-cs-fixer*"
